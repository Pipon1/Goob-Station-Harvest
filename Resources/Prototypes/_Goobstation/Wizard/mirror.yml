- type: entity
  id: WizardMirror
  name: miroir magique
  description: 'Miroir, miroir sur le mur, qui est le plus robuste de tous ?'
  suffix: Sorcier
  components:
  - type: WallMount
  - type: Sprite
    sprite: Structures/Wallmounts/mirror.rsi
    state: mirror
  - type: InteractionOutline
  - type: Clickable
  - type: Transform
    anchored: true
  - type: WizardMirror
    allowedSpecies:
    - Human
    - Reptilian
    - SlimePerson
    - Diona
    - Vulpkanin
    - Felinid
    - Harpy
    - Rodentia
    - Oni
    - Yowie
    - Arachnid
    - Moth
    - Gingerbread
    - Vox
    - Dwarf
    - Resomi
    - IPC
    - BananaMen
    - Kobold
    - Monkey
    - Tajaran
    - Shadowkin
    - Chitinid
    - Feroxi
  - type: ActivatableUI
    key: enum.WizardMirrorUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.WizardMirrorUiKey.Key:
        type: WizardMirrorBoundUserInterface
