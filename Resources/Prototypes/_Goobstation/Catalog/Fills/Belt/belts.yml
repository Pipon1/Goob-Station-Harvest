- type: entity
  id: ClothingBeltHolsterFilledChaplain
  parent: ClothingBeltBase
  name: Holster des Chapelains
  description: Un holster d'épaule venu des Dieux. Contient une paire de pistolets jumeaux.
  suffix: Rempli, Chapelain
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _ShitChap/Clothing/Belt/holster.rsi
  - type: Clothing
    sprite: _ShitChap/Clothing/Belt/holster.rsi
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      item: !type:ContainerSlot {}
      item2: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      item:
        name: casul
        whitelist:
          tags:
          - WeaponPistolCasul
      item2:
        name: jackal
        whitelist:
          tags:
          - WeaponPistolJackal
  - type: ContainerFill
    containers:
      item:
      - WeaponPistolCasul
      item2:
      - WeaponPistolJackal
  - type: DivineIntervention
    validSpellDenialSlots:
    - BELT
  - type: Reflect
    reflectProb: 1
    slotFlags:
    - BELT
    reflects:
    - Magic
  - type: Tag
    tags:
    - ChaplainsHolster

