- type: entity
  id: CrateArmoryCombatHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: caisse de hardsuit de combat
  description: Contient un hardsuit de sécurité avancé. Nécessite l'accès à l'armurerie pour l'ouvrir.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatOfficer
        amount: 1

- type: entity
  id: CrateArmoryCombatMedicalHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: caisse de hardsuit médical de combat
  description: Contient un hardsuit médical de sécurité avancé, moins défensif mais bien moins encombrant. Nécessite l'accès à l'armurerie pour l'ouvrir.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatMedical
        amount: 1

- type: entity
  id: CrateArmoryCombatRiotHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: caisse de hardsuit anti-émeute
  description: Contient un hardsuit de sécurité anti-émeute avancé, très défensif mais aussi très encombrant. Nécessite l'accès à l'armurerie pour l'ouvrir.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatRiot
        amount: 1
