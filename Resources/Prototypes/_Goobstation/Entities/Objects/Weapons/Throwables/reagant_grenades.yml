- type: entity
  parent: SmokeGrenade
  id: LubeGrenade
  name: grenade à lubrifiant
  description: Une grenade qui libère de la mousse de Space Lube.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/foamdart.rsi
  - type: SmokeOnTrigger
    duration: 5
    spreadAmount: 25
    smokePrototype: Foam
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 20

- type: entity
  parent: SmokeGrenade
  id: GlueGrenade
  name: grenade à colle
  description: Une grenade qui libère de la mousse de Space Glue.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/smoke.rsi
  - type: SmokeOnTrigger
    duration: 5
    spreadAmount: 25
    smokePrototype: Smoke
    solution:
      reagents:
      - ReagentId: SpaceGlue
        Quantity: 20