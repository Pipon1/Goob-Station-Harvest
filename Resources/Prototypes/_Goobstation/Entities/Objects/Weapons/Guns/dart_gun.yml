- type: entity
  name: pistolet à fléchettes
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: DartGun
  description: "L'étiquette indique : « Interdyne Pharmaceutics n'est pas responsable des violations de la convention de Genève causées par une utilisation inappropriée. »"
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/dart_gun.rsi
    state: icon
  - type: Item
    size: Small
    storedRotation: -90
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: PacifismAllowedGun
  - type: Multishot # Goobstation V
    missChance: 0.2
    spreadMultiplier: 1
    spreadAddition: 15
  - type: AmmoCounter
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletDartGun
    capacity: 5
    count: 5
  - type: SolutionContainerManager
    solutions:
      solution:
        maxVol: 30
  - type: RefillableSolution
    solution: solution
  - type: ExaminableSolution
    solution: solution
  - type: GunApplySolution
  - type: Tag
    tags:
    - GunCanAimShooter

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBullet
  id: BulletDartGun
  name: fléchette chimique
  description: Celui-ci soigne-t-il ou blesse-t-il ?
  components:
  - type: Sprite
    sprite: Objects/Fun/Darts/dart_red.rsi
    layers:
    - state: icon
  - type: Projectile
    damage:
      types:
        Piercing: 1
    angle: -45
  - type: Ammo
    muzzleFlash: null
  - type: Reflective
    reflective: None
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 5
  - type: SolutionInjectOnProjectileHit
    transferAmount: 5
    solution: ammo
