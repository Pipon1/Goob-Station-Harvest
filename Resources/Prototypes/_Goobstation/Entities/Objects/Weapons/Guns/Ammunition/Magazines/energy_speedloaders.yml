- type: entity
  id: BaseEnergySpeedloader
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: /Textures/_Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/energy_speedloader.rsi
    state: icon-lethal
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatteryDrinkerSource
    maxAmount: 100
  - type: BatterySelfRecharger
    autoRechargeRate: 40
    autoRechargePauseTime: 12
  - type: AmmoCounter
  - type: Appearance
  - type: Tag
    tags:
      - EnergySpeedloader

- type: entity
  id: EnergySpeedloaderLethal
  parent: [ BaseEnergySpeedloader, BaseCentcommContraband ]
  name: chargeur rapide d'énergie (létal)
  description: Une pile d'énergie plutôt volatile utilisant du phoron pour charger des boulons létaux au fil du temps. Le phoron nous rendra tous riches.
  components:
  - type: BatteryAmmoProvider
    proto: BulletEnergyGunMagnum
    fireCost: 100
  - type: Tag
    tags:
      - EnergySpeedloader
      - EnergySpeedloaderLethal

- type: entity
  id: EnergySpeedloaderDisabler
  parent: [ BaseEnergySpeedloader, BaseCentcommContraband ]
  name: chargeur rapide d'énergie (neutralisant)
  description: Une pile d'énergie plutôt volatile utilisant du phoron pour charger des boulons neutralisants au fil du temps. Le phoron nous rendra tous riches.
  components:
  - type: Sprite
    state: icon-disabling
  - type: BatteryAmmoProvider
    proto: BulletEnergyGunDisabler
    fireCost: 50
  - type: Tag
    tags:
      - EnergySpeedloader
      - EnergySpeedloaderDisabler

- type: entity
  id: EnergySpeedloaderPulse
  parent: [ BaseEnergySpeedloader, BaseCentcommContraband ]
  name: chargeur rapide d'énergie (impulsion)
  description: Une pile d'énergie plutôt volatile utilisant du phoron pour charger des pulsations d'énergie destructrices au fil du temps. Le phoron nous rendra tous riches.
  components:
  - type: BatteryAmmoProvider
    proto: LightPulse
    fireCost: 50
  - type: Tag
    tags:
    - EnergySpeedloader
    - EnergySpeedloaderPulse
