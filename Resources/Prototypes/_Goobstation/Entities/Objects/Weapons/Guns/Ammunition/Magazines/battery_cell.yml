- type: entity
  id: BaseMilitaryPowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Item
  - type: Battery
    pricePerJoule: 0.15
  - type: BatteryDrinkerSource
  - type: PowerCell
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Appearance
  - type: Riggable
  - type: BatteryAmmoProvider
    proto: SmallRedLaser
    fireCost: 50
  - type: PhysicalComposition
    materialComposition:
      Steel: 80
      Gold: 40
      Glass: 40
      Plasma: 40
    chemicalComposition:
      Zinc: 7.5

# region SMG Power Cells
# base smg power cell
- type: entity
  id: BaseMilitaryPowerCellSMG
  abstract: true
  parent: BaseMilitaryPowerCell
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: icon
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o4
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryDrinkerSource
    maxAmount: 200
  - type: Tag
    tags:
    - MilitaryPowerCellSMG
    - MilitaryPowerCell
# basic smg power cell
- type: entity
  name: cellule d'énergie PM/SMG
  description: Une pile d'énergie militarisée compatible avec les lasers d'échelle PM/SMG.
  id: PowerCellIRSMG
  suffix: Pleine
  parent: BaseMilitaryPowerCellSMG
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_pistol_lethal.rsi
  - type: BatteryAmmoProvider
    proto: SMGLaser
    fireCost: 50
# x-ray smg power cell
- type: entity
  name: cellule d'énergie PM/SMG rayons X
  description: Une pile d'énergie militarisée compatible avec les lasers d'échelle PM/SMG qui tire des rayons X.
  id: PowerCellXraySMG
  suffix: Pleine
  parent: BaseMilitaryPowerCellSMG
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_pistol_xray.rsi
