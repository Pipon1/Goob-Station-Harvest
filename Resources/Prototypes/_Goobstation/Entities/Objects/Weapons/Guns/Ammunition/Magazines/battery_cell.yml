# region Revolver Power Cells
# base revolver power cell
- type: entity
  id: BaseMilitaryPowerCellRevolver
  abstract: true
  parent: BaseMilitaryPowerCell
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_revolver.rsi
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatteryDrinkerSource
    maxAmount: 100
  - type: Tag
    tags:
    - MilitaryPowerCellRevolver
    - MilitaryPowerCell
  - type: PhysicalComposition
    materialComposition:
      Steel: 40
      Gold: 20
      Glass: 20
      Plasma: 20
    chemicalComposition:
      Zinc: 5
# basic revolver power cell
- type: entity
  name: cellule d'énergie revolver
  description: Une pile d'énergie militarisée compatible avec les revolvers laser.
  id: PowerCellIRRevolver
  suffix: Pleine
  parent: BaseMilitaryPowerCellRevolver
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: lethal_charge
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        base:
          True:
            state: lethal_charge
            shader: unshaded
          False:
            state: lethal
            shader: null
  - type: BatteryAmmoProvider
    proto: RevolverRedLaser
    fireCost: 62.5
