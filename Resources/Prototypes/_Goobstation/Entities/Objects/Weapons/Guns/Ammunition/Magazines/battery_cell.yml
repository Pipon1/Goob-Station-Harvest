    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_lmg.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: icon
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o4
      shader: unshaded
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: Battery
    maxCharge: 3000
    startingCharge: 3000
  - type: BatteryDrinkerSource
    maxAmount: 500
