- type: entity
  id: BaseHardlightArrow
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Bow/arrow.rsi
    state: icon
    shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Reflective
    reflective:
    - Energy
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.2,0.1,0.2"
        hard: false
        mask:
        - Opaque
  - type: Ammo
    muzzleFlash: null
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Heat: 45
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    color: white
    radius: 1.5
    energy: 1.5

- type: entity
  id: BaseHardlightEmbeddableArrow
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Small
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    embedOnThrow: false
    deleteOnRemove: true
  - type: ThrowingAngle
    angle: 0

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowEnergy
  name: flèche énergétique
  description: Une flèche faite de lumière dure.
  components:
  - type: Sprite
    color: "#FFB200"
  - type: PointLight
    color: "#FFB200"

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowDisabler
  name: flèche paralysante
  description: Une flèche faite de lumière dure. Celle-ci étourdit la victime de façon non-létale.
  components:
  - type: Sprite
    color: "#00B2FF"
  - type: PointLight
    color: "#00B2FF"
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: StaminaDamageOnCollide
    damage: 60
    overtime: 30

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowFiery
  name: flèche brûlante
  description: Une flèche faite de lumière dure. Celle-ci brûle la victime.
  components:
  - type: Sprite
    color: red
  - type: PointLight
    color: red
  - type: Projectile
    damage:
      types:
        Heat: 15
  - type: IgniteOnCollide
    fireStacks: 4

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowFreeze
  name: flèche glaciale
  description: Une flèche faite de lumière dure. Celle-ci gèle la victime.
  components:
  - type: Sprite
    color: blue
  - type: PointLight
    color: blue
  - type: Projectile
    damage:
      types:
        Cold: 10
  - type: ChangeTemperatureOnCollide
    heat: -600000

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowExplosive
  name: flèche explosive
  description: Une flèche faite de lumière dure. Celle-ci explose à l'impact, mais l'énergie se dissipe vite, elle ne vole pas très loin.
  components:
  - type: Sprite
    color: "#7300FF"
  - type: PointLight
    color: "#7300FF"
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: TimedDespawn
    lifetime: 0.7
  - type: TriggerOnCollide
    fixtureID: projectile
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 18
    intensitySlope: 0.6
    maxIntensity: 6
    canCreateVacuum: false

- type: entity
  parent: BaseHardlightArrow
  id: ArrowXray
  name: flèche rayons X
  description: Une flèche faite de lumière dure. Celle-ci traverse tout.
  components:
  - type: Sprite
    color: "#1AE51A"
  - type: PointLight
    color: "#1AE51A"
  - type: Projectile
    penetrate: true
    noPenetrateMask:
    - BlobImpassable
    damage:
      types:
        Heat: 30
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.2,0.1,0.2"
        hard: false
        mask:
        - Opaque
  - type: TimedDespawn
    lifetime: 0.7

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowBee
  name: flèche à abeilles
  description: Une flèche faite de lumière dure. Celle-ci invoque des abeilles en colère.
  components:
  - type: Sprite
    color: yellow
  - type: PointLight
    color: yellow
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: SpawnEntitiesOnHit
    spawnOnlyIfHitMob: true
    proto: MobAngryBeeWeak
    amount: 8
    collideIgnoreEntities:
    - MobBee
    - MobAngryBee
    - MobSyndieAngryBee
    - MobAngryBeeWeak

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowIon
  name: flèche ionique
  description: Une flèche faite de lumière dure. Provoque une EMI à l'impact.
  components:
  - type: Sprite
    color: silver
  - type: PointLight
    color: silver
  - type: Projectile
    damage:
      types:
        Ion: 60
  - type: TriggerOnCollide
    fixtureID: projectile
  - type: EmpOnTrigger
    range: 1
    energyConsumption: 360
    disableDuration: 5
