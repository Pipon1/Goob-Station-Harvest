# Snacks
- type: entity
  parent: FoodSnackBase
  id: FoodSnackProteinbar
  name: barre protéinée
  description: Barres protéinées de marque SwoleMAX, garanties pour vous faire vous sentir parfaitement trop confiant.
  components:
  - type: FlavorProfile
    flavors:
      - chalky
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/bay_food.rsi
    state: proteinbar
  - type: Item
  - type: Edible
    trash:
    - FoodPacketProteinbarTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: CocoaPowder
          Quantity: 1
        - ReagentId: Theobromine
          Quantity: 1

- type: entity
  name: chienmite
  parent: FoodMeatBase
  id: FoodSnackMothdog
  description: Il est dans la fleur de l'âge.
  components:
  - type: Tag
    tags:
    - Cooked
  - type: FlavorProfile
    flavors:
    - chuddy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/mothdog.rsi
    layers:
    - state: mothdog-4
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: mothdog-
    changeColor: false
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 10
  - type: Appearance
  - type: Edible
    trash:
    - FoodSnackMothdogTrash

