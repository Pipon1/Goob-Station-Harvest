- type: entity
  parent: BaseFoodCondimentPacket
  id: FoodCondimentPacketProtein
  name: sachet de protéine en poudre
  description: Contient 10u de protéine en poudre. Mélanger avec 20u d'eau.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Protein
          Quantity: 10
  - type: Icon
    state: packet-greygoo
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: packet-solid-

- type: entity
  name: bloc de fromage de la liberté
  parent: FoodBakingBase
  id: FoodFreedomCheeseBlock
  description: Un bloc solide de fromage bouchant les artères basé sur une vieille recette mondiale douteuse. Tranchiez-le pour vos copains... ou mangez tout le bloc vous-même, vous êtes bizarre.
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_block
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 28
        reagents:
        - ReagentId: Nutriment
          Quantity: 16
        - ReagentId: GastroToxin
          Quantity: 4
  - type: SliceableFood
    count: 4
    slice: FoodFreedomCheeseSlice


- type: entity
  name: tranche de fromage de la liberté
  parent: FoodBakingBase
  id: FoodFreedomCheeseSlice
  description: Amalgame hautement douteux de cheddar, de sucre et de l'esprit de la liberté. La soins de santé de NanoTrasen ne couvre pas les incidents liés à la consommation de cet article.
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: GastroToxin
          Quantity: 1
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Burger: FSE_FoodFreedomCheeseSlice
