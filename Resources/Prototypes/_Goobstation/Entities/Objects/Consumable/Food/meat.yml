- type: entity
  name: viande de gondola crue
  parent: FoodMeatRawBase
  id: FoodMeatGondola
  description: Monstre.
  components:
  - type: Sprite
    state: plain
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 9
        - ReagentId: Fat
          Quantity: 9
        - ReagentId: Tranquility
          Quantity: 10
  - type: Construction
    graph: GondolaSteak
    node: start
    defaultTarget: gondola steak

- type: entity
  name: steak de gondola
  parent: FoodMeatBase
  id: FoodMeatGondolaCooked
  description: Viande de gondola cuite, dure.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    layers:
    - state: plain-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Tranquility
          Quantity: 15
  - type: Construction
    graph: GondolaSteak
    node: gondola steak

- type: entity
  name: viande de bingle crue
  parent: FoodMeatRawBase
  id: FoodMeatBingle
  description: Sent la merde.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/bingle.rsi
    state: binglemeat
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 10
        - ReagentId: Fat
          Quantity: 9
        - ReagentId: BingleJuice
          Quantity: 1
  - type: Construction
    graph: BingleSteak
    node: start
    defaultTarget: bingle steak

- type: entity
  name: steak de bingle
  parent: FoodMeatBase
  id: FoodMeatBingleCooked
  description: Sent toujours la merde.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/bingle.rsi
    state: cookedbinglemeat
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 9
        - ReagentId: Protein
          Quantity: 9
        - ReagentId: BingleJuice
          Quantity: 2
  - type: Construction
    graph: BingleSteak
    node: bingle steak

- type: entity
  name: '"poulet" frit'
  parent: FoodMeatBase
  id: FoodMeatVoxFried
  description: Un morceau juteux de viande de poulet... je crois...
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: FlavorProfile
    flavors:
    - chuddy
  - type: Sprite
    layers:
    - state: chicken-fried
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          chicken-fried: ""
          chicken2-fried: ""
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Ammonia
          Quantity: 5
  - type: FoodSequenceElement
    entries:
      Burger: FSE_FoodMeatVoxFried
      Taco: FSE_FoodMeatVoxFried
      Skewer: FSE_FoodMeatVoxFriedSkewer
