# Black Caviar

- type: entity
  parent: FoodTinBase
  id: FoodBlackCaviar
  name: black caviar
  description: Une boîte de caviar noir avec un onglet pratique. A l'air coûteux.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/black_caviar.rsi
  # the convenient pull tab
  - type: Openable
    openableByHand: true
  - type: FlavorProfile
    flavors:
    - rich
    - fish
    - salty
  - type: Edible
    trash:
    - FoodBlackCaviarTrash

- type: entity
  parent: FoodTinBaseTrash
  id: FoodBlackCaviarTrash
  name: black caviar
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/black_caviar.rsi


