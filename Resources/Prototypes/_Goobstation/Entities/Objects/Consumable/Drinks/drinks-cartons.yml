- type: entity
  parent: DrinkCartonBaseFull
  id: DrinkCartonBaseSmallFull
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 25

- type: entity
  parent: [DrinkBaseMaterialCardboard, DrinkCartonBaseFull, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: DrinkMilkCartonMini
  name: mini lait
  description: Un liquide blanc opaque produit par les glandes mammaires des mammifères.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 25
        reagents:
        - ReagentId: Milk
          Quantity: 25
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Drinks/milkmini.rsi
    state: icon

- type: entity
  parent: [DrinkBaseMaterialCardboard, DrinkCartonBaseFull, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: DrinkMilkCartonMiniChocolate
  name: mini lait choco
  description: Une boisson au lait aromatisée au chocolat.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 25
        reagents:
        - ReagentId: MilkChoco
          Quantity: 25
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Drinks/milkminichoco.rsi
    state: icon
