- type: entity
  parent: BaseItem
  name: papier de rapport de station
  id: NanoRepStationReport
  description: Le document est fait d'or, mais vous pouvez quand même écrire dessus.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: station-report-paper
  - type: StationReport
  - type: Paper
    content: station-report-text
  - type: PaperLabelType
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
