# Antag Planet

- type: entity
  parent: BaseSubdermalImplant
  id: AntagImplantChangeling
  name: implant de changelin
  description: Cet implant permet à l'utilisateur de transformer son corps comme un changelin.
  categories: [ HideSpawnMenu ]
  components:
  - type: ComponentsImplant
    added:
    - type: Changeling
    - type: ChangelingIdentity
    - type: Store
    # this shit is broken still CBF to fix it but you need to make it find or add a ling rule, then MakeChangeling it
    removed:
    - type: Hunger
    - type: Thirst

- type: entity
  parent: BaseSubdermalImplant
  id: AntagImplantSpaceNinja
  name: implant de ninja
  description: This implant allows the user to gain the skills of a space ninja.
  categories: [ HideSpawnMenu ]
  components:
  - type: ComponentsImplant
    added:
    - type: SpaceNinja

- type: entity
  parent: BaseSubdermalImplant
  id: XenoCompatibilityImplant
  name: implant de compatibilité xéno
  description: Permet à un sujet de recevoir des organes xéno transplantés.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    whitelist:
      requireAll: true
      components: # should cover all the bases (no IPCs)
      - Body
      - Bloodstream
      - Dna
  - type: ComponentsImplant
    added:
    - type: XenoCompatible

- type: entity
  parent: BaseSubdermalImplant
  id: RedspaceLifelineImplant
  name: implant de bouée de sauvetage redspace
  description: Téléporte le corps de l'hôte vers le Haut Commandement Syndicat à l'activation. Il ne pourra pas revenir.
  categories: [ HideSpawnMenu ]
