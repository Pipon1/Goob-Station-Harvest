- type: entity
  parent: [BaseGuidebook, BaseMagicalContraband]
  id: GuidebookCodexUmbra
  suffix: guidebook
  name: Codex Umbra
  description: Un vieux livre étroitement enroulé dans du cuir sombre. Il détaille divers contrats et leurs effets.
  components:
  - type: Sprite # Change to a unique one
    layers:
    - state: paper
    - state: cover_base
      color: black
    - state: decor_wingette
      color: "#7e0100"
  - type: Tag
    tags:
    - Book
    - Paper
  - type: GuideHelp
    openOnActivation: true
    guides:
    - DevilClauses

- type: entity
  id: AdvMimeryVol1
  parent: [BaseSyndicateContraband, BaseSpellbook]
  name: Guide de mime avancé Vol 1
  description: Les pages ne font aucun son quand on les tourne.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/bookmime.rsi
    layers:
    - state: icon
  - type: Spellbook
    spellActions:
      ActionInvisibleBlockade: null
    learnPermanently: true

- type: entity
  id: AdvMimeryVol2
  parent: [BaseSyndicateContraband, BaseSpellbook]
  name: Guide de mime avancé Vol 2
  description: Il n'y a aucun mot d'écrit...
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/bookmime.rsi
    layers:
    - state: icon
  - type: Spellbook
    spellActions:
      ActionFingerGuns: null
    learnPermanently: true

- type: entity
  id: BoxAdvMimery
  parent: [BaseSyndicateContraband, BoxCardboard]
  name: Boîte de la série Guide de mime avancé
  components:
  - type: StorageFill
    contents:
    - id: AdvMimeryVol1
    - id: AdvMimeryVol2
    - id: ClothingMaskMime
