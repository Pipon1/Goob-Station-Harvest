# Chrono Legioneers
- type: entity
  parent: IDCardStandard
  id: ChronoIDCard
  name: carte d'identité futuriste
  description: La carte qui à l'origine donnait accès à tout dans cet univers.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/id_cards.rsi
    layers:
    - state: future
    - state: idchrono
  - type: Item
    heldPrefix: blue
  - type: IdCard
    jobTitle: job-name-futureagent
    jobIcon: JobIconFuture
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - NanotrasenRepresentative
    - BlueshieldOfficer
    - Wizard
    - NuclearOperative
    - SyndicateAgent

