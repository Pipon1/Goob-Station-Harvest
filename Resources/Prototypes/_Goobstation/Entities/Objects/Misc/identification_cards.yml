# Executive Access
- type: entity
  parent: IDCardStandard
  id: ExecutiveIDCard
  name: carte d'accès exécutif
  description: Les employés de Nanotrasen sont légalement tenus d'écouter quelqu'un qui possède cette carte. Elle est aussi capable de forcer les verrous d'accès sur la plupart des appareils.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/executive.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Objects/Misc/executive.rsi
    quickEquip: true
    slots:
    - neck
    - idcard
  - type: Item
    heldPrefix:
    sprite: _Goobstation/Objects/Misc/executive.rsi
  - type: IdCard
    jobTitle: job-name-exec
    jobIcon: JobIconNanotrasen
  - type: Emag
    emagType: Access
    emagSound: /Audio/_Goobstation/Items/card_swipe.ogg
    successText: executive-card-success
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - NanotrasenRepresentative
    - BlueshieldOfficer

- type: entity
  parent: ExecutiveIDCard
  id: ExecutiveIDCardChameleon
  name: carte d'accès exécutif
  description: Mêmes caractéristiques que la version originale, mais peut changer d'apparence.
  components:
  - type: AgentIDCard
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    inHandsOnly: true
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: ChameleonClothing
    slot: [ idcard ]
    default: ExecutiveIDCard
  - type: UserInterface
    interfaces:
     enum.AgentIDCardUiKey.Key:
        type: AgentIDCardBoundUserInterface
     enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface


