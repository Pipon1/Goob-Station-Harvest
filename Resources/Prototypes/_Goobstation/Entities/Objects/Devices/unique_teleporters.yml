- type: entity
  parent: BaseItem
  id: BaseLockerTeleporter
  abstract: true
  name: téléporteur d'équipement spécial
  description: Dispositif permettant de demander la livraison d'un équipement spécial.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Devices/unique_teleporters.rsi
  - type: Item
    sprite: _Goobstation/Objects/Devices/unique_teleporters.rsi
  - type: UseOnStationOnly
  - type: SpawnItemsOnUse
    sound: /Audio/Items/Mining/fultext_launch.ogg

- type: entity
  parent: BaseLockerTeleporter
  id: BlueshieldOfficerLockerTeleporter
  name: téléporteur de casier d'agent blueshield
  description: Dispositif permettant de demander la livraison d'un casier d'agent blueshield.
  components:
  - type: Sprite
    state: bso
  - type: SpawnItemsOnUse
    items: 
    - id: UniqueLockerBlueshieldOfficerFilled

- type: entity
  parent: BlueshieldOfficerLockerTeleporter
  id: UniqueBlueshieldOfficerLockerTeleporter
  suffix: Unique
  categories: [ HideSpawnMenu ]
  components:
  - type: UniqueEntityChecker
    markerName: BlueshieldLocker
  - type: UniqueEntityMarker
    markerName: BlueshieldLocker
    stationOnly: false

- type: entity
  parent: BaseLockerTeleporter
  id: NanorepLockerTeleporter
  name: téléporteur de casier de représentant Nanotrasen
  description: Dispositif permettant de demander la livraison d'un casier de représentant Nanotrasen.
  components:
  - type: Sprite
    state: ntr
  - type: SpawnItemsOnUse
    items: 
    - id: UniqueLockerNanorepFilled

- type: entity
  parent: NanorepLockerTeleporter
  id: UniqueNanorepLockerTeleporter
  suffix: Unique
  categories: [ HideSpawnMenu ]
  components:
  - type: UniqueEntityChecker
    markerName: NanorepLocker
  - type: UniqueEntityMarker
    markerName: NanorepLocker
    stationOnly: false