- type: entity
  name: localisateur d'anomalie
  description: Un dispositif de suivi portable qui se verrouille sur toute anomalie quand il est éteint. Gardez-le droit pour conserver la précision.
  id: PinpointerAnomaly
  parent: PinpointerBase
  components:
  - type: Sprite
    layers:
    - state: pinpointer-science
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-science
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true
    retargetingWhitelist:
      components:
      - Anomaly

- type: entity
  name: localisateur d'artefact
  description: Un dispositif de suivi portable qui suit tous les artéfacts proches. Gardez-le droit pour conserver la précision.
  id: PinpointerArtifact
  parent: PinpointerBase
  components:
  - type: Sprite
