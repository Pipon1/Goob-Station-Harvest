- type: entity
  name: localisateur de station
  description: Un dispositif de suivi portable qui suit toutes les stations proches. Gardez-le droit pour conserver la précision.
  id: PinpointerStationGoob
  parent: PinpointerBase
  components:
  - type: Sprite
    layers:
    - state: pinpointer-crewprox
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-crewprox
  - type: Pinpointer
    targetName: nearest station
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - BecomesStation
      - LavalandStation # Lavaland change

- type: entity
  name: localisateur de voleur
  description: Un dispositif de suivi portable qui peut cibler tout ce qui vaut le coup, y compris les objets à haut risque et les structures volables quand il est éteint. Gardez-le droit pour conserver la précision.
  id: PinpointerThief
  parent: [ PinpointerBase, BaseMinorContraband ]
  components:
  - type: Sprite
    layers:
    - state: pinpointer_thief
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer_thief
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true
    retargetingWhitelist: # Goob edit: pinpointer whitelist
      components:
      - StealTarget # You can marker your objective with it!

- type: entity
  name: localisateur de bombe nucléaire du syndicat
  description: Produit spécifiquement pour les missions d'opérateurs nucléaires, obtenez cette bombe nucléaire !
  id: PinpointerSyndicateNuclearFission
  parent: [ PinpointerBase, BaseSyndicateContraband ]
  components:
  - type: Sprite
    layers:
    - state: pinpointer-syndicate
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-syndicate
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - Nuke
    # TODO: add a special component to Syndicate nuke, so pinpointers can
    # ignore it and instead track only station nukes
    targetName: nuclear fission explosive

- type: entity
  name: localisateur de contractor
  description: Un dispositif de suivi portable qui pointe vers votre vaisseau et votre cible. Gardez-le droit pour conserver la précision.
  id: PinpointerContractor
  parent: PinpointerBase
  components:
  - type: Sprite
    noRot: True
    sprite: _Goobstation/Objects/Devices/contractorpinpointer.rsi
    layers:
    - state: pinpointer-contractor
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _Goobstation/Objects/Devices/contractorpinpointer.rsi
    state: pinpointer-contractor
  - type: Item
    sprite: _Goobstation/Objects/Devices/contractorpinpointer.rsi
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true


- type: entity
  name: localisateur de seigneur du mal
  id: PinpointerDarkLord
  parent: [ PinpointerBase, BaseCommandContraband ]
  components:
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - DarkLordMarker
    targetName: the Dark Lord
