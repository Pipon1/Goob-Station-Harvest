- type: entity
  id: BaseHandheldStationMapPowerCe
  name: console d'alimentation portable
  description: Console de carte d'alimentation portable finement conçue pour les ingénieurs en chef. Permet à l'utilisateur de visualiser le réseau électrique.
  parent: BaseItem
  components:
    - type: StationMap
    - type: Sprite
      sprite: _Goobstation/Objects/Devices/tablets.rsi
      layers:
        - state: tablet
        - state: powerconsole
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      key: enum.PowerMonitoringConsoleUiKey.Key
    - type: PowerMonitoringConsole
    - type: PowerMonitoringCableNetworks
    - type: NodeContainer
    - type: UserInterface
      interfaces:
        enum.PowerMonitoringConsoleUiKey.Key:
          type: PowerMonitoringConsoleBoundUserInterface