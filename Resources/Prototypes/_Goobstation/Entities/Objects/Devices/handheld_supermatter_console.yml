- type: entity
  id: BaseHandheldStationMapSupermatterCe
  name: console de supermatter portable
  description: Console de supermatter portable finement conçue pour les ingénieurs en chef. Permet à l'utilisateur de visualiser l'état de la supermatter.
  parent: BaseItem
  components:
    - type: StationMap
    - type: Sprite
      sprite: _Goobstation/Objects/Devices/tablets.rsi
      layers:
        - state: tablet
        - state: supermatterconsole
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      key: enum.SupermatterConsoleUiKey.Key
    - type: SupermatterConsole
    - type: UserInterface
      interfaces:
        enum.SupermatterConsoleUiKey.Key:
          type: SupermatterConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
