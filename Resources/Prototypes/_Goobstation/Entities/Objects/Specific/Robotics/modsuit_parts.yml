- type: entity
  id: ModsuitCoreStandard
  parent: PartModsuit
  name: noyau standard MOD
  description: Poussant dans les zones les plus luxuriantes et fertiles de la planète Sprout, il existe un cristal connu sous le nom de Cœur-Éclat. Ces cristaux piézoélectriques organiques rares ont une importance culturelle incroyable pour les castes d'artistes des Éthérés, en raison de leur apparence ; qui est exactement similaire à celle du cœur d'un Éthéré. On ne sait pas lequel vous avez dans votre combinaison, mais dans tous les cas, il a été réutilisé pour être une source d'énergie interne d'un Dispositif Modulaire Extérieur.
  components:
  - type: Sprite
    state: mod-core-standard
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: PhysicalComposition
    materialComposition:
      Plasma: 50
      Glass: 25
