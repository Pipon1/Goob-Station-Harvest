- type: entity
  id: PartModsuit
  parent: BaseItem
  name: pièce MOD
  description: Une pièce utilisée dans la construction MOD.
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Robotics/modsuit_parts.rsi
  - type: Icon
    sprite: _Goobstation/Objects/Specific/Robotics/modsuit_parts.rsi
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  #- type: GuideHelp TODO: Guide

- type: entity
  id: ModsuitChestplate
  parent: PartModsuit
  name: plastron MOD
  components:
  - type: Sprite
    state: chestplate
  - type: Icon
    state: chestplate
  - type: PhysicalComposition
    materialComposition:
      Steel: 62
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitChestplate

