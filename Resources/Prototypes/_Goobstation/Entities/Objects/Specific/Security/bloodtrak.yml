- type: entity
  name: bloodtrak
  description: Un dispositif de suivi portable, capable de suivre quelqu'un à partir de son ADN. Ce modèle particulier ne fonctionne que sur les flaques, et seulement pour une courte durée.
  parent: [BaseItem, BaseSecurityContraband]
  id: BloodTrak
  components:
  - type: Transform
    noRot: True
  - type: Sprite
    noRot: True
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer-detective
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Objects/Devices/pinpointer.rsi
    state: pinpointer-detective
  - type: Item
    sprite: Objects/Devices/pinpointer.rsi
  - type: Bloodtrak
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PinpointerVisuals.IsActive:
        enum.PinpointerLayers.Screen:
          True: { visible: True }
          False: { visible: False }
      enum.PinpointerVisuals.TargetDistance:
        enum.PinpointerLayers.Screen:
          Unknown: { state: pinonnull }
          Reached: { state: pinondirect }
          Close: { state: pinonclose }
          Medium: { state: pinonmedium }
          Far: { state: pinonfar }
  - type: AnimationPlayer
