- type: entity
  parent: ShardCrystalRed
  id: ShardCrystalStyptic
  name: éclat de cristal styptique
  components:
  - type: Extractable
    grindableSolutionName: crystal
  - type: SolutionContainerManager
    solutions:
      crystal:
        reagents:
        - ReagentId: StypticPowder
          Quantity: 10

- type: entity
  name: viande synthétique
  parent: FoodMeatRotten # you can, but you shouldn't eat this
  id: FoodMeatSynth
  description: Un morceau de... viande synthétique ? Créé artificiellement. Peut-on même le cuisiner ? Mieux vaut ne pas le manger.
  components:
  - type: Sprite
    state: bear # looks pretty disgusting
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Synthflesh
          Quantity: 20
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
        - ReagentId: GastroToxin
          Quantity: 5
  - type: FoodSequenceElement
    entries:
      Burger: FSE_FoodMeatSynth # just in case you really want to
      Taco: FSE_FoodMeatSynth
