- type: entity
  name: sedative autoinjector cartridge
  parent: [ BaseSyndicateContraband , BaseAutoinjectorCartridge ]
  description: Contient 4u de tirizène, 3u d'impédrezène et 3u d'halopéridol, utilisée dans un auto-injecteur à cartouche.
