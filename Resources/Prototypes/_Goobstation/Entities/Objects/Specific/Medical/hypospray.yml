# Cartridge Autoinjectors

- type: entity
  parent: BaseItem
  id: BaseCartridgeAutoinjector
  abstract: true
  components:
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/autoinjector.rsi
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/autoinjector.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: cartridge
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: HyposprayBlockNonMobInjection
  - type: UseDelay
    delay: 30
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: Cartridge
        whitelist:
          tags:
          - AutoinjectorCartridge

- type: entity
  name: security cartridge autoinjector
  parent: [ BaseCartridgeAutoinjector , BaseSecurityContraband ]
  description: Used for rapid administration of medicine. Uses cartridges printable at the security techfab.
  id: SecHypo
  components:
  - type: Sprite
    layers:
      - state: security-base
      - state: cartridge1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: UseDelay
    delay: 45 # up this later if its too low
  - type: Tag
    tags:
      - SecBeltEquip

- type: entity
  name: medical cartridge autoinjector
  parent: [ BaseCartridgeAutoinjector , BaseMedicalContraband ]
  description: Used for rapid administration of medicine. Uses cartridges printable at the medical techfab.
  id: ParamedHypo
  components:
  - type: Sprite
    layers:
      - state: medical-base
      - state: cartridge1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false

- type: entity # This ones weird.
  name: amnestic spray
  parent: [BaseItem, BaseCentcommContraband]
  id: AmnestizineHypospray
  suffix: NE PAS PLACER
  description: Un injecteur à cartouche spécialisé destiné au personnel du Commandement Central. Principalement utilisé pour injecter des amnésiques.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/amnestic_hypo.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/amnestic_hypo.rsi
  - type: UseDelay
    delay: 3
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: HyposprayBlockNonMobInjection
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: Cartridge
        whitelist:
          tags:
          - AutoinjectorCartridge

# Autoinjector Cartridges

- type: entity
  name: autoinjector cartridge
  parent: BaseItem
  description: Utilisée dans un auto-injecteur à cartouche.
  id: BaseAutoinjectorCartridge
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/cartridge.rsi
    layers:
    - state: base
    - state: filling
      color: "#ffffff"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
  - type: Tag
    tags:
      - AutoinjectorCartridge
      - SecBeltEquip

- type: entity
  name: adrenaline autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contient 7u d'épinéphrine et 3u d'acide tranexamique, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeEpinephrine
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#cad8d4"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Epinephrine
        Quantity: 7
      - ReagentId: TranexamicAcid
        Quantity: 3 # Fully stops bleeding

- type: entity
  name: airloss autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contient 7u de solution saline et 3u de dexaline plus, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeSaline
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#1776c4"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Saline
        Quantity: 7
      - ReagentId: DexalinPlus
        Quantity: 3

- type: entity
  name: brute autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contient 4u de bicaridine, 4u d'ibuprofène, 1u d'acide salicylique et 1u d'acide tranexamique, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeBicaridine
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#c5932d"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Bicaridine
        Quantity: 4
      - ReagentId: Ibuprofen
        Quantity: 4
      - ReagentId: SalicylicAcid
        Quantity: 1
      - ReagentId: TranexamicAcid
        Quantity: 1 # Stops 30% of maximum bleeding
  #If you have a full dmg spread, it'll heal ~60 dmg , down from previous 96
  #It will heal 20 dmg if you only have one dmg type and you have more than 25 dmg (see salicylic acid)
- type: entity
  name: burn autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contient 5u de kélotane, 4u de dermaline, 1u de léporazine, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeDermaline
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#956960"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Kelotane
        Quantity: 5
      - ReagentId: Dermaline
        Quantity: 4
      - ReagentId: Leporazine #will minorly help with temperature regulation
        Quantity: 1
#what were they cooking here before, 114 total possible dmg heal was crazyyy
#~21 dmg healed/dmg type (unless its cold, then its a lil more), doesnt heal caustic all that well
- type: entity
  name: emergency autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contient 10u d'atropine, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeAtropine
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#572757"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Atropine
        Quantity: 10

- type: entity
  name: piercing autoinjector cartridge
  parent: [ BaseSyndicateContraband , BaseAutoinjectorCartridge ]
  description: Contient 10u de puncturase, utilisée dans un auto-injecteur à cartouche.
  id: CartridgePuncturase
  components:
  - type: Sprite
    layers:
