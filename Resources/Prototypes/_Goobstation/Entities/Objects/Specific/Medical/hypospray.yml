# Q - Why is this edible?
# A - Because the dispenser reminded me of a pez dispenser, and it'd be funny if you could eat them.
- type: entity
  name: amnestic autoinjector cartridge
  parent: [ BaseCentcommContraband , BaseAutoinjectorCartridge, EdibleBase ]
  description: Contient 10u d'acide dimtréméthique-neuraminyle, utilisée dans un auto-injecteur à cartouche.
  id: CartridgeAmnestic
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#FAF9F6"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Amnestizine
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Amnestizine
          Quantity: 10
  - type: Edible
    delay: 0.2
    forceFeedDelay: 1.5
    transferAmount: null
    useSound: /Audio/Items/pill.ogg
  - type: BadFood
  - type: FlavorProfile
    ignoreReagents: [ ]

# Medipens

- type: entity
  name: futuristic medipen
  parent: ChemicalMedipen
  id: StasiziumAutoInjector
  suffix: NE PAS PLACER
  description: Une dose de substances médicinales du futur qui peut même remettre les morts sur pied.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/stasipen.rsi
    layers:
    - state: stasipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: stasipen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: Stasizium
          Quantity: 10

- type: entity
  name: centcomm advanced stimulant
  parent: [ChemicalMedipen, BaseCentcommContraband]
  id: CentcommStimpack
  suffix: NE PAS PLACER
  description: Selon une étude financée par Nanotrasen, il n'a aucune propriété addictive.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: ntstimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 50
        reagents:
        - ReagentId: Stimulants
          Quantity: 25
        - ReagentId: Ichor
          Quantity: 10
        - ReagentId: Dylovene
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: ntstimpen_empty
  - type: StaticPrice
    price: 500

- type: entity
  name: biohazard medipen
  parent: ChemicalMedipen
