- type: entity
  name: tennis racket
  parent: BaseItem
  id: BaseTennisRacket
  description: Une raquette de tennis robuste.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/tennis_racket.rsi
    state: tennis_racket
  - type: MeleeWeapon
    animationRotation: -135
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 1
    soundHit:
      path: /Audio/Effects/egloves.ogg
  - type: MeleeThrowOnHit # diabolical numbers but needed to play tennis
    distance: 1
    speed: 20
  - type: Item
    size: Normal
    sprite: _Goobstation/Objects/Fun/tennis_racket.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 250


- type: entity
