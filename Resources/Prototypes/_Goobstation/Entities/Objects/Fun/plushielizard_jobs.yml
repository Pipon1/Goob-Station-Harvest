# This base is created so we don't have to define the different sprite path for each plushie job.
- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBlueshieldOfficer
  name: peluche lézard agent blueshield
  description: Une adorable peluche ressemblant à un lézard en agent blueshield. Un coup de cette peluche suffira à faire fuir tous les malfaiteurs.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: bso

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobNanotrasenRepresentative
  name: peluche lézard représentant Nanotrasen
  description: Une adorable peluche ressemblant à un lézard en représentant Nanotrasen. Elle semble toujours vous juger.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: ntr

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobShaftMiner
  name: peluche lézard mineur
  description: Une adorable peluche ressemblant à un lézard en mineur. Sent faiblement la cendre. De nombreuses parties ont été recousues après avoir brûlé.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: shaftminer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBrigmedic
  name: peluche lézard brigmédic
  description: Une adorable peluche ressemblant à un lézard en brigmédic. Sent faiblement la poudre à canon et l'atropine.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: brigmedic

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobCentCommOfficial
  name: peluche lézard officiel CentComù
  description: Une adorable peluche ressemblant à un lézard en officiel CentComm. Porte sa casquette avec fierté. Ou quelle que soit l'émotion que ressentent les peluches.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: centcom

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobVirologist
  name: peluche lézard virologue
  description: Une adorable peluche ressemblant à un lézard en virologue. Elle semble être en parfait état.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: virologist
