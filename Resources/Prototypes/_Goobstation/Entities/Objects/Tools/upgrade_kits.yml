- type: entity
  parent: BaseItem
  id: AutodocUpgradeKitBluespace
  name: kit de mise à niveau bluespace d'autodoc
  description: Un kit de mise à niveau avec toutes les pièces nécessaires pour améliorer un autodoc. Celui-ci permet de l'utiliser à travers les vêtements.
  components:
  - type: Sprite
    sprite: _DV/Objects/Tools/lathe_upgrade_kit.rsi
    state: icon
  - type: UpgradeKit
    whitelist:
      components:
      - Autodoc
    blacklist:
      components:
      - UpgradedMachine
    components:
    - type: UpgradedMachine
      upgrade: upgrade-kit-autodoc-bluespace
    - type: SurgeryIgnoreClothing

# for entities that come pre-automated
- type: entity
  abstract: true
  id: BaseAutomatedMachine
  components:
  - type: AutomationSlots
  - type: Automated
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: GuideHelp
    guides:
    - Automation
