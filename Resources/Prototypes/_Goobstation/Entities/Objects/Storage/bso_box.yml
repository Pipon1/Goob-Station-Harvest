- type: entity
  id: BlueshieldAmmunitionBox
  name: boîte à munitions du Bouclier Bleu
  description: Une boîte contenant diverses munitions et chargeurs pour fusils à pompe de gros calibre.
  suffix: Non utilisé
  parent: BaseStorageItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
    layers:
    - map: [ base ]
      state: icon
  - type: EmitSoundOnLand
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,6,1
    whitelist:
      components:
      - BallisticAmmoProvider
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Appearance