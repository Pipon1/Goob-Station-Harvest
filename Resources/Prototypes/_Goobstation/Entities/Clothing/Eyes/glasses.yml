- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, ShowMedicalIcons, BaseSecurityContraband, ClothingEyesGlassesSunglasses]
  id: ClothingEyesGlassesMedSec
  name: lunettes de sécurité médicales
  description: Lunettes de soleil avec un HUD médical et sécurité.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Eyes/Glasses/medsecglasses.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Eyes/Glasses/medsecglasses.rsi
  - type: Construction
    graph: GlassesMedSecHUD
    node: glassesMedSec

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesPrescriptionGlasses
  name: lunettes de vue
  description: Votre assurance ne les couvre pas. Ne les perdez pas.
  components:
    - type: Sprite
      sprite: Clothing/Eyes/Glasses/glasses.rsi
    - type: Clothing
      sprite: Clothing/Eyes/Glasses/glasses.rsi
    - type: VisionCorrection
    - type: Damageable
      damageContainer: Inorganic
    - type: Tag
      tags:
      - WhitelistChameleon
    - type: PhysicalComposition
      materialComposition:
        Glass: 125
        Steel: 125
    - type: StaticPrice
      price: 38
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 10
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: GlassBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                ClothingEyesGlassesBroken:
                  min: 1
                  max: 1

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesGlassesBroken
  name: lunettes cassées
  description: Mes lunettes ! Je n'y vois rien sans mes lunettes !
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Eyes/Glasses/brokenglasses.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Eyes/Glasses/brokenglasses.rsi
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Glass: 125
      Steel: 125
  - type: StaticPrice
    price: 38

- type: entity
