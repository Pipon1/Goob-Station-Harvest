- type: entity
  parent: [ClothingEyesHudOmni, BaseCentcommContraband]
  id: ClothingEyesGlassesDeathsquad
  suffix: NE PAS PLACER
  name: lunettes du commandant central
  description: Fierté. Hubris. Colère. Ce n'est pas un péché si vous avez raison.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Eyes/Glasses/deathsquad.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Eyes/Glasses/deathsquad.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: IdentityBlocker
    coverage: EYES
  - type: ThermalVision
    isEquipment: true
    color: "#98EEFB"
    lightRadius: 15
  - type: ChameleonClothing
    slot: [ eyes ]
    default: ClothingEyesGlassesDeathsquad
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface
  - type: ClothingGrantComponent
    component:
    - type: KravMaga # Silly
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

