- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakHelldiver
  name: cape de pure loyauté à la récupération 
  description: Une représentation de la gratitude de ces innombrables membres d'équipage dont l'existence prospère nous nous efforçons d'assurer.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Cloaks/helldiver.rsi
  - type: StealTarget # lmao buying objectives, thief greatest antag
    stealGroup: HeadCloak

- type: entity
