# CentralCommand

- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseCentcommContraband]
  id: ClothingOuterArmourInvisible # I'll be real, this is just invisible armor so it doesn't ruin how fucking AWESOME navy officers look. Bite me.
  name: armure assistée par bluespace
  description: Un gilet blindé qui utilise la technologie bluespace, courbant la lumière et devenant invisible à l'œil nu lorsqu'il est porté.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Armor/covert_armor.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Armor/covert_armor.rsi
  - type: Armor
    coverage:
    - Chest
    modifiers:
      coefficients: #hello genius this is an ADMEME item do not TOUCH IT during your BALANCE PATCHES
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.35
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: StripMenuInvisible # No peeking!
  - type: TemperatureProtection
    heatingCoefficient: 0.8 # Blame it on bluespace.
    coolingCoefficient: 0.1

- type: entity
  parent: ClothingOuterArmourInvisible
  id: ClothingOuterArmourInvisibleChameleon
  name: armure furtive
  description: Un gilet blindé qui utilise la technologie bluespace. Capable d'être complètement invisible, ou d'apparaître comme n'importe quel autre vêtement extérieur.
  components:
  - type: ChameleonClothing
    slot: [ outerClothing ]
    default: ClothingOuterArmourInvisible
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: [ ClothingOuterBaseMedium, ClothingOuterStorageToggleableBase, AllowSuitStorageClothing, BaseSyndicateContraband ]
  id: ClothingOuterArmorCloakSith
  name: cape du seigneur des ténèbres
  description: Ce qui a commencé comme une simple cape de cosplay a été illégalement renforcée avec des plaques blindées, la transformant en une pièce d'armure fonctionnelle. On dirait qu'elle est même capable de protéger l'utilisateur du manque de pression dans l'espace.
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/Clothing/OuterClothing/void_cloak.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Clothing
    sprite: _Goobstation/Heretic/Clothing/OuterClothing/void_cloak.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    traumaDeductions:
      Dismemberment: 0.5
      OrganDamage: 0.5
      BoneDamage: 0.5 # Solo Ontag
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: ToggleableClothing
    stripDelay: null
    clothingPrototypes:
      head: ClothingHeadHatHoodCloakSith
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: PressureProtection
    lowPressureMultiplier: 1000
  # Intentionally no temperature or high pressure protection

- type: entity
  parent: [BaseSyndicateContraband, ClothingOuterArmourInvisible]
  id: ClothingOuterArmourInvisibleSyndie
  name: armure assistée par redspace
  description: Un gilet blindé qui utilise la technologie redspace pour apparaître invisible et ne pas gâcher votre style professionnel.
  components:
