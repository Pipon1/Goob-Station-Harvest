# Durathred web vest
- type: entity
  parent: ClothingOuterVestWeb
  id: ClothingOuterVestWebDurathread
  name: gilet à mailles en fil durathread
  description: Un gilet à mailles blindé improvisé fait de fil durathread avec des plaques en plasteel. Il est étonnamment léger, malgré son blindage formidable.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Armor/durathread_web_vest.rsi
