- type: entity
  parent: [ClothingOuterArmorHoS, ClothingOuterStorageBase, BaseSecurityCommandContraband]
  id: ClothingOuterArmorHoSExperimental
  name: trench-coat blindé expérimental du chef de la sécurité
  description: Un pardessus amélioré avec un alliage assisté par bluespace expérimental pour une protection et un style supplémentaires pour ceux qui imposent le respect.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Armor/hos_experimental_jacket.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Armor/hos_experimental_jacket.rsi

- type: entity
  parent: ClothingOuterBaseToggleable
  id: ClothingOuterCoatZeusJacket
  name: veste de zeus
  description: Vous donne l'envie de jeter le piéton le plus proche sur un hélicoptère volant.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Misc/mercer_jacket.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Misc/mercer_jacket.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHatHoodZeusHood

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterDavidsJacket
  name: veste SAMU
  description: Une veste signal jaune vif, chérie par les ambulanciers de la fin du 21e siècle.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Coats/david_jacket.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Coats/david_jacket.rsi
  - type: AddAccentClothing
    accent: StreetpunkAccent

- type: entity
  parent: [ClothingOuterDavidsJacket, BaseMajorContraband]
  id: ClothingOuterDavidsJacketValid
  name: veste edgerunner
  description: Vous êtes juste sur le fil. Montrez-leur que vous maîtrisez.
  components:
  - type: Clothing
    clothingVisuals:
      outerClothing:
      - state: valid-equipped-OUTERCLOTHING
      outerClothing-vox:
      - state: valid-equipped-OUTERCLOTHING-vox
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    - Tail
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
  - type: ModifyDelayedKnockdown
    delayDelta: 1.5
    knockdownTimeDelta: -1.5
  - type: StaminaResistance
    damageCoefficient: 0.7

