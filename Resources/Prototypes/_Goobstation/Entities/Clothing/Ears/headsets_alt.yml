- type: entity
  abstract: true
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltLoudspeaker
  components:
  - type: Loudspeaker
    canToggle: true
    affectRadio: true

- type: entity
  parent: [ClothingHeadsetAltSyndicate, ClothingHeadsetAltLoudspeaker]
  id: ClothingHeadsetAltSyndicateCommander
  name: casque audio du commandant rouge sang

- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetChronolegioneer
  name: casque audio futuriste
  description: Un casque du futur capable de capter la plupart des fréquences de la station.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyFuture
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/chronolegioneer.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/chronolegioneer.rsi

- type: entity
  parent: ClothingHeadsetChronolegioneer
  id: ClothingHeadsetChronolegioneerUnremoveable
  suffix: Inamovible
  components:
  - type: Unremoveable

- type: entity
  parent: [ClothingHeadsetAlt, BaseSecurityContraband]
  id: ClothingHeadsetAltWarden
  name: casque audio du gardien
  description: Un intercom modulaire mis à jour, permettant des communications rapides avec le personnel de commandement.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
      - EncryptionKeyCommand
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/warden.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/warden.rsi

- type: entity
  parent: [ClothingHeadsetAlt, BaseCentcommContraband]
  id: ClothingHeadsetDeathsquad
  name: casque audio de l'escadron de la mort
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCentCom
      - EncryptionKeyStationMaster
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/deathsquad.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/deathsquad.rsi
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ClothingHeadsetAlt, BaseSecurityContraband]
  id: ClothingHeadsetAltSecurityRegular
  name: casque audio de sécurité
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
      - EncryptionKeyCommon
  - type: Sprite
    sprite: Clothing/Ears/Headsets/security.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/security.rsi

- type: entity
  parent: [ClothingHeadsetAlt, BaseCentcommContraband]
  id: ClothingHeadsetAltBlueshield
  name: casque audio d'agent blueshield
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommand
      - EncryptionKeyCentCom
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/blueshield.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/blueshield.rsi

- type: entity
  parent: ClothingHeadsetCommand
  id: ClothingHeadsetCommandService
  name: casque de commandement et service
  description: Un casque avec les canaux de commandement et de service.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommand
      - EncryptionKeyService
      - EncryptionKeyCommon

- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltRadioHost
  name: casque audio de présentateur de radio
  description: Un casque audio avec une mousse supplémentaire autour des oreilles.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/radiohost.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/radiohost.rsi
