- type: entity
  parent: [ ClothingHeadBase, BaseMajorContraband ]
  id: ReverseBearTrap
  name: piège à ours inversé
  description: Un terrifiant ensemble de mâchoires métalliques fermées, relié à un minuteur et sécurisé par un cadenas à une pince de tête. Pour l'appliquer, frappez quelqu'un avec.
  components:
  - type: ReverseBearTrap
    countdownDuration: 60
    baseEscapeChance: 0
    delayOptions: # escape odds for each duration.
      - 30 # 2.48%
      - 60 # 10.76%
      - 90 # 23.57%
      - 120 # 38.88%
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Helmets/reverse_bear_trap.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Helmets/reverse_bear_trap.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5

- type: entity
  parent: [ ClothingHeadBase, BaseSyndicateContraband ]
  id: ClothingHeadHatHoodCloakSith
  name: capuche du seigneur des ténèbres
  description: Ce qui a commencé comme une simple capuche de cosplay a été illégalement renforcée avec des plaques blindées, la transformant en une pièce d'armure fonctionnelle. On dirait qu'elle est même capable de protéger l'utilisateur du manque de pression dans l'espace.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hoods/voidcloak.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Head/Hoods/voidcloak.rsi
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.75
  - type: PressureProtection
    lowPressureMultiplier: 1000

- type: entity  # Helmets hide / show hair verb
  parent: [ClothingHeadHelmetBase, BaseFoldable]
  id: ClothingHeadHelmetBaseFoldable
  abstract: true
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-hidehair-verb
    foldVerbText: fold-showhair-verb
  - type: FoldableClothing
    foldedEquippedPrefix: ""
    foldedSlots:
    - HEAD
    unfoldedSlots:
    - HEAD
    unfoldedHideLayers:
    - Hair
    foldedHideLayers: []

