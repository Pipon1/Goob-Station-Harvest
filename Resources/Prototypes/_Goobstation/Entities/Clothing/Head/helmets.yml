- type: entity
  parent: [BaseSyndicateContraband, ClothingHeadHelmetBase]
  id: ClothingHeadHelmetHelldiver
  name: casque de sauvetage tactique NT-01
  description: Cette armure est l'équipement standard de NanoTrasen, fabriquée avec le même alliage de titane que la coque du Goliath.
  components:
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.35
        Caustic: 0.35
  - type: BreathMask
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Helmets/helldiver.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Helmets/helldiver.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

