- type: entity
  id: ComputerNTRTasks
  parent: [BaseComputer]
  name: ordinateur de missions NTR
  description: Un terminal fournissant accès aux missions NanoNet. Votre loyauté sera récompensée — accomplissez des tâches, accumulez des points de loyauté et dépensez-les sur des privilèges NTR exclusifs.
  components:
  - type: UserInterface
    interfaces:
      enum.NtrTaskUiKey.Key:
        type: NtrTaskBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ActivatableUI
    key: enum.NtrTaskUiKey.Key
  - type: NtrTaskConsole
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: nanotrasen
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: [ ]
      documentSlot: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      board: !type:Container
        showEnts: False
        occludes: True
        ents: [ ]
  - type: ItemSlots
    slots:
      documentSlot:
        name: Console slot
        whitelist:
          tags:
          - Paper
          - Vial

- type: entity
  id: ComputerContractor
  parent: [BaseComputer, StorePresetUplink, BaseSyndicateContraband]
  name: ordinateur liaison contractuel
  description: Un terminal donnant accès à la boutique de la guilde. Dépensez vos TC durement gagnés en équipement et améliorations exclusifs pour vous aider dans vos activités de freelance.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: comm_syndie
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: [ ]
      documentSlot: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      board: !type:Container
        showEnts: False
        occludes: True
        ents: [ ]
  - type: Tag
    tags:
    - ContractorUplink
