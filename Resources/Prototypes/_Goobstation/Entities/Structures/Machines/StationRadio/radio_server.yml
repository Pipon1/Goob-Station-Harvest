- type: entity
  id: StationRadioServer
  name: serveur radio de la station
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  description: Une rangée de serveurs qui contrôle si votre voix est diffusée ou non.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/stationradioserver.rsi
    layers:
    - state: icon
    drawdepth: SmallObjects
  - type: StationRadioServer
  - type: DeviceLinkSource
    ports:
    - StationRadioServerPort
    # TODO: unlit & maints panel sprite
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioServerCircuitboard
  - type: TelecomExempt
  - type: RadioMicrophone
    powerRequired: true
    broadcastChannel: RadioShow
    unobstructedRequired: true

- type: entity
  id: StationRadioRig
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: station radio rig
  description: Une collection de tout ce qu'il vous faut pour diffuser de la musique sur la station.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/radiostationrig.rsi
    layers:
    - state: icon
    drawdepth: SmallObjects
    # TODO: unlit & maints panel sprite
  - type: DeviceLinkSink
    ports:
    - StationRadioRigPort
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioRigCircuitboard
  - type: RadioRig
