- type: entity
  parent: BaseShield
  id: ChangelingShield
  name: bouclier organique
  description: Un grand bouclier charnu.
  suffix: Inamovible
  components:
    - type: Unremoveable
    - type: Sprite
      sprite: _Goobstation/Changeling/shields.rsi
      state: ling-icon
    - type: Item
      sprite: _Goobstation/Changeling/shields.rsi
      heldPrefix: ling
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 60
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
