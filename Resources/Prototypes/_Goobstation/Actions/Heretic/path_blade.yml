# actions
- type: entity
  parent: BaseAction
  id: ActionHereticRealignment
  name: Réalignement
  description: Récupérez de tous les étourdissements et renversements, et gagnez un pacifisme temporaire à court terme.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: realignment
  - type: InstantAction
    event: !type:EventHereticRealignment
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-realignment

- type: entity
  parent: BaseAction
  id: ActionHereticFuriousSteel
  name: Acier Furieux
  description: Invoque trois lames protectrices en orbite autour de vous.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 60
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: furious_steel
  - type: InstantAction
    event: !type:EventHereticFuriousSteel
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-blade-furioussteel
  - type: ChangeUseDelayOnAscension
    newUseDelay: 30
    requiredPath: Blade
