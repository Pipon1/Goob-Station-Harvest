- type: entity
  parent: BaseAction
  id: ActionChronoBlink
  name: Décalage temporaire
  description: Modifie vos coordonnées, vous permettant de vous téléporter vers des emplacements proches.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Actions/chronoblink.rsi
      state: effect
    useDelay: 15
    itemIconStyle: NoItem
    sound:
      path: /Audio/Magic/blink.ogg
      params:
        volume: 5
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:TeleportSpellEvent
