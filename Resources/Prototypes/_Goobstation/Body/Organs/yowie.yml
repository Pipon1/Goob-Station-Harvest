- type: entity
  id: OrganYowieStomach
  parent: OrganHumanStomach
  name: estomac de yowie
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxPoisonsProcessable: 5
    metabolizerTypes: [Yowie]

- type: entity
  id: OrganYowieLiver
  parent: OrganHumanLiver
  name: foie de yowie
  components:
  - type: Metabolizer
    metabolizerTypes: [Yowie]
    groups:
    - id: Medicine
      rateModifier: 1
    - id: Poison
      rateModifier: 1
    - id: Narcotic
      rateModifier: 1
    - id: Alcohol # Same as parent
      rateModifier: 0.1
    maxPoisonsProcessable: 3 # For proper processing of chems instead of heart

- type: entity
  id: OrganYowieHeart
  parent: OrganHumanHeart
  name: cœur de yowie
  components:
  - type: Metabolizer
    metabolizerTypes: [Yowie]
    groups: # Empty to ensure it doesn't do anything

- type: entity
  id: OrganYowieLungs
  parent: OrganHumanLungs
  name: poumons
  description: "Filtre l'oxygène de l'atmosphère, qui est ensuite envoyé dans le flux sanguin pour servir de transporteur d'électrons."
  components:
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Yowie ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5