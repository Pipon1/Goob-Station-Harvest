- type: entity
  parent: BaseLathe
  id: MedicalBiofabricator
  name: biofabricateur médical
  description: Produit des organes et d'autres matières organiques pouvant être greffés chirurgicalement sur des patients avec de la biomasse.
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/limbgrower.rsi
    snapCardinals: true
    layers:
    - state: limbgrower_idleoff
      map: ["enum.LatheVisualLayers.IsRunning"]
#    - state: limbgrower_idleoff
#      shader: unshaded
#      map: ["enum.PowerDeviceVisualLayers.Powered"]
#    - state: inserting
#      map: ["enum.MaterialStorageVisualLayers.Inserting"]
#    - state: panel
#      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MedicalBiofabMachineBoard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
  - type: Lathe
    idleState: limbgrower_idleoff
    runningState: limbgrower_idleon
    staticPacks:
    - BiofabPartsStatic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - BiofabPartsEmagStatic