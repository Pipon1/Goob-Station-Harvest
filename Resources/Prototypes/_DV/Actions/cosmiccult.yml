- type: entity
  parent: BaseAction
  id: ActionCosmicSiphon
  name: Siphonner l'Entropie
  description: Siphonnez silencieusement l'entropie de votre cible, lui infligeant quelques dégâts au passage.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicSiphon {}

- type: entity
  parent: BaseAction
  id: ActionCosmicBlank
  name: Dévier la Subjectivité
  description: Déviez l'esprit de votre cible hors de son corps vers les ténèbres cosmiques, le rendant temporairement sans conscience.
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: blank
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicBlank {}

- type: entity
  parent: BaseAction
  id: ActionCosmicPlaceMonument
  name: Appeler le Monument
  description: Faites surgir le Monument dans l'espace réel. Gardez-le caché et à l'abri des non-cultistes !
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument
  - type: ConfirmableAction
    popup: cosmicability-monument-spawn-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicPlaceMonument {}
  - type: MonumentPlacementPreview
    tier: 1

- type: entity
  parent: BaseAction
  id: ActionCosmicMoveMonument
  name: Déplacer le Monument
  description: Votre œuvre est impérative, et la fin est inévitable. Assurez-vous qu'elle s'accomplisse sous votre surveillance.
  components:
  - type: Action
    useDelay: 600 # Goobstation
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument-relocate
  - type: ConfirmableAction
    popup: cosmicability-monument-move-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicMoveMonument
  - type: MonumentPlacementPreview
    tier: 2

- type: entity
  parent: BaseAction
  id: ActionCosmicReturn
  name: Retourner
  description: Dissipez votre projection astrale et retournez dans votre corps.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 0
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: return
  - type: InstantAction
    event: !type:EventCosmicReturn {}

- type: entity
  parent: BaseAction
  id: ActionCosmicLapse
  name: Défaillance Aberrante
  description: Faites défaillir la forme corporelle de votre cible, la rendant temporairement immuable, impénétrable et figée sur place.
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - BibleUser
    event: !type:EventCosmicLapse {}

- type: entity
  parent: BaseAction
  id: ActionCosmicGlare
  name: Regard du Néant
  description: Émettez une horrible impulsion de lumière cosmique, ralentissant et désorientant tout le monde autour de vous.
  components:
  - type: Action
    useDelay: 60
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: glare
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 5 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicGlare {}

- type: entity
  parent: BaseAction
  id: ActionCosmicIngress
  name: Forcer l'Entrée
  description: Utilisez une décharge de pouvoir concentrée pour forcer l'ouverture d'une porte sécurisée.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicIngress {}

- type: entity
  parent: BaseAction
  id: ActionCosmicImposition
  name: Imposition du Vide
  description: Vous annulez tout dommage entrant pendant un court moment.
  components:
  - type: Action
    useDelay: 80
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition {}

- type: entity
  parent: BaseAction
  id: ActionCosmicNova
  name: Nova Astrale
  description: Lancez une grande et perturbatrice déflagration d'énergie astrale.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: TargetAction
    range: 6000 # You're just picking a direction anyways
  - type: WorldTargetAction
    event: !type:EventCosmicNova {}

- type: entity
  parent: BaseAction
  id: ActionRogueCosmicNova
  name: Nova Astrale Usurpée
  description: Lancez une grande et perturbatrice déflagration d'énergie astrale.
  components:
  - type: Action
    useDelay: 25
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - SiliconLawUpdater
    event: !type:EventCosmicFragmentation {}
  - type: LimitedCharges
    maxCharges: 1

## COLOSSUS ACTIONS

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusSunder
  name: Entropic Sunder
  description: Warp to the target location and unleash a cascading detonation of malign energy.
  components:
  - type: Action
    useDelay: 18
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: sunder
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder

- type: entity
  parent: BaseAction
  id: ActionRogueInfection
  name: Corruption Maligne
  description: Insufflez l'essence des fins en une cible soumise.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicColossusIngress

- type: entity
  parent: BaseAction
  id: ActionRogueSlumber
  name: Coquille Somnolente
  description: Plongez instantanément la coquille mortelle d'une cible dans le sommeil, la rendant endormie et prête pour la Corruption Maligne.
  components:
  - type: Action
    useDelay: 180
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: slumber
  - type: ConfirmableAction
    popup: cosmicability-hibernate-confirm
    confirmDelay: 0.1
    primeTime: 5
  - type: InstantAction
    event: !type:EventCosmicColossusHibernate {}

- type: entity
  parent: BaseAction
  id: ActionRogueGrandShunt
  name: Pointe Mentale Maligne
  description: Déviez les esprits de tous ceux à proximité hors de leur corps vers les ténèbres cosmiques, les rendant temporairement sans conscience.
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: InstantAction
    event: !type:EventCosmicColossusEffigy {}
