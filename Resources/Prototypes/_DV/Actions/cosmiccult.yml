- type: entity
  parent: BaseAction
  id: ActionCosmicSiphon
  name: Siphonner l'Entropie
  description: Siphonne silencieusement l'entropie de votre cible.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicSiphon {}

- type: entity
  parent: BaseAction
  id: ActionCosmicBlank
  name: Dériver la Subjectivité
  description: Expulsez l'esprit de votre cible hors de son corps vers les ténèbres cosmiques, le rendant temporairement insensé.
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: blank
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicBlank {}

- type: entity
  parent: BaseAction
  id: ActionCosmicPlaceMonument
  name: Appeler le Monument
  description: Faites apparaître le Monument dans l'espace réel. Gardez-le caché et en sécurité loin des non-sectateurs !
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument
  - type: ConfirmableAction
    popup: cosmicability-monument-spawn-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicPlaceMonument {}
  - type: MonumentPlacementPreview
    tier: 1

- type: entity
  parent: BaseAction
  id: ActionCosmicMoveMonument
  name: Déplacer le Monument
  description: Votre œuvre est impérative, et la fin est inévitable. Assurez-vous qu'elle s'accomplit sous votre surveillance.
  components:
  - type: Action
    useDelay: 600 # Goobstation
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument-relocate
  - type: ConfirmableAction
    popup: cosmicability-monument-move-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicMoveMonument
  - type: MonumentPlacementPreview
    tier: 2

- type: entity
  parent: BaseAction
  id: ActionCosmicReturn
  name: Retour
  description: Dissipez votre projection astrale et retournez dans votre corps.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 0
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: return
  - type: InstantAction
    event: !type:EventCosmicReturn {}

- type: entity
  parent: BaseAction
  id: ActionCosmicLapse
  name: Lapse Aberrant
  description: Provoquez un laps corporel sur votre cible, la rendant temporairement immuable, infranchissable et figée sur place.
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - BibleUser
    event: !type:EventCosmicLapse {}

- type: entity
  parent: BaseAction
  id: ActionCosmicGlare
  name: Regard Nul
  description: Émettez une horrifique pulsation de lumière cosmique, ralentissant et désorientant tous ceux autour de vous. Ses effets sont amplifiés contre les entités à base de silicium.
  components:
  - type: Action
    useDelay: 60
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: glare
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 5 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicGlare {}

- type: entity
  parent: BaseAction
  id: ActionCosmicIngress
  name: Ingression Forcée
  description: Utilisez une explosion concentrée de puissance pour forcer l'ouverture d'une porte sécurisée.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicIngress {}

- type: entity
  parent: BaseAction
  id: ActionCosmicImposition
  name: Imposition Vacuée
  description: Vous annulez tous les dégâts entrants pendant un court instant.
  components:
  - type: Action
    useDelay: 80
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition {}

- type: entity
  parent: BaseAction
  id: ActionCosmicNova
  name: Nova Astrale
  description: Lancez une large et dévastatrice explosion d'énergie astrale.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: TargetAction
    range: 6000 # You're just picking a direction anyways
  - type: WorldTargetAction
    event: !type:EventCosmicNova {}

- type: entity
  parent: BaseAction
  id: ActionCosmicFragmentation
  name: Fragmentation Nulle
  description: Transférez votre empowerment malin dans un système numérique, tel qu'une Console de Téléchargement d'IA ou un Cyborg, le corrompant au passage. Cela consommera votre empowerment.
  components:
  - type: Action
    useDelay: 25
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - SiliconLawUpdater
    event: !type:EventCosmicFragmentation {}
  - type: LimitedCharges
    maxCharges: 1

## COLOSSUS ACTIONS

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusSunder
  name: Fente Entropique
  description: Téléportez-vous à la position cible et libérez une détonation en cascade d'énergie maligne.
  components:
  - type: Action
    useDelay: 18
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: sunder
  - type: TargetAction
    range: 7
    checkCanAccess: false # Goobstation - Fixes Teleport not working through windows
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusIngress
  name: Ingression Colossale
  description: Utilisez votre force colossale pour forcer l'ouverture d'une porte.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicColossusIngress

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusHibernate
  name: Carapace d'Assoupissement
  description: Plongez votre corps dans l'assoupissement pour régénérer votre intégrité. Doit être fait sur un sol stable.
  components:
  - type: Action
    useDelay: 180
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: slumber
  - type: ConfirmableAction
    popup: cosmicability-hibernate-confirm
    confirmDelay: 0.1
    primeTime: 5
  - type: InstantAction
    event: !type:EventCosmicColossusHibernate {}

- type: entity
  id: ActionCosmicColossusEffigy
  name: Appeler une Effigie
  description: Faites apparaître une Effigie de l'Entropie dans l'espace réel.
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: InstantAction
    event: !type:EventCosmicColossusEffigy {}
