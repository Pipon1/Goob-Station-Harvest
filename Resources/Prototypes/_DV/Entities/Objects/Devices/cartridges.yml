- type: entity
  parent: BaseItem
  id: NanoChatCartridge
  name: cartouche NanoChat
  description: Vous permet d'envoyer des messages à d'autres personnes !
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-chat
  - type: UIFragment
    ui: !type:NanoChatUi
  - type: NanoChatCartridge
  - type: Cartridge
    programName: nano-chat-program-name
    icon:
      sprite: _DV/Misc/program_icons.rsi
      state: nanochat
  - type: ActiveRadio
    channels:
    - Common
