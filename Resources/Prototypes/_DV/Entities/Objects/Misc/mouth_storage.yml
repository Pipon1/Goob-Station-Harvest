- type: entity
  id: CheekStorage
  name: stockage jugal
  description: Les joues d'un animal, capables de stocker de petits objets.
  categories: [ HideSpawnMenu ]
  components:
  - type: Storage
    clickInsert: false
    grid:
    - 0,0,1,1
    maxItemSize: Small
    blacklist:
      components:
      - Sharp
      - MindContainer
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Dumpable