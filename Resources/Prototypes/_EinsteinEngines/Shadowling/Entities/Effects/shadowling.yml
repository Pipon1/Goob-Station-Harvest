- type: entity
  id: ShadowlingGlareEffect
  name: effet du regard de l'ombrelin
  components:
  - type: TimedDespawn
    lifetime: 0.35
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: false
    sprite: _EinsteinEngines/Shadowling/Effects/glare.rsi
    state: glare
    netsync: false
    drawdepth: Effects
  - type: PointLight
    color: "#e3432a"
    radius: 7
    energy: 2
  - type: LightFade
    duration: 0.34

