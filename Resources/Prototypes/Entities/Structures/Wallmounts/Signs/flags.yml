- type: entity
  parent: BaseSign
  id: BaseFlag
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/flags.rsi

- type: entity
  parent: BaseFlag
  id: BlankFlag
  name: drapeau vierge
  description: Un morceau de tissu blanc. Certainement pas le drapeau de la France.
  components:
  - type: Sprite
    state: blank_flag

- type: entity
  parent: BaseFlag
  id: NTFlag
  name: drapeau Nanotrasen
  description: Gloire à NT ! Attends, ils ont vraiment fait un drapeau pour une corporation ?
  components:
  - type: Sprite
    state: NT_flag

- type: entity
  parent: BaseFlag
  id: SyndieFlag
  name: drapeau du syndicat
  description: Ça sent le sang. Mort à NT !
  components:
  - type: Sprite
    state: syndie_flag

- type: entity
  parent: BaseFlag
  id: LGBTQFlag
  name: drapeau LGBTQ
  description: "Drapeau \"Sois gay, fais des crimes\"."
  components:
  - type: Sprite
    state: lgbtq_flag

- type: entity
  parent: BaseFlag
  id: PirateFlag
  name: drapeau pirate
  description: Hissez le Jolly Roger, coquins !
  components:
  - type: Sprite
    state: pirate_flag
