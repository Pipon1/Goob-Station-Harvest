- type: entity
  parent: FireAxeCabinet
  id: ShotGunCabinet
  name: armoire à fusil à pompe
  description: Il y a une petite étiquette indiquant « Pour usage d'urgence seulement » ainsi que des détails sur l'utilisation sûre du fusil. Comme si.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/shotgun_cabinet.rsi
    layers:
    - state: cabinet
    - state: shotgun
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          tags:
          - WeaponShotgunKammerer
  - type: AccessReader
    access: [["Security"], ["Command"]]

- type: entity
  parent: ShotGunCabinet
  id: ShotGunCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true
  - type: Lock
    locked: false

- type: entity
  parent: ShotGunCabinet
  id: ShotGunCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - WeaponShotgunKammerer

- type: entity
  parent: [ShotGunCabinetFilled, ShotGunCabinetOpen]
  id: ShotGunCabinetFilledOpen
  suffix: Filled, Open