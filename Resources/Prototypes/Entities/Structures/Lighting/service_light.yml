- type: entity
  parent: Poweredlight
  id: JanitorServiceLight
  name: lumière de service d'entretien
  description: Un panneau d'entretien mural. Si la lumière clignote, un passage du concierge est requis.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/service_light.rsi
    drawdepth: WallMountedItems
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
    state: base
  - type: PointLight
    radius: 1.5
    energy: 0.45
    softness: 3
    offset: "0, 0"
    enabled: false
  - type: PoweredLight
    bulb: Bulb
    on: false
    hasLampOnSpawn: ServiceLightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 5
    popupText: powered-light-component-burn-hand