- type: entity
  parent: ParticleAcceleratorFinishedPart
  id: ParticleAcceleratorPowerBox
  name: boîtier d'alimentation PA
  description: Formellement connu sous le nom de Lentille EM de Focalisation de Particules. Il utilise des ondes électromagnétiques pour focaliser les particules Alpha.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/PA/power_box.rsi
  - type: ParticleAcceleratorPowerBox
  - type: PowerConsumer
    voltage: Medium
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: Construction
    graph: ParticleAcceleratorPowerBox
  - type: MultipartMachinePart

- type: entity
  parent: ParticleAcceleratorUnfinishedBase
  id: ParticleAcceleratorPowerBoxUnfinished
  name: boîtier d'alimentation PA
  suffix: Unfinished
  description: Formellement connu sous le nom de Lentille EM de Focalisation de Particules. Il utilise des ondes électromagnétiques pour focaliser les particules Alpha. Il semble inachevé.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/PA/power_box.rsi
  - type: Construction
    graph: ParticleAcceleratorPowerBox
  - type: MultipartMachinePart
