    unlockOnClick: false
  - type: SiliconLawUpdater
    components:
    - type: StationAiHeld
  # Goob edit start
  - type: ActiveRadio
    channels:
    - Science
  - type: Speech
    speechSounds: Tenor
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
    altVerb: true
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  # Goob edit end
  - type: ItemSlotsLock
    slots:
    - circuit_holder
  - type: ItemSlotRequiresPower
  - type: ItemSlots
    slots:
      circuit_holder:
        name: circuit-holder
        insertSuccessPopup: silicon-laws-updated
        whitelist:
          requireAll: true
          components:
          - SiliconLawProvider
          - Item
  - type: ContainerContainer
    containers:
      circuit_holder: !type:ContainerSlot
      board: !type:Container

- type: entity
  id: StationAiFixerComputer
  parent: BaseComputer
  name: console restauration IA
  description: Utilisée pour réparer les intelligences artificielles endommagées.
  components:
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: ai-fixer-empty
    - map: [ "computerLayerKeys" ]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.StationAiFixerConsoleVisuals.Key:
        computerLayerScreen:
          Repair0: { state: ai-fixer-progress-0 }
          Repair1: { state: ai-fixer-progress-1 }
          Repair2: { state: ai-fixer-progress-2 }
          Repair3: { state: ai-fixer-progress-3 }
          Purge0: { state: ai-fixer-purge-0 }
          Purge1: { state: ai-fixer-purge-1 }
          Purge2: { state: ai-fixer-purge-2 }
          Purge3: { state: ai-fixer-purge-3 }
          Empty: { state: ai-fixer-empty }
          Occupied: { state: ai-fixer-full }
          Rebooting: { state: ai-fixer-404 }
          Dead: { state: ai-fixer-404 }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Computer
    board: StationAiFixerCircuitboard
  - type: AccessReader
    access: [ [ "ResearchDirector" ] ]
  - type: Lock
    unlockOnClick: false
  - type: StationAiFixerConsole
  - type: ItemSlotsLock
    slots:
    - station_ai_holder
  - type: ItemSlotRequiresPower
  - type: ItemSlots
    slots:
      station_ai_holder:
        ejectOnBreak: true
        lockedFailPopup: station-ai-fixer-console-is-locked
        whitelistFailPopup: station-ai-fixer-console-station-ai-holder-required
        whitelist:
          requireAll: true
          components:
          - StationAiHolder
          - Item
  - type: ContainerContainer
    containers:
      station_ai_holder: !type:ContainerSlot
      board: !type:Container
  - type: ActivatableUI
    key: enum.StationAiFixerConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StationAiFixerConsoleUiKey.Key:
        type: StationAiFixerConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

