- type: entity
  parent: BaseComputer
  id: ComputerEmergencyShuttle
  name: console de navette d'urgence
  description: Gère l'autorisation de lancement anticipé de la navette.
  components:
  - type: AccessReader
    access:
    - [ Command ]
    breakOnAccessBreaker: false # Goobstation
  - type: EmergencyShuttleConsole
  - type: ActivatableUI
    key: enum.EmergencyConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.EmergencyConsoleUiKey.Key:
          type: EmergencyConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#43ccb5"
  # Goobstation - Add components for self destruct.
  - type: Explosive # Powerful explosion in a very small radius. Doesn't break underplating.
    explosionType: DemolitionCharge
    totalIntensity: 60
    intensitySlope: 5
    maxIntensity: 30
    canCreateVacuum: false
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai

- type: entity
  parent: BaseComputer
  id: BaseComputerShuttle
  name: console de navette
  description: Utilisée pour piloter une navette.
  abstract: true
  components:
  - type: ShuttleConsole
  - type: ActivatableUI
    key: enum.ShuttleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.ShuttleConsoleUiKey.Key:
          type: ShuttleConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: RadarConsole
  - type: WorldLoader
    radius: 256
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#43ccb5"
  - type: ItemSlots
    slots:
      disk_slot:
        name: Disk
        insertSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          components:
          - ShuttleDestinationCoordinates
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      disk_slot: !type:ContainerSlot {}
  - type: GuideHelp
    guides:
    - ShuttleCraft
  # Frontier edit start
  - type: DeviceLinkSource
    ports:
    - SignalShuttleConsole1
    - SignalShuttleConsole2
    - SignalShuttleConsole3
    - SignalShuttleConsole4
    range: 90
  # Frontier edit end

