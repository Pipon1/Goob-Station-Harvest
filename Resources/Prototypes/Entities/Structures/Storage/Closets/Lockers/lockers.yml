- type: entity
  id: LockerBooze
  parent: LockerBase
  name: rangement d'alcool
  description: C'est là que le barman garde l'alcool.
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: cabinet
    stateDoorOpen: cabinet_open
    stateDoorClosed: cabinet_door

  - type: AccessReader
    access: [["Bar"]]
  - type: EntityStorage
    closeSound:
      path: /Audio/Effects/woodenclosetclose.ogg
    openSound:
      path: /Audio/Effects/woodenclosetopen.ogg
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Wood: 100
      Steel: 25
  - type: Paintable
    group: null # not shaped like other lockers

