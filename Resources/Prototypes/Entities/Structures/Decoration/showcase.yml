- type: entity
  id: ShowcaseRobotMarauder
  parent: BaseShowcaseRobot
  name: maraudeur vitrine
  description: Une réplique non-fonctionnelle d'un maraudeur, peinte en vert.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_4