- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseBonfire
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: WoodDestroy
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: Construction # Frontier
    graph: FiresGraph # Frontier
    node: BonfireNode # Frontier

- type: entity
  parent: BaseBonfire
  id: Bonfire
  name: feu de camp
  description: Qu'y a-t-il de mieux qu'une soirée tardive sous le ciel avec une guitare et des amis ?
  components:
  - type: Sprite
    layers:
    - state: burning
  - type: Construction
    graph: Bonfire
    node: bonfire

- type: entity
  parent: BaseBonfire
  id: BonfireStake
  name: feu de camp avec pieu
  description: Un feu de camp sinistre avec un pieu pour... des raisons cérémonielles. Mieux vaut ne pas demander.
  components:
  - type: Sprite
    sprite: Structures/Decoration/bonfire_stake.rsi
    layers:
    - state: burning
    offset: "0, 0.5"
  - type: Strap
    position: Stand
    buckleOffset: "0, 0.5"
    buckleDoafterTime: 5
  - type: IgniteOnBuckle
  - type: Construction
    graph: Bonfire
    node: bonfireStake

- type: entity
  parent: BaseBonfire
  id: LegionnaireBonfire
  name: feu de camp légionnaire
  description: Là-bas, au pays de la lave et des cendres, l'endroit pour faire cuire guimauves et patates.
  components:
  - type: Sprite
    layers:
    - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
