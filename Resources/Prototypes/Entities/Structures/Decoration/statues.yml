- type: entity
  id: StatueVenusRed
  parent: BaseStructure
  name: statue de pure jeune fille
  suffix: Rouge
  description: Une ancienne statue en marbre. Le sujet est représenté avec une tresse jusqu'au sol et manie une boîte à outils rouge.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_red
    drawdepth: Mobs
    offset: "0.0,0.5"

