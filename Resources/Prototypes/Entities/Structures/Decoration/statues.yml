- type: entity
  id: StatueBananiumClown
  parent: BaseStructure
  name: statue du sauveur bananium
  description: Une statue en bananium. Elle représente le retour du sauveur qui se lèvera et mènera les clowns vers le grand honk.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: bananium_clown
    drawdepth: Mobs
    offset: "0.0,0.5"
  - type: Construction
    graph: BananiumStatueClown
    node: bananiumStatue

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseIronsandStatue
  description: Une statue mystérieuse trouvée dans un désert de sable de fer.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 # Overkill
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: petite statue en sable de fer
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer

