- type: entity
  name: téléportation
  parent: [Incorporeal, BaseMob]
  id: BaseMobJaunt
  description: Des traces tenues d'une figure humanoïde subsistent ici.
  suffix: Ethereal
  components:
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: MovementSpeedModifier
    baseSprintSpeed: 12
    baseWalkSpeed: 8
  - type: Visibility
    layer: 2
  - type: Spectral
  - type: IsDeadIC # Goobstation
    dead: false

