- type: entity
  name: civil
  parent: BaseMobHuman
  id: MobCivilian
  description: Un misérable tas de secrets.
  components:
  - type: InputMover
  - type: MobMover
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: PartialAbsorbable # Goobstation - changelings

- type: entity
  name: récupérateur
  parent: BaseMobHuman
  id: MobSalvager
  components:
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - SalvageSpecialistGear
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
    - type: PartialAbsorbable # Goobstation - changelings

- type: entity
  name: spirate
  parent: BaseMobHuman
  id: MobSpirate
  description: Yarr !
  components:
  - type: NpcFactionMember
    factions:
      - Syndicate
  - type: Loadout
    prototypes:
      - PirateGear
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: PartialAbsorbable # Goobstation - changelings

- type: entity
  name: soldat du Syndicat
  parent: BaseMobHuman
  id: MobSyndicateFootsoldier
  components:
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - SyndicateFootsoldierGearRuin
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
    - type: PartialAbsorbable # Goobstation - changelings

- type: entity
  name: pilote de navette du Syndicat
  parent: MobSyndicateFootsoldier
  id: MobSyndicateFootsoldierPilot

- type: entity
  parent: BaseMobHuman
  suffix: Dead
  save: false # mobs are currently not saveable.
  id: SalvageHumanCorpse
  name: cadavre non identifié
  description: Je pense qu'il est mort.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Damageable
    damage:
      types:
        Bloodloss: 49
        Asphyxiation: 76
        Slash: 56
        Blunt: 19
  - type: Inventory
    templateId: corpse
  - type: PartialAbsorbable # Goobstation - changelings

- type: entity
  parent: MobHuman
  id: MobCluwne
  name: personne
  description: Un malheureux polymorphé.
  components:
  - type: Cluwne
  - type: Speech
    speechVerb: Cluwne
