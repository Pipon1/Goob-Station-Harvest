- type: entity
  parent: [ClothingNeckBase, BaseChameleon]
  id: ClothingNeckChameleon
  name: écharpe rouge rayée
  description: Une élégante écharpe rouge rayée. L'accessoire d'hiver parfait pour ceux qui ont un sens aigu de la mode, et ceux qui ne supportent tout simplement pas une brise froide sur leur cou.
  suffix: Chameleon
  components:
    - type: Tag
      tags: # ignore "WhitelistChameleon" tag
      - ClothMade
      - Recyclable
    - type: Sprite
      sprite: Clothing/Neck/Scarfs/red.rsi
    - type: Clothing
      sprite: Clothing/Neck/Scarfs/red.rsi
    - type: ChameleonClothing
      slot: [NECK]
      default: ClothingNeckScarfStripedRed
