#Where all of the uniforms for the yet-to-be-implimented ship vs. ship gamemode go (or Nanotrasen VS. Syndicate, if you'd like.)
#In its own file to further avoid bloating jumpsuits.yml.

#CREW
#Recruit
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRecruitNT
  name: uniforme de recrue
  description: Une combinaison grise chic avec des finitions bleues. Parfait pour l'assistant digne.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/recruit_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/recruit_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitRecruitSyndie
  name: uniforme de recrue du syndicat
  description: Une combinaison grise foncée douteuse. Comme si les passagers n'étaient pas déjà suffisamment douteux.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/recruit_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/recruit_syndie.rsi

#Repairman
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRepairmanNT
  name: uniforme de réparateur
  description: Une combinaison qui vous rappelle un certain poste de travail dans le secteur de l'équipage. Espérons que vous n'aurez pas à faire le même travail que CES cinglés.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/repairman_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/repairman_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitRepairmanSyndie
  name: uniforme de réparateur du syndicat
  description: Fonctionnelle, élégante et badass. Les ingénieurs de Nanotrasen aimeraient être aussi beaux que ça.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/repairman_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/repairman_syndie.rsi

#Paramedic
- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitParamedicSyndie
  name: uniforme d'urgentiste du syndicat
  description: Pour une raison quelconque, porter cela vous fait sentir que vous êtes terriblement proche de violer la Convention de Genève.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/paramedic_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/paramedic_syndie.rsi

#HEADS OF STAFF
#Chief Engineer
- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitChiefEngineerSyndie
  name: uniforme d'ingénieur en chef du syndicat
  description: Une combinaison au look maléfique avec un gilet réfléchissant et un sous-vêtement rouge. #TODO: Write a better description for this once Ship vs. Ship is real and actual player habits begin forming
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/ce_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/ce_syndie.rsi