- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatHoodBioGeneral
  name: capuche biologique
  suffix: Générique
  description: Une capuche qui protège la tête et le visage des contaminants biologiques.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hoods/Bio/general.rsi
  - type: Clothing
    sprite: Clothing/Head/Hoods/Bio/general.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: GroupExamine
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      Snout: HEAD
      HeadTop: HEAD
      HeadSide: HEAD
  - type: Armor # Goob
    coverage:
    - Head
    modifiers:
      coefficients:
        Caustic: 0.75
  # Goobstation
  - type: DiseaseProtection
    # full prot with even a normal mask
    incoming:
      powerModifiers:
        Aerial: -0.8
      chanceMultipliers:
        Aerial: 0.5
    outgoing:
      powerModifiers:
        Aerial: -0.8
      chanceMultipliers:
        Aerial: 0.5

