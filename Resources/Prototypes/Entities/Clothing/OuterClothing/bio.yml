- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingOuterBioSecurity
  name: combinaison biologique
  suffix: Sécurité
  description: Une combinaison qui protège contre les contaminations biologiques, équipée d'une armure supplémentaire.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Bio/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Bio/security.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
        Caustic: 0.2
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.4
