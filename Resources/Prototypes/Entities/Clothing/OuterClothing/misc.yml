- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterFlannelRed
  name: veste de flanelle rouge
  description: Une vieille veste de flanelle rouge à la mode pour l'automne spatial.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Misc/flannel_jacket.rsi
    layers:
    - state: icon
      color: "#670a09"
    - state: icon-lines
      color: "#000000"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#670a09"
      - state: inhand-left-lines
        color: "#000000"
      right:
      - state: inhand-right
        color: "#670a09"
      - state: inhand-right-lines
        color: "#000000"
  - type: Clothing
    sprite: Clothing/OuterClothing/Misc/flannel_jacket.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
        color: "#670a09"
      - state: equipped-OUTERCLOTHING-lines
        color: "#000000"
  - type: TemperatureProtection
    coolingCoefficient: 0.3

