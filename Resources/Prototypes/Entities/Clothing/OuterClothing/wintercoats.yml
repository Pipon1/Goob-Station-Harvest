  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
    layers:
    - state: coatybits-icon
      color: "#940000"
    - state: winterbits-icon
  - type: Item
    inhandVisuals:
      left:
      - state: coatybits-inhand-left
        color: "#940000"
      - state: winterbits-inhand-left
