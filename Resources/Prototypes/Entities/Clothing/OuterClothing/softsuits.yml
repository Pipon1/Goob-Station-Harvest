#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: combinaison EVA
  description: Une combinaison spatiale légère capable de protéger le porteur du vide spatial en cas d'urgence.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - CorgiWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty

#Syndicate EVA
- type: entity
  parent: [ ClothingOuterEVASuitBase, BaseSyndicateContraband ]
  id: ClothingOuterEVASuitSyndicate
  name: combinaison EVA du syndicat
  description: "Possède une étiquette au dos indiquant : « N'appartient absolument pas à une corporation ennemie, promis ! »"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty
  - type: StaticPrice
    price: 1000 # Helmet is 500

#Emergency EVA
- type: entity
  parent: [ ClothingOuterEVASuitBase, ClothingOuterBaseToggleable ]
  id: ClothingOuterSuitEmergency
  name: combinaison EVA d'urgence
  description: Une combinaison EVA d'urgence avec un casque intégré. Elle est horriblement lente et offre une protection thermique insuffisante, mais elle suffit à vous faire gagner du temps face au vide spatial impitoyable.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.75
    coolingCoefficient: 0.5
  - type: Tag
    tags:
    - SuitEVA
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHelmetEVALarge

