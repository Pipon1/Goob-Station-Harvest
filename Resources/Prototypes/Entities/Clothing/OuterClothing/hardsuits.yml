#Atmospherics Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseEngineeringContraband]
  id: ClothingOuterHardsuitAtmos
  name: combinaison spatiale atmosphérique # Goob edit
  description: Une combinaison spéciale qui protège contre les environnements dangereux à basse pression. Dispose d'une protection thermique.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/atmospherics.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/atmospherics.rsi
