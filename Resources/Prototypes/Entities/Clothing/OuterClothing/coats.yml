  name: trench-coat de détective
  description: Un trench-coat polyvalent du XVIIIe siècle. Quelqu'un qui porte ceci ne plaisante pas.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Coats/detective.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Coats/detective.rsi
