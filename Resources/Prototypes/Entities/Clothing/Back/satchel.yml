  id: ClothingBackpackSatchel
  name: sacoche
  description: Une sacoche à l'air tendance.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/satchel.rsi
  - type: Storage
    grid:
    - 0,0,1,3
    - 3,0,6,3
    - 8,0,9,3

