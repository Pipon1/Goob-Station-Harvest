- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelHolding
  name: sacoche bluespace
  description: Une sacoche qui s'ouvre sur une poche localisée de bluespace.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/holding.rsi
    state: icon
    layers:
    - state: icon
    - state: icon-unlit
      shader: unshaded
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,14,5 #Goob

- type: entity
  parent: ClothingBackpackSatchelHolding
  id: ClothingBackpackSatchelAdmin
  name: sacoche d'administration
  suffix: Admin
  description: Si vous voyez ceci d'une façon ou d'une autre, non, vous ne le voyez pas.
  components:
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: HideContrabandContent # Goobstation Contraband detector
  - type: Storage #Goob, nerf to bag of holding storage size
    maxItemSize: Huge
    grid:
    - 0,0,19,9