## Holsters

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltHolster
  name: shoulder holster
  description: 'A holster to carry a handgun and ammo. WARNING: Badasses only.'
  components:
  - type: Sprite
    sprite: Clothing/Belt/holster.rsi
  - type: Clothing
    sprite: Clothing/Belt/holster.rsi
  - type: Storage
    grid:
    - 0,0,3,1
    # Goobstation start
    whitelist:
      components:
      - BallisticAmmoProvider
      - CartridgeAmmo
      tags:
      - EnergySpeedloader
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
      storagebase: !type:Container
        ents: []
  - type: ItemSlots
    slots:
      item:
        name: Handgun
        whitelist:
          tags:
          - Sidearm
  # Goobstation end

- type: entity
  parent: [ClothingBeltHolster, BaseSyndicateContraband] # Goob - inherit from regular holster
  id: ClothingBeltSyndieHolster
  name: syndicate shoulder holster
  description: A deep shoulder holster capable of holding many types of ballistics.
  components:
  - type: Sprite
    sprite: Clothing/Belt/syndieholster.rsi
  - type: Clothing
    sprite: Clothing/Belt/syndieholster.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,3
    whitelist:
      components:
      - Gun
      - BallisticAmmoProvider
      - CartridgeAmmo
      tags: # Goob
      - EnergySpeedloader
  - type: ItemSlots # Goob - hold ANY gun instead of just sidearms
    slots:
      item:
        name: Gun
        whitelist:
          components:
          - Gun
  - type: StaticPrice
    price: 500

