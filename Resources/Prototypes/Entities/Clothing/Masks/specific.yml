- type: entity
  parent: [ClothingMaskBase, BaseChameleon]
  id: ClothingMaskGasChameleon
  name: masque à gaz
  description: Devenez L'HOMME AU MASQUE À GAZ.
  suffix: Chameleon
  components:
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag
    - type: Sprite
      sprite: Clothing/Mask/gas.rsi
    - type: Clothing
      sprite: Clothing/Mask/gas.rsi
    - type: ChameleonClothing
      slot: [mask]
      default: ClothingMaskGas
    - type: BreathMask
    - type: IdentityBlocker # need that for default ClothingMaskGas
    - type: HideLayerClothing
      slots:
      - Snout

- type: entity
  parent: ClothingMaskGasChameleon
  id: ClothingMaskGasVoiceChameleon
  suffix: Voice Mask, Chameleon
  components:
    - type: VoiceMask
    - type: UIRequiresLock
      userInterfaceKeys:
        - enum.ChameleonUiKey.Key
        - enum.VoiceMaskUIKey.Key
      accessDeniedSound: null
      popup: null
    - type: HideLayerClothing
      slots:
      - Snout
    - type: UserInterface
      interfaces:
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface
        enum.VoiceMaskUIKey.Key:
          type: VoiceMaskBoundUserInterface
    - type: Tag
      tags:
      - IPCMaskWearable # EE - IPCs

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskGoldenCursed
  name: masque doré
  description: Auparavant utilisé dans d'étranges pantomimes, après qu'un des acteurs soit devenu fou sur scène, ces masques ont été évités. Vous jurez que son visage se contorsionne quand vous ne regardez pas.
  components:
  - type: Sprite
    sprite: Clothing/Mask/goldenmask.rsi
    layers:
    - state: icon
      map: [ "mask" ]
  - type: Clothing
    sprite: Clothing/Mask/goldenmask.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CursedMaskVisuals.State:
        mask:
          Neutral: { state: icon }
          Despair: { state: icon-despair }
          Joy: { state: icon-joy }
          Anger: { state: icon-anger }
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: SelfEquipOnly
  - type: CursedMask
    despairDamageModifier:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.4
  - type: HideLayerClothing
    slots:
    - Snout
  - type: IngestionBlocker
  - type: StaticPrice
    price: 5000