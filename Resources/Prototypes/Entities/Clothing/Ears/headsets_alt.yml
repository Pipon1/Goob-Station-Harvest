- type: entity
  abstract: true
  parent: ClothingHeadset
  id: ClothingHeadsetAlt
  name: oreillette
  description: Un interphone modulaire mis à jour qui s'adapte autour de la tête. Accepte des clés de chiffrement.
  components:
  - type: Sprite
    state: icon_alt
  - type: Clothing
    equippedPrefix: alt
  - type: FlashSoundSuppression # Goobstation

- type: entity
  parent: [ClothingHeadsetAltLoudspeaker, BaseCommandContraband] # Goobstation
  id: ClothingHeadsetAltCargo
  name: oreillette circum-auriculaire du quartier-maître
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCargo
      - EncryptionKeyCommand
      - EncryptionKeyCommon
  - type: Sprite
    sprite: Clothing/Ears/Headsets/cargo.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/cargo.rsi

