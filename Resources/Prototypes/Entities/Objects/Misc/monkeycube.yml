- type: entity
  parent: BoxCardboard
  name: boîte de cubes de singe
  id: MonkeyCubeBox
  description: Cubes de singe marque Drymate. Ajoutez juste de l'eau !
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MonkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: BaseItem
  abstract: true
  suffix: Wrapped
  id: BaseWrappedCube
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi

- type: entity
  parent: BaseWrappedCube
  name: cube de singe
  id: MonkeyCubeWrapped
  description: Déballez ceci pour obtenir un cube de singe.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MonkeyCube
  - type: Sprite
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube

- type: entity
  parent: MonkeyCubeBox
  name: boîte de cubes de kobold
  id: KoboldCubeBox
  description: Des kobolds condensés dans un cube. Ajoutez juste de l'eau !
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: KoboldCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold

- type: entity
  parent: MonkeyCubeBox
  name: boîte de cubes variantes
  id: VariantCubeBox
  description: Des cubes de kobold et de singe. Ajoutez juste de l'eau !
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: KoboldCubeWrapped
          amount: 4
        - id: MonkeyCubeWrapped
          amount: 4
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant

- type: entity
  parent: BaseWrappedCube
  name: cube de kobold
  id: KoboldCubeWrapped
  description: Déballez ceci pour obtenir un cube de kobold.
  components:
  - type: SpawnItemsOnUse
    items:
      - id: KoboldCube
  - type: Sprite
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: boîte de cubes de singe
  suffix: Syndicat
  id: SyndicateSpongeBox
  description: Cubes de singe marque Drymate. Ajoutez juste de l'eau !
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: cube de singe
  suffix: Wrapped, Syndicate
  id: SyndicateSpongeWrapped
  components:
  - type: SpawnItemsOnUse
    items:
      - id: SyndicateSponge
