- type: entity
  name: stylo
  parent: [BaseItem, StorePresetUplink] # Goob - Pen ooplinkz
  id: Pen
  description: Un stylo à encre noire.
  components:
  - type: Sprite
    sprite: Objects/Misc/pens.rsi
    state: pen
  - type: Item
    sprite: Objects/Misc/pens.rsi
    heldPrefix: pen
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Pen
  - type: UserInterface # Goob starting here
    interfaces:
      enum.PenSpinUiKey.Key:
        type: PenSpinBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.PenSpinUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
    singleUser: false
    verbOnly: true
  - type: Pen # Goob ending here
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 10
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/pen_click.ogg
      params:
        volume: -4
        maxDistance: 2
  - type: UseDelay
    delay: 1.5
  - type: Tending # Shitmed
    speed: 0.55
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/hemostat1.ogg
  - type: ThrowableBlocked # Goobstation
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.3,0.1
          - -0.1,0.3
          - 0.3,-0.1
          - 0.1,-0.3
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  parent: Pen
  id: PenEmbeddable
  abstract: true
  components:
  - type: EmbeddableProjectile
    offset: 0.3,0.0
    removalTime: 0.0
  - type: ThrowingAngle
    angle: 315
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3

#TODO: I want the luxury pen to write a cool font like Merriweather in the future.

- type: entity
  name: stylo de luxe
  parent: Pen
  id: LuxuryPen
  description: Un stylo chic et cher que vous ne méritez de posséder que si vous êtes qualifié pour gérer d'immenses quantités de paperasse.
  components:
  - type: Sprite
    state: luxury_pen
  - type: Item
    heldPrefix: luxury_pen

- type: entity
  id: BaseAdvancedPen
  parent: PenEmbeddable
  abstract: true
  components:
  - type: Tag
    tags:
    - Write
    - WriteIgnoreStamps
    - Pen
  - type: MeleeWeapon
    wideAnimationRotation: -45
    damage:
      types:
        Piercing: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities:
    - Screwing
    useSound:
      collection: Screwdriver
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 20 # Goobstation - ow

- type: entity
  name: stylo Cybersun
  parent: [BaseAdvancedPen, BaseSyndicateContraband]
  id: CyberPen
  description: Un stylo haute technologie tout droit sorti du service juridique de Cybersun, capable de réfracter de la lumière dure à des angles impossibles à travers sa pointe en diamant pour écrire. Si puissant qu'il peut même réécrire des documents officiellement tamponnés si nécessaire.
  components:
  - type: Sprite
    state: overpriced_pen
  - type: Item
    heldPrefix: overpriced_pen
  - type: StaticPrice
    price: 500

- type: entity
  name: stylo CentComm
  parent: [BaseAdvancedPen, BaseCentcommContraband]
  id: PenCentcom
  description: Dans une tentative de rivaliser avec la "puissance" de la bureaucratie de Cybersun, NT a fait une réplique de cyber stylo, dans son style corporatif.
  components:
  - type: Sprite
    state: pen_centcom
  - type: Item
    heldPrefix: pen_centcom

- type: entity
  name: stylo-plume du capitaine
  parent: PenEmbeddable
  id: PenCap
  description: Un stylo-plume luxueux pour le capitaine de la station.
  components:
  - type: Sprite
    state: pen_cap

- type: entity
  name: stylo-plume du chef du personnel
  parent: PenEmbeddable
  id: PenHop
  description: Un stylo-plume luxueux pour le chef du personnel de la station.
  components:
  - type: Sprite
    state: pen_hop

- type: entity
  name: stylo magique du sorcier
  parent: [ PenEmbeddable, BaseMagicalContraband ]
  id: PenWiz
  description: Un stylo-plume luxueux. Il semble avoir une gomme en cristal magique.
  components:
  - type: Sprite
    state: pen_wizard
  - type: Tag
    tags:
    - WriteIgnoreStamps
    - Write
    - Pen
