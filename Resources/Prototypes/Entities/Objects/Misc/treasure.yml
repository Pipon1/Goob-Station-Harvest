- type: entity
  parent: BaseItem
  id: TreasureDatadiskEncrypted
  name: disque de données chiffré
  description: Un vieux disque de données. Quelqu'un de plus débrouillard que vous pourrait le déchiffrer et apprendre quelque chose d'intéressant. Tout ce que vous pouvez faire, c'est le vendre.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      color: "#868686"
    - state: datadisk_label
    - state: datadisk_encrypted
  - type: PointLight
    radius: 1.5
    energy: 0.5
    castShadows: false
    color: "#0000ff"
  - type: StaticPrice
    price: 500

- type: entity
  parent: BaseItem
  id: TreasureHardDiskDrive
  name: lecteur de disque dur
  description: Un lecteur de disque dur conçu pour une technologie terrestre ancienne, circa 1980. Il y a probablement quelque collectionneur qui voudrait mettre la main dessus.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: harddisk
      map: [ "base" ]
  - type: Item
    storedRotation: -90
  - type: RandomSprite
    available:
    - base:
        harddisk: ""
        harddisk_mini: ""
        harddisk_micro: ""
  - type: StaticPrice
    price: 275

- type: entity
  parent: BaseItem
  id: TreasureFlopDiskDrive
  name: lecteur de disquette
  description: Un lecteur permettant de lire des informations sur des disquettes. Dommage que les seules choses stockées dessus de nos jours soient des opérations de bombe nucléaire.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: flopdrive
  - type: Item
    storedRotation: -90
  - type: StaticPrice
    price: 350

- type: entity
  parent: BaseItem
  id: TreasureCDDrive
  name: lecteur de CD
  description: Un lecteur permettant de lire des données sur des CD. De nos jours, ce n'est pas la chose la plus utile, sauf si vous prévoyez de voler quelque part.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cddrive
  - type: Item
    storedRotation: -90
  - type: StaticPrice
    price: 300

- type: entity
  parent: BaseItem
  id: TreasureCPUSupercharged
  name: CPU surpuissant
  description: Une sorte de technologie extraterrestre super avancée. Dommage que tous les ordinateurs soient déjà équipés de CPU de nos jours.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cpu_super
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 750

- type: entity
  parent: BaseItem
  id: TreasureSampleTube
  name: tube à échantillon
  description: Un tube en verre contenant une sorte de substance visqueuse. Il semble fragile.
  components:
  - type: Sprite
    sprite: Objects/Misc/sample_tubes.rsi
    layers:
    - state: blank
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        blank: ""
        power: ""
        reinforcer: ""
        energy: ""
        synchronizer: ""
        stabilizer: ""
  - type: StaticPrice
    price: 120

- type: entityTable
  id: TreasureCoinPile
  table: !type:GroupSelector
    children:
    - id: TreasureCoinIron
      weight: 24
    - id: TreasureCoinSilver
      weight: 40
    - id: TreasureCoinGold
      weight: 24
    - id: TreasureCoinAdamantine
      weight: 11
    - id: TreasureCoinDiamond
      weight: 1

- type: entityTable
  id: TreasureCoinPileRare
  table: !type:GroupSelector
    children:
    - id: TreasureCoinIron
      weight: 10
    - id: TreasureCoinSilver
      weight: 25
    - id: TreasureCoinGold
      weight: 40
    - id: TreasureCoinAdamantine
      weight: 20
    - id: TreasureCoinDiamond
      weight: 5

- type: entity
  parent: BaseItem
  id: TreasureCoinIron
  name: pièce
  description: Un morceau de métal plat. S'il était encore en circulation, l'inflation l'aurait rendu sans valeur. Comme ce n'est plus le cas, il vaut assez pour être gardé dans un livre.
  components:
  - type: Sprite
    sprite: Objects/Misc/coins.rsi
    state: coin_iron
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 75

