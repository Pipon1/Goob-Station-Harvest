  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
    - CoordinatesDisk
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 1
  - type: ShuttleDestinationCoordinates