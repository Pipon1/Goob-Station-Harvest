- type: entity
  name: tampon en caoutchouc générique
  parent: BaseItem
  id: RubberStampBase
  description: Un tampon en caoutchouc pour tamponner des documents importants.
  abstract: true
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "paper_stamp-generic"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/stamps.rsi
    state: stamp-mime
  - type: Item
    size: Tiny
  - type: StealTarget
    stealGroup: Stamp

- type: entity
  name: tampon en caoutchouc alternatif
  parent: RubberStampBase
  id: RubberStampBaseAlt
