- type: entity
  name: disque d'authentification nucléaire
  parent: [BaseItem, BaseGrandTheftContraband]
  id: NukeDisk
  description: "Un disque d'authentification nucléaire, capable d'armer une bombe nucléaire s'il est utilisé avec un code. Une note de Nanotrasen indique : \"CECI EST VOTRE POSSESSION LA PLUS IMPORTANTE, PROTÉGEZ DAT FUKKEN DISK !\""
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -7
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -7
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -7
  # Goobstation edit end
  - type: NukeDisk
  - type: SpecialRespawn
    prototype: NukeDisk
  - type: Sprite
    sprite: Objects/Misc/nukedisk.rsi
    state: icon
  - type: StaticPrice
    price: 2000
  - type: CargoSellBlacklist
  - type: ArrivalsBlacklist
  - type: WarpPoint
    follow: true
    location: nuke disk
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag
    tags:
    - HighRiskItem
    - GhostOnlyWarp
  - type: StealTarget
    stealGroup: NukeDisk
  - type: SupermatterImmune # Goobstation

