# Implanters

- type: entity
  nom: implanteur
  id: BaseImplanter
  parent: BaseItem
  abstract: true
  components:
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      implanter_slot: !type:ContainerSlot { }
  - type: Implanter
    whitelist:
      components:
      - MobState # no chair microbomb
    blacklist:
      components:
      - Guardian # no holoparasite macrobomb wombo combo
      tags:
      - Unimplantable
    currentMode: Draw
    implanterSlot:
      name: implant
      locked: True
      priority: 0
      whitelist:
        tags:
        - SubdermalImplant
    allowDeimplantAll: false
    deimplantWhitelist:
    - SadTromboneImplant
    - LightImplant
    - BikeHornImplant
    - TrackingImplant
    - StorageImplant
    - FreedomImplant
    - UplinkImplant
    - EmpImplant
    - ScramImplant
    - DnaScramblerImplant
    - MicroBombImplant
    - MacroBombImplant
    - DeathAcidifierImplant
    - DeathRattleImplant
    - MindShieldImplant
    - FakeMindShieldImplant
    - RadioImplant
    - ChameleonControllerImplant
    - VoiceMaskImplant
    # Goob implants
    - MindcontrolImplant
    - KravMagaImplant
    - NutrimentPumpImplant
    - SmokeImplant
    # - StypticStimulatorImplant # Uncomment if given to traitors, currently it's DS only implant
    - BinaryImplant # Goobstation?
    deimplantFailureDamage:
      types:
        Cellular: 50 # NotGoobstation its 50 genetic to prevent you from randomly extracting implants.
        Heat: 10
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter0
    layers:
    - state: implanter0
      map: [ "implantOnly" ]
      visible: true
    - state: implanter1
      map: [ "implantFull" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ImplanterVisuals.Full:
        implantFull:
          True: {visible: true}
          False: {visible: false}
      enum.ImplanterImplantOnlyVisuals.ImplantOnly:
        implantOnly:
          True: {state: broken}
          False: {state: implanter0}
  - type: UserInterface
    interfaces:
      enum.DeimplantUiKey.Key:
        type: DeimplantBoundUserInterface
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 125
      Glass: 125

- type: entity
  id: Implanter
  parent: BaseImplanter
  name: extracteur d'implants
  description: "Une seringue à double usage conçue pour l'extraction d'implants sous-dermiques spécifiques. Une fois un implant extraits, il est stocké à l'intérieur et peut être ré-administré.\nAVERTISSEMENT : Une erreur de l'opérateur, telle que la sélection d'un type d'absent, provoque un traumatisme génétique sévère pour l'opérateur."
  components:
  - type: Tag
    tags:
    - Trash

- type: entity
  id: ImplanterAdmeme
  parent: Implanter
  suffix: Admeme
  components:
  - type: Implanter
    # go wild with sentient chairs with macrobombs
    whitelist: null
    blacklist: null
    implantTime: 5
    drawTime: 5

- type: entity
  id: BaseImplantOnlyImplanter
  parent: Implanter
  description: Une seringue jetable exclusivement conçue pour l'injection d'implants sous-dermiques.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter0
    layers:
    - state: implanter1
      map: [ "implantFull" ]
      visible: true
    - state: implanter0
      map: [ "implantOnly" ]
  - type: Implanter
    currentMode: Inject
    implantOnly: true

- type: entity
  id: BaseImplantOnlyImplanterSyndi
  parent: [BaseImplantOnlyImplanter, BaseSyndicateContraband]
  name: implanteur du syndicat
  description: Une seringue jetable compacte exclusivement conçue pour l'injection d'implants sous-dermiques. Assurez-vous de la frotter avec du savon pour éliminer l'ADN résiduel après utilisation !
  abstract: true
  components:
  - type: Item
    sprite: Objects/Specific/Medical/syndi_implanter.rsi
    heldPrefix: implanter
  - type: Sprite
    sprite: Objects/Specific/Medical/syndi_implanter.rsi
    state: implanter1
    layers:
    - state: implanter0
      map: [ "implantFull" ]
      visible: true
    - state: implanter1
      map: [ "implantOnly" ]
  - type: GenericVisualizer
    visuals:
      enum.ImplanterVisuals.Full:
        implantFull:
          True: {visible: true}
          False: {visible: false}
      enum.ImplanterImplantOnlyVisuals.ImplantOnly:
        implantOnly:
          True: {state: broken}
          False: {state: implanter1}
  - type: Tag
    tags: []

