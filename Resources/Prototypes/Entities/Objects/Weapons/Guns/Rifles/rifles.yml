    minAngle: 30 # Goob
    maxAngle: 45 # Goob
    shotsPerBurst: 3
    selectedMode: Burst
    availableModes:
    - Burst
    burstFireRate: 10 # Goob
  - type: GunWieldBonus
    minAngle: -30 # Goob
    maxAngle: -40 # Goob
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Chargeur
        startingItem: MagazineLightRifle # Goob
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
