  description: Un DMR tirant en rafales, désormais déclassé, l'Estoc a rapidement trouvé son chemin dans les mains des paramilitaires et des groupes d'assaut. Dispose d'une lunette tritium coûteuse pour une acquisition de cible plus rapide. Utilise des chargeurs .30 Rifle.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/estoc.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
