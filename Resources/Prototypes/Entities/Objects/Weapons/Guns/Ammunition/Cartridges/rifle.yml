- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeRifle
  name: cartouche (.20 fusil)
  components:
  - type: Tag
    tags:
      - CartridgeRifle
  - type: CartridgeAmmo
    proto: BulletRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifle
  name: cartouche (.20 fusil)
  description: Une cartouche intermédiaire moderne pour fusils d'assaut. Les munitions cinétiques standard sont courantes et utiles dans la plupart des situations.
  components:
  - type: CartridgeAmmo
    proto: BulletRifle

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRiflePractice
  name: cartouche (.20 fusil entraînement)
  description: Une cartouche intermédiaire moderne pour fusils d'assaut. Les munitions à craie sont généralement inoffensives, utilisées pour l'entraînement.
  components:
  - type: CartridgeAmmo
    proto: BulletRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleIncendiary
  name: cartouche (.20 fusil incendiaire)
  description: Une cartouche intermédiaire moderne pour fusils d'assaut. es munitions incendiaires contiennent un composé à auto-allumage qui embrase la cible.
  components:
  - type: CartridgeAmmo
    proto: BulletRifleIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleUranium
  name: cartouche (.20 fusil uranium)
  description: Une cartouche intermédiaire moderne pour fusils d'assaut. Les munitions à noyau d'uranium comportent une charge de matériau fissile qui irradie la cible de l'intérieur.
  components:
  - type: CartridgeAmmo
    proto: BulletRifleUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"