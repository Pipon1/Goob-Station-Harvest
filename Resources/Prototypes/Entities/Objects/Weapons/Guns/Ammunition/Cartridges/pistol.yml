- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgePistol
  name: cartouche (.35 auto)
  components:
  - type: Tag
    tags:
      - CartridgePistol
  - type: CartridgeAmmo
    proto: BulletPistol
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistol
  name: cartouche (.35 auto)
  description: Sans doute le calibre le plus répandu sur le marché, utilisé par toutes sortes de pistolets et de mitraillettes. Les munitions cinétiques standard sont courantes et utiles dans la plupart des situations.
  components:
  - type: CartridgeAmmo
    proto: BulletPistol

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolPractice
  name: cartouche (.35 auto entraînement)
  description: Sans doute le calibre le plus répandu sur le marché, utilisé par toutes sortes de pistolets et de mitraillettes. Les munitions à craie sont généralement inoffensives, utilisées pour l'entraînement.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolPractice
  -  type: Sprite
     layers:
       - state: base
         map: [ "enum.AmmoVisualLayers.Base" ]
       - state: tip
         map: [ "enum.AmmoVisualLayers.Tip" ]
         color: "#dbdbdb"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolIncendiary
  name: cartouche (.35 auto incendiaire)
  description: Sans doute le calibre le plus répandu sur le marché, utilisé par toutes sortes de pistolets et de mitraillettes. Les munitions incendiaires contiennent un composé à auto-allumage qui embrase la cible.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  id: CartridgePistolUranium
  name: cartouche (.35 auto uranium)
  description: Sans doute le calibre le plus répandu sur le marché, utilisé par toutes sortes de pistolets et de mitraillettes. Les munitions à noyau d'uranium comportent une charge de matériau fissile qui irradie la cible de l'intérieur.
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    proto: BulletPistolUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolSpent
  name: cartouche (.35 auto)
  suffix: spent
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base-spent
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: BulletPistol
    spent: true
  - type: Tag
    tags:
    - CartridgePistol
    - Trash # surely theres a way to automatically add this...
