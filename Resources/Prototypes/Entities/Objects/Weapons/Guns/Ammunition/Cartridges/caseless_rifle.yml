- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeCaselessRifle
  name: cartouche (9.5mm) # Goob edit
  components:
  - type: Tag
    tags:
      - CartridgeCaselessRifle
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifle
  name: cartouche (9.5mm HP) # Goob edit
  description: Un petit calibre utilisant la technologie sans douille, remplaçant l'étui en laiton conventionnel par un propulseur durci. Les munitions cinétiques standard sont courantes et utiles dans la plupart des situations.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifle

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePractice
  name: cartouche (9.5mm entraînement) # Goob edit
  description: Un petit calibre utilisant la technologie sans douille, remplaçant l'étui en laiton conventionnel par un propulseur durci. Les munitions à craie sont généralement inoffensives, utilisées pour l'entraînement.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"
