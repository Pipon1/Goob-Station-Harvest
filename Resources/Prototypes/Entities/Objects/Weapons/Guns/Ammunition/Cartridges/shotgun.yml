- type: entity
  abstract: true
  parent: BaseCartridge
  id: BaseShellShotgun
  name: cartouche (calibre 12) # Goobstation
  components:
  - type: Tag
    tags:
    - ShellShotgun
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityBartenderContraband ]
  id: ShellShotgunBeanbag
  name: cartouche (calibre 12 sachet) # Goobstation
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: beanbag
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunBeanbag
  - type: SpentAmmoVisuals
    state: "beanbag"

