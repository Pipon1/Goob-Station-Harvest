- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeLightRifle
  name: cartouche (.30 fusil)
  components:
  - type: Tag
    tags:
    - CartridgeLightRifle
  - type: CartridgeAmmo
    proto: BulletLightRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifle
  name: cartouche (.30 fusil)
  description: Une cartouche intermédiaire classique utilisée par de nombreux fusils de combat et mitrailleuses légères. Les munitions cinétiques standard sont courantes et utiles dans la plupart des situations.
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifle

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRiflePractice
  name: cartouche (.30 fusil entraînement)
  description: Une cartouche intermédiaire classique utilisée par de nombreux fusils de combat et mitrailleuses légères. Les munitions à craie sont généralement inoffensives, utilisées pour l'entraînement.
  components:
  - type: CartridgeAmmo
    proto: BulletLightRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifleIncendiary
  name: cartouche (.30 fusil incendiaire)
  description: Une cartouche intermédiaire classique utilisée par de nombreux fusils de combat et mitrailleuses légères. Les munitions incendiaires contiennent un composé à auto-allumage qui embrase la cible.
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifleUranium
  name: cartouche (.30 fusil uranium)
  description: Une cartouche intermédiaire classique utilisée par de nombreux fusils de combat et mitrailleuses légères. Les munitions à uranium remplacent le noyau de plomb de la balle par du matériau fissile, irradiant la cible de l'intérieur.
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"