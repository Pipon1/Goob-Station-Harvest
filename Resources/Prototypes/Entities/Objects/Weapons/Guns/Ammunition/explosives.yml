# Rockets

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocket
  name: grenade PG-7VL
  description: Une ogive 1.5 conçue pour le lanceur RPG-7. De forme tubulaire.
  components:
  - type: Tag
    tags:
      - CartridgeRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 20

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocketSlow
  name: grenade PG-7VL "Escargot-Fusée"
  description: Une ogive 1.5 conçue pour le lanceur RPG-7. Elle est inhabituellement lente.
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletWeakRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: frag
    - type: StaticPrice
      price: 20

- type: entity
  id: CartridgeRocketSingularityBuster
  name: grenade anti-singularité propulsée par fusée
  parent: [BaseItem, BaseCommandContraband]
  description: Une ogive contenant une grande quantité d'antiparticules. En touchant une singularité, les antiparticules sont libérées, décomposant la singularité. Garantie annulée si la fusée touche autre chose qu'une singularité ou une bobine de Tesla.
  components:
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletSingularityBusterRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: buster
    - type: Tag
      tags:
      - CartridgeRocket

# Grenades

- type: entity
  abstract: true
  parent: [BaseItem, BaseMajorContraband]
  id: BaseGrenade
  name: base grenade
  components:
  - type: Tag
    tags:
    - Grenade
  - type: Item
    size: Small
  - type: Sprite

- type: entity
  parent: BaseGrenade
  id: GrenadeBaton
  name: grenade bâton (40mm)
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeBaton
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
  - type: Tag
    tags:
     - Grenade # Goobstation
     - NonLethalGrenade # Goobstation
#    suffix: false - Goobstation

