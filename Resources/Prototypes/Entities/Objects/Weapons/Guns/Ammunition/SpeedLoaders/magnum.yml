- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseSpeedLoaderMagnum
  name: "chargeur rapide (.45 magnum)"
  components:
  - type: Tag
    tags:
      - SpeedLoaderMagnum
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnum
  name: "chargeur rapide (.45 magnum)"
  description: Conçu pour charger rapidement jusqu'à six cartouches de .45 magnum dans un revolver vide. Destiné aux munitions cinétiques polyvalentes.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-ammo
      right:
      - state: inhand-right-mag
      - state: inhand-right-ammo

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumEmpty
  name: "chargeur rapide (.45 magnum universel)"
  suffix: empty
  description: Conçu pour charger rapidement jusqu'à six cartouches de .45 magnum dans un revolver vide.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumIncendiary
  name: "chargeur rapide (.45 magnum incendiaire)"
  description: Conçu pour charger rapidement jusqu'à six cartouches de .45 magnum dans un revolver vide. Destiné aux munitions incendiaires à auto-allumage.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumIncendiary

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnumPractice
  name: "chargeur rapide (.45 magnum entraînement)"
  description: Conçu pour charger rapidement jusqu'à six cartouches de .45 magnum dans un revolver vide. Destiné aux munitions à craie inoffensives.
