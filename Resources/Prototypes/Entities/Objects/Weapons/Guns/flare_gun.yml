- type: entity
  name: pistolet à fusée lumineuse
  parent: BaseItem
  id: WeaponFlareGun
  description: Un pistolet compact à un coup tirant des cartouches de fusil à pompe. Dispose d'une sécurité empêchant l'insertion de cartouches létales.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/flaregun.rsi #GoobStation resprite
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/flaregun.rsi #GoobStation resprite
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chambre
        startingItem: ShellShotgunFlare
        priority: 1
        whitelist:
          tags: ## TODO: Add a risk of the gun blowing up if using non-light shotgun shells, and then re-enable them.
            ## - ShellShotgun
            - ShellShotgunLight
  - type: ContainerContainer
    containers:
      gun_chamber: !type:ContainerSlot
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    boltClosed: false
    canRack: false
    soundBoltClosed: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
    soundBoltOpened: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
    soundRack: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/flaregun.rsi #GoobStation resprite
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Appearance
  - type: Gun
    fireRate: 8
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/flaregun.ogg
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/gun_pickup.ogg
      params:
        volume: -8
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/gun_drop.ogg
      params:
        volume: -8
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/gun_drop.ogg
      params:
        volume: -8
  - type: RestrictGunshotsByUserTag
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  # Goobstation edit end

- type: entity
  name: pistolet à cartouches de sécurité
  parent: [WeaponFlareGun, BaseSecurityContraband]
  id: WeaponFlareGunSecurity
  description: Un pistolet à fusée modifié, à l'origine conçu pour être utilisé par la sécurité afin de tirer des cartouches de fusil à pompe non-létales, mais qui peut aussi tirer des cartouches létales sans risque.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/flaregun_security.rsi #GoobStation resprite
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Small
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/flaregun_security.rsi #GoobStation resprite
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chambre
        priority: 1
        whitelist:
          tags:
            - ShellShotgun
  - type: Tag
    tags:
    - Sidearm
