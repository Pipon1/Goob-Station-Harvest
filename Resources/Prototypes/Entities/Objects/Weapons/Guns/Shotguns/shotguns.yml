- type: entity
  name: Enforcer
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunEnforcer
  description: Une plateforme de fusil à pompe semi-automatique haut de gamme conçue pour les forces de l'ordre et l'antiterrorisme. Fiable comme un fusil à pompe, même dans des conditions extrêmes. Charge 7 coups calibre 12.
  components: # intend for Enforcer to have wider choke for semi-auto function
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/enforcer.rsi #GoobStation resprite
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/enforcer.rsi #GoobStation resprite
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/enforcer.rsi #GoobStation resprite
    shape: # Goobstation
    - 0,0,4,1
  - type: BallisticAmmoProvider
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    fireRate: 1.7 # Goobstation

- type: entity
  parent: WeaponShotgunEnforcer
  id: WeaponShotgunEnforcerRubber
  suffix: Non-Lethal
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunBeanbag

- type: entity
  name: Kammerer
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunKammerer
  description: Un vieux et fidèle fusil à pompe, le Kammerer est bon marché, léger, et fonctionnerait probablement encore si vous le laissiez dans la chambre de combustion une semaine. Populaire pour l'usage civil, et adoré par NanoTrasen pour son prix minuscule. Charge 7 coups calibre 12.
  components: # intend for Kammerer to have tighter choke for slower fire rate and/or manual cycling
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/pump.rsi #GoobStation resprite
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/pump.rsi #GoobStation resprite
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Shotguns/pump.rsi #GoobStation resprite
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    # fireRate: 1 # goob
  - type: GunSpreadModifier
    spread: 0.6
  - type: Tag
    tags:
    - WeaponShotgunKammerer
  - type: BallisticAmmoProvider # Goobstation
    autoCycle: false

