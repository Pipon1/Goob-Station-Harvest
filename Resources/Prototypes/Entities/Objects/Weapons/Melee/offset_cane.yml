- type: entity
  parent: BaseItem
  id: OffsetCane
  name: canne de marche standard
  description: Une canne de marche standard, essentielle pour se déplacer quand vos jambes ne suivent pas. Peut ou non vous accorder la sagesse des anciens.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
  - type: MobilityAid
#  - type: RandomSprite # Ideally I'd rather these be their own selectable item instead of randomly picked.
#    available:
#    - color: "#91949C"  # standard gray
#    - color: "#000000"  # black
#    - color: "#406BDE"  # blue
#    - color: "#00FFFF"  # cyan
#    - color: "#00FF00"  # green
#    - color: "#FF69B4"  # pink
#    - color: "#800080"  # purple
#    - color: "#FF0000"  # red
#    - color: "#FFFF00"  # yellow
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 5
  - type: StaminaDamageOnHit
    damage: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 3
  - type: UseDelay
    delay: 1

- type: entity
  parent: OffsetCane
  id: OffsetCaneClown
  name: canne de marche arc-en-ciel
  description: Une canne de marche arc-en-ciel, parfaite pour les clowns et ceux qui apprécient une touche de couleur dans leur vie.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi

