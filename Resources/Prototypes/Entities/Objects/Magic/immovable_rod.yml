- type: entity
  id: ImmovableRod
  name: tige immobile
  description: Vous pouvez sentir qu'il a faim. C'est généralement un mauvais signe.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: MovementIgnoreGravity
    weightless: true
  - type: Sprite
    sprite: Objects/Fun/immovable_rod.rsi
    state: icon
    noRot: false
  - type: ImmovableRod
    minSpeed: 15 # Goobstation
    maxSpeed: 15 # Goobstation
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: PointLight
    radius: 3
    color: red
    energy: 2.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb # Goob edit
          bounds: "-0.2,-0.5,0.2,0.5"
        density: 2.5 # Goob edit
        hard: false
        mask: # Goob edit
        - Impassable
        - Opaque
        layer: # Goobstation
        - MidImpassable
  - type: WarpPoint
    follow: true
    location: immovable rod
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag # DeltaV - Prevent the warp point from being chosen for bombing/effigy targets
    tags:
      - GhostOnlyWarp

- type: entity
  parent: ImmovableRod
  id: ImmovableRodDespawn
  suffix: Despawn
  components:
  - type: TimedDespawn
    lifetime: 30.0

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodSlow
  suffix: Slow
  components:
  - type: ImmovableRod
    minSpeed: 1
    maxSpeed: 5

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodKeepTiles
  suffix: Keep Tiles
  components:
  - type: ImmovableRod
    destroyTiles: false
    hitSoundProbability: 1.0

# For Wizard Polymorph
- type: entity
  parent: ImmovableRod
  id: ImmovableRodWizard
  suffix: Wizard
  components:
  - type: ImmovableRod
    minSpeed: 6 # Goob edit
    maxSpeed: 6 # Goob edit
    hitSoundProbability: 1 # Goob edit
    ignoreResistances: true # Goobstation
    knockdownTime: 4 # Goobstation
    destroyTiles: false
    randomizeVelocity: false
    shouldGib: false
    damage:
      types:
        Blunt: 70 # Goobstation
  - type: Physics
    bodyType: KinematicController
  #- type: InputMover Goob edit
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 5
    baseWeightlessModifier: 2
    baseWeightlessFriction: 0
    baseFriction: 0
    offGridFriction: 0
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: NoSlip
  - type: Trail # Goobstation
    frequency: 0.1
    lifetime: 1
    lerpTime: 0.1
    alphaLerpAmount: 0.4
    sprite:
      sprite: /Textures/Objects/Fun/immovable_rod.rsi
      state: icon
  - type: StatusIcon # Goobstation
    bounds: -0.5,-0.5,0.5,0.5
  - type: IsDeadIC # Goobstation
    dead: false

- type: entity
  parent: ImmovableRodKeepTiles
  id: ImmovableRodKeepTilesStill
  suffix: Keep Tiles, Still
  components:
  - type: ImmovableRod
    randomizeVelocity: false
    maxSpeed: 0

- type: entity
