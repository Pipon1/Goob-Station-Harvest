- type: entity
  id: CigPackMixed
  parent: CigPackMixedBase
  name: paquet de cigarettes trempées de Dan
  suffix: Mixed
  description: Dan a travaillé avec la chimie NT pour éliminer les produits chimiques excédentaires, PROFITEZ.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 2, 9
        tableId: RandomSoakedSmokeTable

