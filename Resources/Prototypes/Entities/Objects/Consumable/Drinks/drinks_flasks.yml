- type: entity
  abstract: true
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: FlaskBase
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds

# Flasks

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase]
  id: DrinkFlaskOld
  name: vieille flasque
  description: Une vieille flasque décrépit, son couvercle semble être manquant.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask_old.rsi
  - type: FitsInDispenser
    solution: drink

- type: entity
  parent: FlaskBase
  id: DrinkShinyFlask
  name: flasque brillante
  description: Une flasque métallique brillante. Il semble avoir un symbole grec gravé dessus.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  suffix: Full
  name: flasque MRE
  description: Une vieille flasque militaire, remplie des meilleurs contenus pour les soldats.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 50
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: FlaskBase
  id: DrinkDetFlask
  name: flasque de l'inspecteur
  description: Une flasque métallique avec une bande de cuir et un insigne doré appartenant à l'inspecteur.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/detflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkHosFlask
  name: flasque du chef de la sécurité
  description: Une flasque métallique, adaptée à un chef de sécurité travailleur.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/hosflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkFlask
  name: flasque du capitaine
  description: Une flasque métallique appartenant au capitaine.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkFlaskBar
  name: flasque
  description: Une flasque métallique réutilisable. Plus classe que de boire directement à la bouteille.
  components:
    - type: Sprite
      sprite: Objects/Consumable/Drinks/barflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkLithiumFlask
  name: flasque de lithium
  description: Une flasque avec un symbole d'atome de lithium dessus.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lithiumflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkVacuumFlask
  name: flasque isolante
  description: Garder vos boissons à la température parfaite depuis 1892.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/vacuumflask.rsi
  - type: Tool
    qualities:
    - Rolling # Perfectly cylindrical flask
    speedModifier: 0.75
