- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottleGlassSmallBaseFull]
  id: DrinkMopwataBottleRandom
  name: délicieuse mopwata
  description: Une bouteille marron embrumée avec une étiquette décolorée dépeignant une serpillière. Elle est remplie d'une eau... trouble.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: Mopwata
          Quantity: 40
  - type: RandomFillSolution
    solution: drink
    weightedRandomId: RandomFillMopwata
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mopwata.rsi
