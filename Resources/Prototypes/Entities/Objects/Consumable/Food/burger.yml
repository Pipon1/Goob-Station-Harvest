# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBun
  name: petit pain
  description: Un petit pain pour hamburger. Rond et pratique à tenir.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6.66 # 1/3 of a loaf of bread, technically losing 0.01 nutriment per batch of three buns over making bread loaves/slices
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: FoodBreadBunTop
        amount: 1
      - id: FoodBreadBunBottom
        amount: 1

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: bun du bas
  description: Il est temps de commencer à construire la tour de burger.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    acceptAll: true # Goobstation - anythingburgers
    maxLayers: 12 # Goobstation - anythingburgers
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        canReact: false # Dont want cause reactions inside burgers after merging ingredients
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.3 # 1/2 of a bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: bun du haut
  description: La finition parfaite pour votre tour de burger.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.3 # 1/2 of a bun
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Vitamin
          Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

