# Cotton Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBun
  name: petit pain en coton
  description: Un bun pour hamburger en coton. Doux, rond et pratique à tenir.
  components:
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.33
        - ReagentId: Fiber
          Quantity: 3.33
  - type: Butcherable
    butcherDelay: 1
    spawned:
    - id: FoodCottonBunTop
      amount: 1
    - id: FoodCottonBunBottom
      amount: 1
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice


- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunBottom
  name: bun de coton du bas
  description: C'est le moment que les mites découvrent la tour de burger.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: CottonBurger
    acceptAll: true
    maxLayers: 12 #fixed aineias crashing admins # Upstreamer edit i lowered this cause new burger is ass
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-cotton-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        canReact: false # Dont want cause reactions inside burgers after merging ingredients
        reagents:
        - ReagentId: Nutriment
          Quantity: 1.665
        - ReagentId: Fiber
          Quantity: 1.665
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice

- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunTop
  name: bun de coton du haut
  description: La finition parfaite pour votre tour de burger fibreuse.
  components:
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_top
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 1.665
        - ReagentId: Fiber
          Quantity: 1.665
  - type: FoodSequenceElement
    entries:
      CottonBurger: CottonBunTopBurger
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice
