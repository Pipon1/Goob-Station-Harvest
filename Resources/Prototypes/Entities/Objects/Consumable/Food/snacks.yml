# Trash

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  id: FoodPacketTrash
  description: C'est des ordures.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
  - type: Item
    sprite: Objects/Consumable/Food/snacks.rsi
    size: Tiny
  - type: Tag
    tags:
    - Trash
    - RotHulkTrash # Goobstation - Wraith
  - type: PhysicalComposition #Goobstation - Recycle update - Changed trash to plastic
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage
  - type: StaticPrice
    price: 0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12 #goob, was 10
        reagents:
        - ReagentId: ToxinTrash
          Quantity: 5
        - ReagentId: Microplastics #Goob
          Quantity: 2
  - type: Edible
    requiresSpecialDigestion: true

