# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodNoodlesBase
  description: Là c'est des belles pâtes !
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 20

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: spaghetti bouilli
  description: Un plat ordinaire de pâtes, ça a besoin de plus d'ingrédients.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: spaghetti
  description: Des spaghettis et des tomates écrasées. Tout comme votre père abusif avait l'habitude de faire !
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - tomato
  - type: Sprite
    state: tomato
  - type: Tag
    tags:
    - Fruit
# Tastes like pasta, tomato.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesCopy
  name: copypasta
  description: Vous ne devriez probablement pas essayer ça, vous entendez toujours les gens parler de sa mauvaise qualité...
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Edible
    trash:
    - FoodPlateSmall
    - FoodPlateSmall
  - type: FlavorProfile
    flavors:
      - copypasta
  - type: Sprite
    state: copypasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 12
        - ReagentId: Vitamin
          Quantity: 8
# Tastes like pasta, bad humor.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesMeatball
  name: spaghetti et boulettes
  description: Là c'est une bella bouletta !
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - meaty
  - type: Sprite
    state: meatball
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 4
  - type: Tag
    tags:
    - Meat
# Tastes like pasta, meat.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesSpesslaw
  name: spesslaw
  description: Les préférés d'un avocat.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - meaty
  - type: Sprite
    state: spesslaw
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 6
# Tastes like pasta, meat.

- type: entity
  name: chow mein
  parent: FoodNoodlesBase
  id: FoodNoodlesChowmein
  description: Un agréable mélange de pâtes et de légumes frits.
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - oily
      - eggplant
      - carrot
  - type: Sprite
    state: chowmein
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Vitamin
          Quantity: 6
# Tastes like pasta, tomato.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesButter
  name: pâtes au beurre
  description: Des pâtes nappées de beurre savoureux. Simple et glissant, mais délicieux.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - butter
  - type: Sprite
    state: butter
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
