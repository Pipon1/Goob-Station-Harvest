# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_breakfast.yml

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBreakfastBase
  description: Un petit déjeuner complet, lève-toi et brille !
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Consumable/Food/breakfast.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 60
        reagents:
        - ReagentId: Nutriment
          Quantity: 40
        - ReagentId: Vitamin
          Quantity: 10

# Breakfasts

- type: entity
  parent: FoodBreakfastBase
  id: FoodBreakfastAmerican
  name: petit déjeuner américain complet
  description: Une énorme assiette de protéines et de glucides, plus susceptible de te remettre au lit que de te lever. Oh, quel enfer !
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Sprite
    state: fullamerican

- type: entity
  parent: FoodBreakfastBase
  id: FoodBreakfastEnglish
  name: petit déjeuner anglais complet
  description: Une énorme assiette de protéines et de glucides, plus susceptible de te remettre au lit que de te lever. Ne parle pas de la guerre !
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Sprite
    state: fullenglish
