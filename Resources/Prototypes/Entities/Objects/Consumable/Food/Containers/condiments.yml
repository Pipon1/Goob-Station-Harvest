# Shakers

- type: entity
  parent: BaseFoodCondiment # TODO: This should not inherit TrashOnSolutionEmpty, SpaceGarbage and the price of 0
  id: BaseFoodShaker
  abstract: true
  name: shaker vide
  description: Un shaker utilisé pour stocker et distribuer des épices.
  components:
  - type: Item
    size: Tiny
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None # don't conflict with stirring
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 5
    maxTransferAmount: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    state: shaker-empty
  - type: RefillableSolution
    solution: food

- type: entity
  parent: FoodShakerSaltEmpty #Goobstation - shaker making
  id: FoodShakerSalt
  name: salière
  description: Sel. provenant des océans de l'espace, probablement.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
