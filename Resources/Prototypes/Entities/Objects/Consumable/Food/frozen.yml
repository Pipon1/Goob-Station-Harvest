# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: FoodInjectableBase
  id: FoodFrozenBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # For sprinkles or something? Idk.
        reagents:
        - ReagentId: Nutriment
          Quantity: 10

# Ice-cream

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwich
  name: sandwich glacé
  description: Glace portable dans son propre emballage.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwichStrawberry
  name: sandwich glacé à la fraise
  description: Glace portable dans son propre emballage de variété fraise.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich-strawberry

- type: entity
  name: freezy spatiale
  parent: FoodFrozenBase
  id: FoodFrozenFreezy
  description: La meilleure glace de l'espace.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  name: sundae glacé
  parent: FoodFrozenBase
  id: FoodFrozenSundae
  description: Un dessert classique.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenCornuto
  name: cornuto
  description: Un cône de glace à la vanille et au chocolat napolitain. Il menace avec un saupoudrage de noix caramélisées.
  components:
  - type: Item
    storedRotation: -45
  - type: Sprite
    state: cornuto
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 1

# Popsicle

- type: entity
  name: stalacrème orange
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleOrange
  description: Un stalacrème orange classique. Un délice glacé ensoleillé.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: orange
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: stalacrème aux baies
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleBerry
  description: Un stalacrème vibrant aux baies. Un délice glacé aux baies.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: red
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: glace jumbo
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleJumbo
  description: Une glace luxueuse recouverte de chocolat riche. Elle est plus petite que vous ne vous en souvenez.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: jumbo
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 1

# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: cône de neige sucrée
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: Ce n'est que de la glace pilée et du sirop simple, l'effort minimum.
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
    - type: Sprite
      layers:
        - state: cone
        - state: alpha-filling
    #      color: foo
    - type: Edible
      trash:
      - FoodFrozenSnowconeTrash
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 20 # For sprinkles or something? Idk.
          reagents:
            - ReagentId: Ice
              Quantity: 8
            - ReagentId: Water
              Quantity: 2
            - ReagentId: Sugar
              Quantity: 2

- type: entity
  name: cône de neige sans saveur
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowcone
  description: Ce n'est que de la glace pilée. Toujours agréable à mâcher.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
          - ReagentId: Ice
            Quantity: 8

- type: entity
  name: cône de neige aux baies
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeBerry
  description: Sirop de baies versé sur une boule de neige dans un gobelet en papier.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: berry
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: cône de neige salade de fruits
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeFruit
  description: Un délicieux mélange de sirops d'agrumes versé sur une boule de neige dans un gobelet en papier.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: fruitsalad
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: cône de clown
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeClown
  description: Le rire versé sur une boule de neige dans un gobelet en papier.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: clown
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash

- type: entity
  name: cône de mime
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeMime
  description: ...
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: mime
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash

- type: entity
  name: cône de neige arc-en-ciel
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeRainbow
  description: Une boule de neige très colorée dans un gobelet en papier.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: rainbow
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash

# Trash

- type: entity
  parent: BaseItem
  id: FoodFrozenSnowconeTrash
  name: cône en papier
  description: Un cône en papier froissé utilisé pour un bonbon glacé. Sans valeur.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    state: cone-trash
  - type: Tag
    tags:
    - Trash

- type: entity
  name: bâton de sucette
  parent: BaseItem
  id: FoodFrozenPopsicleTrash
  description: Il a autrefois contenu un délicieux dessert. Maintenant, c'est stérile.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    layers:
      - state: stick
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          stick: ""
          stick2: ""
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
