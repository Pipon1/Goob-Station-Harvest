# Tastes like pie, nuts.

- type: entity
  name: tarte à la banane et à la crème
  parent: FoodPieBase
  id: FoodPieBananaCream
  description: Juste comme à la maison, sur la planète clown ! HONK !
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - banana
      - creamy
  - type: Sprite
    layers:
    - state: tin
    - state: plain
  - type: CreamPie
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: ContainerContainer
    containers:
      payloadSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      payloadSlot:
        whitelist:
          components:
          - TimerTrigger
        insertSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        swap: false
        disableEject: true
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: SliceableFood
    slice: FoodPieBananaCreamSlice
  - type: ThrowableBlocked # Goobstation
    behavior: Destroy

- type: entity
  name: tranche de tarte à la banane et à la crème
  parent: FoodPieSliceBase
