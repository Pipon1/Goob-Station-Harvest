    flavors:
      - sweet
      - apple
  - type: Sprite
    layers:
    - state: tin
    - state: apple
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: tranche de tarte aux pommes
  parent: FoodPieSliceBase
  id: FoodPieAppleSlice
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - apple
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: orange
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice
