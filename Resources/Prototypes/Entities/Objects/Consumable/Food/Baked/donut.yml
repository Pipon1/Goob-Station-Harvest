# Base

- type: entity
  parent: FoodInjectableBase
  id: FoodDonutBase
  abstract: true
  description: Va très bien avec un café robuste.
  components:
  - type: Tag
    tags:
    - Donut
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donut.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donut.rsi
    size: Tiny

- type: entity
  abstract: true
  parent: FoodDonutBase
  id: FoodDonutFruitBase
  components:
  - type: Tag
    tags:
    - Donut
    - Fruit
# Tastes like donut.

# The sprinkles are now an overlay, so you can put them on any donut! If we really
# wanted to go for EXTREME roleplay we could apply a different color to the sprinkles
# Since it's technically an alpha layer.

# You'll be able to bake the plain donuts, then mix up different glazes for them to
# apply with a brush or something.

# Plain Donuts

- type: entity
  name: beignet nature
  parent: FoodDonutBase
  id: FoodDonutPlain
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    state: plain

- type: entity
  name: beignet à la gelée nature
  parent: FoodDonutBase
  id: FoodDonutJellyPlain
  components:
  - type: FlavorProfile
    flavors:
      - jelly
  - type: Sprite
    state: jelly-plain
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 1

# Donuts

- type: entity
  name: beignet
  parent: FoodDonutBase
  id: FoodDonutHomer
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: homer
  - type: Item
    heldPrefix: pink

- type: entity
  name: beignet du chaos
  parent: FoodDonutBase
  id: FoodDonutChaos
  description: Comme la vie, il n'a jamais tout à fait le même goût.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - funny
      - magical
      - tingly
  - type: Sprite
    state: chaos
# Tastes like donut, chaos.

- type: entity
  name: beignet à la viande
  parent: FoodDonutBase
  id: FoodDonutMeat
  description: Ça a le goût aussi dégoûtant que ça en a l'air.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    state: meat
  - type: Tag
    tags:
    - Meat
    - Donut
# Tastes like meat.

- type: entity
  name: beignet rose
  parent: FoodDonutBase
  id: FoodDonutPink
  description: Va très bien avec un latte au soja.
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: pink
  - type: Item
    heldPrefix: pink

- type: entity
  name: beignet de l'astronaute
  parent: FoodDonutBase
  id: FoodDonutSpaceman
  description: Va très bien avec un bécher froid de malk.
  components:
  - type: Sprite
    state: purple
# Tastes like donut, violets.

- type: entity
  name: beignet à la pomme
  parent: FoodDonutBase
  id: FoodDonutApple
  description: Va très bien avec un shot de schnaps à la cannelle.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - apple
  - type: Sprite
    state: green
# Tastes like donut, green apples.

- type: entity
  name: beignet au caramel
  parent: FoodDonutBase
  id: FoodDonutCaramel
  description: Va très bien avec une tasse de chocolat chaud.
  components:
  - type: Sprite
    state: beige
# Tastes like donut, buttery sweetness.

- type: entity
  name: beignet au chocolat
  parent: FoodDonutBase
  id: FoodDonutChocolate
  description: Va très bien avec un verre de lait chaud.
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    state: choc
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Theobromine
          Quantity: 1
# Tastes like donut, bitterness.

- type: entity
  name: beignet à la citrouille bleue
  parent: FoodDonutBase
  id: FoodDonutBluePumpkin
  description: Va très bien avec une tasse de citrouille bleue apaisante et alcoolisée.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - bluepumpkin
  - type: Sprite
    state: blue
# Tastes like donut, blue pumpkin.

- type: entity
  name: beignet bungo
  parent: FoodDonutBase
  id: FoodDonutBungo
  description: Va très bien avec un pot de délice hippie.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - bungo
  - type: Sprite
    state: yellow
# Tastes like donut, tropical sweetness.

- type: entity
  name: beignet matcha
  parent: FoodDonutBase
  id: FoodDonut
  description: La L-théanine dans ce beignet est relaxante, mais pas euphorique. Va très bien avec une tasse de thé.
  components:
  - type: FlavorProfile
    flavors:
      - tea
  - type: Sprite
    state: olive
# Tastes like donut, matcha.

- type: entity
  name: beignet pois doux
  parent: FoodDonutBase
  id: FoodDonutSweetpea
  description: Va très bien avec une bouteille de Bastion Burbon !
  components:
  - type: Sprite
    state: laugh
# Tastes like donut, fizzy tutti frutti.

