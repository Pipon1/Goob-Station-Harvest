# Waffles/Pancakes

# Once StackVisuals is updated you should be able to mix/match stacks of pancakes.

- type: entity
  name: pancake
  parent: FoodBakedBase
  id: FoodBakedPancake
  description: Un pancake moelleux. Le parent, supérieur, plus doux, de la gaufre.
  components:
  - type: Stack
    stackType: Pancake
    count: 1
    composite: true
    layerStates:
    - pancakes1
    - pancakes2
    - pancakes3
    - pancakes4
    - pancakes5
    - pancakes6
    - pancakes7
    - pancakes8
    - pancakes9
  - type: Sprite
    state: pancakes1
    layers:
    - state: pancakes1
      map: ["pancakes1"]
      visible: false
    - state: pancakes2
      map: ["pancakes2"]
      visible: false
    - state: pancakes3
      map: ["pancakes3"]
      visible: false
    - state: pancakes4
      map: ["pancakes4"]
      visible: false
    - state: pancakes5
      map: ["pancakes5"]
      visible: false
    - state: pancakes6
      map: ["pancakes6"]
      visible: false
    - state: pancakes7
      map: ["pancakes7"]
      visible: false
    - state: pancakes8
      map: ["pancakes8"]
      visible: false
    - state: pancakes9
      map: ["pancakes9"]
      visible: false
  - type: Appearance
  - type: Tag
