        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: TableSalt
          Quantity: 1
        - ReagentId: Blackpepper
          Quantity: 1
  - type: Clothing
    slots: [ BELT ]
    equippedPrefix: baguette
    quickEquip: false
  - type: Item
    shape:
    - 0,0,0,2 # Goobedit
    storedRotation: -45
    inhandVisuals:
      left:
      - state: baguette-inhand-left
      right:
      - state: baguette-inhand-right
  - type: MeleeWeapon
    wideAnimationRotation: -120
    damage:
      types:
        Blunt: 1 # bonk
  - type: Tag #Goobstation
    tags:
    - BreadEmergency
  - type: GibThisGuy  #Goobstation
    requireBoth: true
    icNames:
      - Haleigh Pryocraft
    ocNames:
      - limer__treats

