    flavors:
      - banana
  - type: Edible
    trash:
    - TrashBananaPeel
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: TrashBananaPeel
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 2
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: banana
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceBanana
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    - Banana
  - type: FoodSequenceElement
    entries:
      Burger: Banana
      Taco: Banana
  #Goobstation Start
  - type: Healing
    damageContainers:
      - ClowncarDamageContainer
    damage:
      groups:
        Brute: -150
      types:
        Heat: -10
        Shock: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  #Goobstation End

