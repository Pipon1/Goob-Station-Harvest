- type: entity
  name: injecteur holoparasite
  id: HoloparasiteInjector
  parent: [BaseItem, BaseSyndicateContraband]
  description: Une œuvre d'art complexe de machinerie portable permettant à l'utilisateur d'accueillir un gardien holoparasite.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: combat_hypo
  - type: GuardianCreator
    guardianProto: MobHoloparasiteGuardian

- type: entity
  name: injecteur holoclown
  parent: HoloparasiteInjector
  id: HoloClownInjector
  description: Une œuvre d'art complexe de machinerie portable permettant à l'utilisateur d'accueillir un gardien holoclown.
  components:
  - type: GuardianCreator
    guardianProto: MobHoloClownGuardian

- type: entity
  name: lampe magique
  id: MagicalLamp
  parent: [ArabianLamp, BaseMagicalContraband] # Goob edit
  description: La fédération des sorciers a dû couper dans le budget après le scandale de la marchandise des djinns.
  components:
  - type: GuardianCreator
    guardianProto: MobIfritGuardian
  - type: AccessReader # Goobstation
    access: [ [ "Wizard" ] ]

- type: entity
  name: boîte à holoparasite
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxHoloparasite
  description: Une boîte contenant un injecteur holoparasite.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: HoloparasiteInjector
        - id: HoloparasiteInfo
        - id: ClothingHeadHatBizarreSoft
  - type: Sprite
    layers:
      - state: box
      - state: holo

- type: entity
  name: boîte à holoclown
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxHoloclown
  description: Une boîte contenant un injecteur holoclown.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: HoloClownInjector
        - id: ToyFigurineHoloClown
        - id: ToyHammer
  - type: Sprite
    layers:
      - state: box_hug
      - state: holo
  - type: Tag
    tags:
    - BoxCardboard
    - BoxHug
