- type: entity
  parent: [BaseItem, BaseSyndicateContraband ]
  id: NukeOpsDeclarationOfWar
  name: déclarateur de guerre
  description: Utilisez pour envoyer une déclaration de guerre à la cible, retardant le départ de votre navette pendant qu'ils se préparent à votre assaut. Un geste aussi audacieux attirera l'attention de puissants mécènes au sein du Syndicat, qui fourniront à votre équipe une énorme quantité de télécristaux bonus. Doit être utilisé au début de la mission, ou vos mécènes perdront intérêt.
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: Item
    - type: UseDelay
      delay: 0.5
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      requireActiveHand: false
      key: enum.WarDeclaratorUiKey.Key
    - type: UserInterface
      interfaces:
        enum.WarDeclaratorUiKey.Key:
          type: WarDeclaratorBoundUserInterface
    - type: WarDeclarator
      message: war-declarator-default-message
      sound: # Goobstation
        collection: war
    - type: AccessReader
      access: [["NuclearOperative"]]

