- type: entity
  id: MachineParticleAcceleratorEndCapCircuitboard
  parent: BaseMachineCircuitboard
  name: circuit de capot terminal PA
  description: Un circuit imprimé pour le capot terminal d'un accélérateur de particules.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: ParticleAcceleratorEndCapUnfinished
      stackRequirements:
        Glass: 15
        Steel: 15

- type: entity
  id: MachineParticleAcceleratorFuelChamberCircuitboard
  parent: BaseMachineCircuitboard
  name: circuit de chambre de carburant PA
  description: Un circuit imprimé pour la chambre de carburant d'un accélérateur de particules.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: ParticleAcceleratorFuelChamberUnfinished
      componentRequirements:
        AmeFuelContainer:
          amount: 1
          defaultPrototype: AmeJar
      stackRequirements:
        Glass: 10
        Steel: 10

- type: entity
  id: MachineParticleAcceleratorPowerBoxCircuitboard
  parent: BaseMachineCircuitboard
  name: circuit de boîte d'alimentation PA
  description: Un circuit imprimé pour la boîte d'alimentation d'un accélérateur de particules.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: ParticleAcceleratorPowerBoxUnfinished
      stackRequirements:
        Glass: 5
        Steel: 5

