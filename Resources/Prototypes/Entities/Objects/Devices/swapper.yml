- type: entity
  parent: BaseItem
  id: DeviceQuantumSpinInverter
  name: inverseur de spin quantique
  description: Un dispositif expérimental capable d'échanger les emplacements de deux entités en changeant les valeurs de spin de leurs particules. Doit être lié à un autre dispositif pour fonctionner.
  components:
  - type: Sprite
    sprite: Objects/Devices/swapper.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: Appearance
  - type: ArrivalsBlacklist
  - type: SwapTeleporter
    teleporterWhitelist:
      tags:
      - QuantumSpinInverter
  - type: GenericVisualizer
    visuals:
      enum.SwapTeleporterVisuals.Linked:
        base:
          True: { state: linked }
          False: { state: icon }
  - type: Tag
    tags:
    - QuantumSpinInverter
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 175
      Glass: 25
      Uranium: 25