- type: entity
  parent: BaseItem
  id: voicesensor
  name: capteur de voix
  description: Ce microphone, inventé par Michel Phone pendant son travail à Michelsoft, envoie des signaux quand une phrase de code préenregistrée est prononcée !
  components:
  - type: Sprite
    sprite: Objects/Devices/voicesensor.rsi
    state: icon
  - type: StaticPrice
    price: 40
  - type: DeviceLinkSource
    ports:
      - Trigger
  - type: SignalOnTrigger
    port: Trigger
  - type: TriggerOnVoice
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
  - type: EmitSoundOnTrigger
    sound:
      collection: TriggerActivate
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15
