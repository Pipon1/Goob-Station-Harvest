# APC
- type: entity
  id: APCElectronics
  parent: BaseElectronics
  name: circuit d'APC
  description: Circuit utilisé dans la construction d'APC.
  components:
    - type: ApcElectronics
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: charger_APC
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Glass: 62
      chemicalComposition:
        Silicon: 5
    - type: StaticPrice
      price: 34

