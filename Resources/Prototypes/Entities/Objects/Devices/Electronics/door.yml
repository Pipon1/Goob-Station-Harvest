- type: entity
  id: DoorElectronics
  parent: BaseElectronics
  name: circuit de porte
  description: Un circuit imprimé utilisé dans les portes et les sas.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: door_electronics
    - type: Tag
      tags:
        - DroneUsable # Goobstation
        - DoorElectronics
    - type: DoorElectronics
    - type: AccessReader
    - type: ActivatableUI
      key: enum.DoorElectronicsConfigurationUiKey.Key
      requiredItems:
        tags:
        - DoorElectronicsConfigurator
    - type: UserInterface
      interfaces:
        enum.DoorElectronicsConfigurationUiKey.Key:
          type: DoorElectronicsBoundUserInterface