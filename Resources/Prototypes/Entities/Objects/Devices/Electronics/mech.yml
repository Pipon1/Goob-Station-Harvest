# Ripley

- type: entity
  id: RipleyCentralElectronics
  parent: BaseElectronics
  name: module de contrôle central Ripley
  description: Le centre de contrôle électrique du mech Ripley.
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: mainboard
    - type: Tag
      tags:
      - RipleyCentralControlModule
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: RipleyPeripheralsElectronics
  parent: BaseElectronics
  name: module de contrôle des périphériques Ripley
  description: Le contrôle électrique des périphériques du mech Ripley.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: id_mod
    - type: Tag
      tags:
      - RipleyPeripheralsControlModule
    - type: GuideHelp
      guides:
      - Robotics

