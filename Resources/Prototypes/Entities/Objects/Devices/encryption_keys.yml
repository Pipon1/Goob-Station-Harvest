- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: clé de cryptage
  description: Une petite puce de chiffrage pour casques.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: clé de cryptage commune
  description: Une clé de cryptage utilisée par n'importe qui.
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label
  - type: Tag
    tags:
    - EncryptionCommon

