- type: entity
  id: HandTeleporter
  parent: [BaseItem, BaseGrandTheftContraband]
  name: téléporteur à main
  description: "Article signature de Nanotrasen--la meilleure des technologie bluespace. Instructions: Utilisez une fois pour créer un portail qui téléporte au hasard. Utilisez à nouveau pour le relier à un portail à votre emplacement actuel. Utilisez à nouveau pour effacer tous les portails."
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
  - type: HandTeleporter
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: HandTeleporter

- type: entity
  id: HandTeleporterAdmeme
  suffix: Admeme
  parent: BaseItem
  name: téléporteur interdimensionnel
  description: Vous permet d'ouvrir des portes de portail stables qui ne sont pas limitées par la distance.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
      color: green
  - type: HandTeleporter
    allowPortalsOnDifferentGrids: true
    allowPortalsOnDifferentMaps: true
    firstPortalPrototype: PortalGatewayBlue
    secondPortalPrototype: PortalGatewayOrange