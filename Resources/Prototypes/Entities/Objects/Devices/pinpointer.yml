- type: entity
  name: localisateur
  description: Un dispositif de suivi portable. Bien qu'il soit généralement bien plus capable, celui-ci a été configuré pour verrouiller certains signaux. Gardez-le droit pour préserver la précision.
  parent: BaseItem
  id: PinpointerBase
  abstract: true
  components:
  - type: Transform
    noRot: True
  - type: Sprite
    noRot: True
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Objects/Devices/pinpointer.rsi
    state: pinpointer
  - type: Item
    sprite: Objects/Devices/pinpointer.rsi
  - type: Pinpointer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PinpointerVisuals.IsActive:
        enum.PinpointerLayers.Screen:
          True: { visible: True }
          False: { visible: False }
      enum.PinpointerVisuals.TargetDistance:
        enum.PinpointerLayers.Screen:
          Unknown: { state: pinonnull }
          Reached: { state: pinondirect }
          Close: { state: pinonclose }
          Medium: { state: pinonmedium }
          Far: { state: pinonfar }
  - type: AnimationPlayer

- type: entity
  name: localisateur
  id: PinpointerNuclear
  parent: [ PinpointerBase, BaseCommandContraband ]
  components:
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - NukeDisk
    targetName: nuclear authentication disk

- type: entity
  name: localisateur du syndicat
  description: Produit spécifiquement pour les missions nucléaires, obtenez ce disque !
  id: PinpointerSyndicateNuclear
  parent: [ PinpointerBase, BaseSyndicateContraband ]
  components:
  - type: Sprite
    layers:
    - state: pinpointer-syndicate
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-syndicate
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - NukeDisk
    targetName: nuclear authentication disk

- type: entity
  name: localisateur universel
  description: Un dispositif de suivi portable qui verrouille n'importe quelle entité physique lorsqu'il est éteint. Gardez-le droit pour préserver la précision.
  id: PinpointerUniversal
  parent: PinpointerBase
  components:
  - type: Sprite
    layers:
    - state: pinpointer-universal
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-universal
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true

- type: entity
  parent: PinpointerBase
  name: localisateur de serveur de recherche  # Goob edit
  description: Un dispositif de suivi portable qui indique la direction du serveur de recherche le plus proche.
  id: PinpointerStation
  #suffix: Station # Goob edit
  components:
  - type: Sprite
    layers:
    - state: pinpointer-station
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-station
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - ResearchServer
    targetName: research servers # Goob edit

- type: entity
  parent: [ PinpointerBase, BaseXenoborgContraband ]
  id: PinpointerMothership
  name: localisateur de noyau xénoborg
  description: Un dispositif de suivi portable qui indique la direction du noyau du vaisseau mère xénoborg.
  components:
  - type: Sprite
    layers:
    - state: pinpointer-xenoborg
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-xenoborg
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - MothershipCore
    targetName: the Mothership # Goob edit

- type: entity
  parent: BaseItem
  id: PinpointerMothershipPiece
  name: morceau de localisateur de noyau xénoborg
  description: Un morceau de localisateur de noyau du vaisseau mère xénoborg. Vous avez besoin de quatre morceaux pour le réparer.
  components:
  - type: Sprite
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer-xenoborg-piece-1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        pinpointer-xenoborg-piece-1: ""
        pinpointer-xenoborg-piece-2: ""
        pinpointer-xenoborg-piece-3: ""
        pinpointer-xenoborg-piece-4: ""
  - type: Item
  - type: Tag
    tags:
    - MothershipPinpointerPiece
  - type: Construction
    graph: RepairMothershipPinpointer
    node: start

- type: entity
  parent: PinpointerMothership
  id: PinpointerMothershipRepaired
  name: localisateur de noyau xénoborg réparé
  description: Un dispositif de suivi portable qui indique la direction du noyau du vaisseau mère xénoborg. Celui-ci a vu de meilleurs jours.
  components:
  - type: Sprite
    layers:
    - state: pinpointer-xenoborg-repaired
      map: ["enum.PinpointerLayers.Base"]
  - type: Icon
    state: pinpointer-xenoborg-repaired
  - type: Construction
    graph: RepairMothershipPinpointer
    node: repairedPinpointer
