- type: entity
  id: DeviceDesynchronizer
  parent: BaseItem
  name: désynchroniseur
  description: Un dispositif expérimental capable de désynchroniser temporairement l'utilisateur de l'espace-temps, le rendant effectivement invisible tant qu'il est actif.
  components:
  - type: Sprite
    sprite: Objects/Devices/desynchronizer.rsi
    state: icon
  - type: TriggerOnUse
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: VoidPocket
  - type: UseDelay
    delay: 220 # long delay to ensure it can't be spammed, use it wisely
