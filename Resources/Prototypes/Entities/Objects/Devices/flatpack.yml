- type: entity
  parent: BaseItem
  id: BaseFlatpack
  name: flatpack de base
  description: Un flatpack utilisé pour construire quelque chose.
  categories:
  - HideSpawnMenu
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Devices/flatpack.rsi
    layers:
    - state: base
    - state: overlay
      color: "#cec8ac"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: Appearance
  - type: Flatpack
    boardColors:
      command: "#334E6D"
      medical: "#52B4E9"
      service: "#9FED58"
      engineering: "#EFB341"
      security: "#DE3A3A"
      science: "#D381C9"
      supply: "#A46106"
      cpu_command: "#334E6D"
      cpu_medical: "#52B4E9"
      cpu_service: "#9FED58"
      cpu_engineering: "#EFB341"
      cpu_security: "#DE3A3A"
      cpu_science: "#D381C9"
      cpu_supply: "#A46106"
  - type: StaticPrice
    price: 250
  - type: Tag
    tags:
    - DroneUsable # Goobstation

- type: entity
  parent: BaseFlatpack
  id: SolarAssemblyFlatpack
  name: flatpack assemblage solaire
  description: Un flatpack utilisé pour construire un assemblage solaire.
  components:
  - type: Flatpack
    entity: SolarAssembly
  - type: Sprite
    layers:
    - state: solar-assembly-part
  - type: StaticPrice
    price: 75
  - type: Tag # Goobstation - stupid chuds didnt add the tag
    tags:
    - DroneUsable
    - SolarAssemblyFlatpack

