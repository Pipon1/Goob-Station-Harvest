- type: entity
  parent: BaseHandheldInstrument
  id: BasePercussionInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - PercussionInstrument

- type: entity
  parent: BasePercussionInstrument
  id: GlockenspielInstrument
  name: glockenspiel
  components:
  - type: Instrument
    program: 9
  - type: Sprite
    sprite: Objects/Fun/Instruments/glockenspiel.rsi

- type: entity
  parent: BasePercussionInstrument
  id: MusicBoxInstrument
  name: boîte à musique
  description: Jouer avec ça te fait sentir en sécurité loin des animatroniques effrayants.
  components:
  - type: Instrument
    program: 10
  - type: Sprite
    sprite: Objects/Fun/Instruments/musicbox.rsi
  - type: Item
    size: Small

- type: entity
  parent: BasePercussionInstrument
  id: XylophoneInstrument
  name: xylophone
  description: Glockenspiel aux couleurs de l'arc-en-ciel.
  components:
  - type: Instrument
    program: 13
  - type: Sprite
    sprite: Objects/Fun/Instruments/structureinstruments.rsi
    state: xylophone

- type: entity
  parent: BaseHandheldInstrument
  id: MicrophoneInstrument
  name: microphone
  description: Parfait pour chanter à pleins poumons.
  components:
  - type: Instrument
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Aah": {52: 0}
      "Ooh": {53: 0}
      "Kweh": {4: 100} # Defined in space-station-14.sf2
      "Waa": {5: 100} # Defined in space-station-14.sf2
      "Wah": {6: 100} # Defined in space-station-14.sf2
  - type: Sprite
    sprite: Objects/Fun/Instruments/microphone.rsi
  - type: Item
    size: Small
    storedRotation: -45

- type: entity
  parent: BasePercussionInstrument
  id: WoodblockInstrument
  name: woodblock
  description: Si tu écoutes ça assez souvent, ça va finir par te trotter dans la tête.
  components:
  - type: Instrument
    program: 115
  - type: Sprite
    sprite: Objects/Fun/Instruments/woodblock.rsi

- type: entity
  parent: BasePercussionInstrument
  id: ReverseCymbalsInstrument
  name: cymbales inversées
  description: Je pense que tu l'as placé à l'envers ?
  components:
  - type: Instrument
    program: 119
  - type: Sprite
    sprite: Objects/Fun/Instruments/reversecymbal.rsi
