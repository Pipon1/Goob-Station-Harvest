  - type: Prayable
    sentMessage: prayer-popup-notify-syndicate-sent
    notificationPrefix: prayer-chat-notify-syndicate
    notificationSound: # Goobstation - Admin Notifications
      path: /Audio/_Goobstation/Misc/phone_ring.ogg

