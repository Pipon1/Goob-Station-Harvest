- type: entity
  parent: BaseHandheldInstrument
  id: MusicalLungInstrument
  name: poumon musical
  description: Le poumon spirituel et magique d'une ancienne chanteuse d'opéra. Bien que, pour être honnête, ce soient les cordes vocales qui font la performance.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: lung-l
  - type: Instrument
    program: 121
  - type: Item
    size: Small

- type: entity
  parent: BaseHandheldInstrument
  id: SeashellInstrument
  name: coquillage
  description: Pour poser le rythme du rivage.
  components:
  - type: Sprite
    sprite: Objects/Fun/Instruments/otherinstruments.rsi
    state: seashell
  - type: Instrument
    program: 122
  - type: Item
    size: Small

- type: entity
  parent: BaseHandheldInstrument
  id: BirdToyInstrument
  name: sifflet d'oiseau
  description: Un joli petit sifflet en forme d'oiseau. Il chante magnifiquement.
  components:
  - type: Sprite
    sprite: Objects/Fun/Instruments/otherinstruments.rsi
    state: birdtoy
  - type: Instrument
    program: 123
  - type: Item
    size: Small
    storedRotation: 90

- type: entity
  parent: BaseHandheldInstrument
  id: PhoneInstrument
  name: téléphone rouge
  description: Au cas où quelque chose tournerait mal...
  components:
  - type: Sprite
    sprite: Objects/Fun/Instruments/otherinstruments.rsi
    state: red_phone
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/phone_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/phone_drop.ogg
      params:
        volume: -2
  # Goobstation edit end
  - type: EmitSoundOnLand
    sound:
       path: /Audio/Items/ring.ogg
  - type: Instrument
    program: 124
  - type: Item
    size: Small
    storedRotation: -90
  - type: Prayable
    sentMessage: prayer-popup-notify-centcom-sent
    notificationPrefix: prayer-chat-notify-centcom
    verb: prayer-verbs-call
    verbImage: null
    notificationSound: # Goobstation - Admin Notifications
      path: /Audio/_Goobstation/Misc/phone_ring.ogg

- type: entity
  parent: PhoneInstrument
  id: PhoneInstrumentSyndicate
  name: téléphone rouge sang
  description: Pour que les personnes méchantes puissent appeler leurs amis.
  components:
  - type: Sprite
