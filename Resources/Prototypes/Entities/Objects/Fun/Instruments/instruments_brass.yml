    program: 56
  - type: SwappableInstrument
    instrumentList:
      "Standard": {56: 0}
      "Muted": {59: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/trumpet.rsi

- type: entity
  parent: BaseBrassInstrument
  id: TromboneInstrument
  name: trombone
  description: L'instrument de cuivre à coulisse préféré de tous.
  components:
  - type: Instrument
    program: 57
  - type: Sprite
    sprite: Objects/Fun/Instruments/trombone.rsi

- type: entity
