# When adding a new battlemap, also add it to id: AllBattlemapsTable

# Board item (given to players)
- type: entity
  abstract: true
  parent: BaseBoardEntity
  id: BaseBattlemap
  name: battlemap
  description: Une battlemap pour commencer votre exploration de donjon épique, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    state: icon
  - type: TabletopGame
    boardName: tabletop-battlemap-board-name

- type: entity
  parent: BaseBattlemap
  id: GrassBattlemap
  name: battlemap herbe
  description: Une battlemap herbe pour commencer votre exploration de donjon épique, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/grassbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &GrassBoard GrassBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: MoonBattlemap
  name: battlemap lune
  description: Une battlemap lune pour commencer votre exploration de lune épique, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/moonbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &MoonBoard MoonBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: SandBattlemap
  name: battlemap sable
  description: Une battlemap sable pour commencer vos épisodes de plage épiques, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/sandbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &SandBoard SandBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: SnowBattlemap
  name: battlemap neige
  description: Une battlemap neige pour commencer votre exploration frigorifique, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/snowbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &SnowBoard SnowBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: ShipBattlemap
  name: battlemap navire
  description: Une battlemap navire pour commencer votre exploration de l'espace épique, les pièces ne sont pas incluses.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/shipbm.rsi
  - type: TabletopGame
    size: 543, 543
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &ShipBoard ShipBoardTabletop

# Background entity (actually shown in the board)
- type: entity
  parent: BaseBoardTabletop
  id: *GrassBoard
  name: battlemap herbe
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/grassbm_tabletop.rsi
    state: tabletop

- type: entity
  parent: BaseBoardTabletop
  id: *MoonBoard
  name: battlemap herbe
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/moonbm_tabletop.rsi
    state: tabletop

- type: entity
  parent: BaseBoardTabletop
  id: *SandBoard
  name: battlemap sable
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/sandbm_tabletop.rsi
    state: tabletop

- type: entity
  parent: BaseBoardTabletop
  id: *SnowBoard
  name: battlemap neige
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/snowbm_tabletop.rsi
    state: tabletop

- type: entity
  parent: BaseBoardTabletop
  id: *ShipBoard
  name: battlemap navire
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/shipbm_tabletop.rsi
    state: tabletop
