# Parchís board item (normal in game item you can hold in your hand)
- type: entity
  parent: BaseBoardEntity
  id: ParchisBoard
  name: plateau de parchís
  description: Jeu de plateau en croix et en cercle célèbre pour détruire d'innombrables amitiés.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/parchis.rsi
    state: board
  - type: TabletopGame
    boardName: tabletop-parchis-board-name
    size: 574, 574
    setup:
      !type:TabletopParchisSetup
      boardPrototype: &ParchisBoard ParchisBoardTabletop

- type: entity
  parent: BaseBoardTabletop
  id: *ParchisBoard
  name: parchís
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/parchis_tabletop.rsi
    state: board
