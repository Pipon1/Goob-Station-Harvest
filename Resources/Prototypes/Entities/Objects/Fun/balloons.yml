# When adding new balloons, also add it to id: AllMiscToysTable

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBalloon
  components:
  - type: Sprite
    noRot: true
  - type: Item
    size: Small
  - type: EmitSoundOnCollide
    sound: &SoundBalloonHit
      path: /Audio/Effects/balloon_hits.ogg
  - type: EmitSoundOnLand
    sound: *SoundBalloonHit
  - type: Damageable
    damageContainer: Inorganic
  - type: TileFrictionModifier
    modifier: 0.3
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseBalloon
  id: BalloonSyn
  name: ballon syndie
  description: Distribué aux âmes les plus courageuses ayant survécu à l'attraction "atomic twister" de Syndieland.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/syndicate.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/syndicate.rsi
  - type: StaticPrice
    price: 100 # Entertainment.

- type: entity
  parent: BaseBalloon
  id: BalloonNT
  name: ballon nanotrasen
  description: Conçu spécialement pour infliger un maximum de dégâts psychologiques aux opérateurs du Syndicat.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/nanotrasen.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/nanotrasen.rsi

- type: entity
  parent: BaseBalloon
  id: BalloonCorgi
  name: ballon corgi
  description: Tout comme posséder un vrai chien - mais beaucoup plus flottant.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/corgi.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/corgi.rsi
