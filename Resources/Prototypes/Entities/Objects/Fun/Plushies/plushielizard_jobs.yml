# This base is created so we don't have to define the different sprite path for each plushie job.
- type: entity
  abstract: true
  parent: PlushieLizard
  id: BasePlushieLizardJob
  components:
  - type: Sprite
    sprite: Objects/Fun/plushielizard_jobs.rsi

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobAtmospherictechnician
  name: peluche lézard technicien en atmosphérique
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que technicien en atmosphérique. Il sent légèrement le frezon.
  components:
  - type: Sprite
    state: atmospherictechnician

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBartender
  name: peluche lézard barman
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que barman. Sa langue a des taches d'alcool.
  components:
  - type: Sprite
    state: bartender

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBotanist
  name: peluche lézard botaniste
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que botaniste. Il y a des épines sur ses pieds et il sent légèrement l'engrais pour plantes.
  components:
  - type: Sprite
    state: botanist

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBoxer
  name: peluche lézard boxeur
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que boxeur. Les fils de ses gants commencent à se détacher.
  components:
  - type: Sprite
    state: boxer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobCaptain
  name: peluche lézard capitaine
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que capitaine. Il y a des morceaux de tarte sur son visage.
  components:
  - type: Sprite
    state: captain

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobCargotechnician
  name: peluche lézard technicien cargo
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que technicien cargo. Des miettes de chips de calage sont collées à ses écailles.
  components:
  - type: Sprite
    state: cargotechnician

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobChaplain
  name: peluche lézard chapelain
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chapelain. Il sent légèrement l'encens.
  components:
  - type: Sprite
    state: chaplain

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobChef
  name: peluche lézard chef
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chef. Il sent légèrement les épices, avec des taches d'huile sur son tablier.
  components:
  - type: Sprite
    state: chef

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobChemist
  name: peluche lézard chimiste
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chimiste. Des parties de la peluche sont tachées de produits chimiques.
  components:
  - type: Sprite
    state: chemist

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobChiefengineer
  name: peluche lézard chef ingénieur
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chef ingénieur. Il est couvert de copeaux de métal et de projections de soudure.
  components:
  - type: Sprite
    state: chiefengineer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobChiefmedicalofficer
  name: peluche lézard médecin-chef
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chef médical. La queue de la peluche a été cousue et décousue à nouveau, probablement à cause de l'entraînement à la chirurgie.
  components:
  - type: Sprite
    state: chiefmedicalofficer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobClown
  name: peluche lézard clown
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que clown. Son nez fait un bruit de couinement quand tu l'appuies.
  components:
  - type: Sprite
    state: clown
  - type: EmitSoundOnUse
    sound:
      collection: BikeHorn
  - type: EmitSoundOnActivate
    sound:
      collection: BikeHorn
  - type: EmitSoundOnTrigger
    sound:
      collection: BikeHorn

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobDetective
  name: peluche lézard détective
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que détective. Il semble prêt pour un mystère.
  components:
  - type: Sprite
    state: detective

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobHeadofpersonnel
  name: peluche lézard chef du personnel
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chef du personnel. Bien qu'il semble ravi extérieurement, il est probablement aussi ennuyé que toi.
  components:
  - type: Sprite
    state: headofpersonnel

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobHeadofsecurity
  name: peluche lézard chef de la sécurité
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que chef de la sécurité. Il semble avoir été déchiré et recousu plusieurs fois.
  components:
  - type: Sprite
    state: headofsecurity

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobJanitor
  name: peluche lézard concierge
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que concierge. Il sent légèrement les produits de nettoyage.
  components:
  - type: Sprite
    state: janitor

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobLawyer
  name: peluche lézard avocat
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'avocat. Son insigne d'avocat tient à peine après des heures de manipulation nerveuse.
  components:
  - type: Sprite
    state: lawyer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobLibrarian
  name: peluche lézard bibliothécaire
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que bibliothécaire. La couleur de la peluche a pâli après des années de surveillance de bureau.
  components:
  - type: Sprite
    state: librarian

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobMedicaldoctor
  name: peluche lézard médecin
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que médecin. Il semble bien lavé.
  components:
  - type: Sprite
    state: medicaldoctor

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobMedicalintern
  name: peluche lézard interne en médecine
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'interne en médecine. Il sent légèrement l'antiseptique.
  components:
  - type: Sprite
    state: medicalintern

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobMime
  name: peluche lézard mime
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que mime. Il te fixe silencieusement, ses motives sont inconnus.
  components:
  - type: Sprite
    state: mime
  - type: EmitSoundOnUse
    sound: null # mime is silent...
  - type: EmitSoundOnLand
    sound: null
  - type: EmitSoundOnActivate
    sound: null
  - type: EmitSoundOnTrigger
    sound: null
  - type: EmitSoundOnCollide
    sound: null
  - type: Edible
    useSound: null
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit: null

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobMusician
  name: peluche lézard musicien
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que musicien. Il sent légèrement la transpiration et a quelques cordes qui se détachent.
  components:
  - type: Sprite
    state: musician

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobParamedic
  name: peluche lézard urgentiste
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'urgentiste. La peluche a quelques petits pansements cousus dessus.
  components:
  - type: Sprite
    state: paramedic

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobPassenger
  name: peluche lézard passager
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que passager. Ses yeux te regardent, un peu plus brillants que d'habitude.
  components:
  - type: Sprite
    state: passenger

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobPsychologist
  name: peluche lézard psychologue
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que psychologue. Il semble aimer t'écouter silencieusement.
  components:
  - type: Sprite
    state: psychologist

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobQuartermaster
  name: peluche lézard quartier-maître
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que quartier-maître. Il est couvert de résidu collant laissé par des milliers de factures d'expédition.
  components:
  - type: Sprite
    state: quartermaster

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobReporter
  name: peluche lézard journaliste
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que journaliste. Il sent légèrement l'encre.
  components:
  - type: Sprite
    state: reporter

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobResearchassistant
  name: peluche lézard assistant de recherche
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'assistant de recherche. Il sent légèrement le papier brûlé.
  components:
  - type: Sprite
    state: researchassistant

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobResearchdirector
  name: peluche lézard directeur de recherche
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que directeur de recherche. Il y a quelques marques de brûlure sur la peluche.
  components:
  - type: Sprite
    state: researchdirector

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobSalvagespecialist
