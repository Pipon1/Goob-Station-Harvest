  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que spécialiste de la récupération. Il semble avoir connu le froid de l'espace pendant un certain temps.
  components:
  - type: Sprite
    state: salvager

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobScientist
  name: peluche lézard scientifique
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que scientifique. Il y a quelques marques de morsure sur la peluche, probablement provenant d'un singe curieux.
  components:
  - type: Sprite
    state: scientist

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobSecuritycadet
  name: peluche lézard cadet de sécurité
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que cadet de sécurité. Il semble avoir des marques de choc partout sur la peluche.
  components:
  - type: Sprite
    state: securitycadet

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobSecurityofficer
  name: peluche lézard officier de sécurité
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'officier de sécurité. Le rembourrage a été tassé à cause de nombreux coups de poing.
  components:
  - type: Sprite
    state: securityofficer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobServiceworker
  name: peluche lézard travailleur de service
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que travailleur de service. Il sent comme un mélange de produits de nettoyage et de nourriture.
  components:
  - type: Sprite
    state: serviceworker

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobStationengineer
  name: peluche lézard ingénieur
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'ingénieur. Il a des taches d'huile sur ses mains.
  components:
  - type: Sprite
    state: stationengineer

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobTechnicalassistant
  name: peluche lézard assistant technique
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant qu'assistant technique. Il sent légèrement les fils brûlés.
  components:
  - type: Sprite
    state: technicalassistant

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobWarden
  name: peluche lézard gardien
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que gardien. Il sent comme de la poudre noire et de l'huile de pistolet.
  components:
  - type: Sprite
    state: warden

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobZookeeper
  name: peluche lézard gardien de zoo
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard en tant que gardien de zoo. Il a quelques poils de gorille collés dessus.
  components:
  - type: Sprite
    state: zookeeper

- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobMultiweh
  name: peluche lézard multiweh
  description: Un adorable jouet en peluche qui ressemble à un homme-lézard pour tous les postes ! C'est une peluche aux nombreux talents. Tu peux entendre un HoP pleurer au loin.
  components:
  - type: Sprite
    state: multiweh
