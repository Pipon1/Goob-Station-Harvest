#Nonhuman Figurines

- type: entity
  parent: BaseFigurine
  id: ToyNuke
  name: jouet nucléaire
  description: Un modèle en plastique d'une explosion de fission nucléaire. Aucune matière d'uranium incluse... probablement.
  components:
  - type: Sprite
    sprite: Objects/Fun/toy_nuke.rsi
    state: icon
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/toy_nuke.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.12"
  - type: Tag
    tags:
    - Figurine
    - Payload
  - type: UseDelay
    delay: 180.0
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Machines/Nuke/nuke_alarm.ogg
      params:
        volume: -5
        maxDistance: 10

