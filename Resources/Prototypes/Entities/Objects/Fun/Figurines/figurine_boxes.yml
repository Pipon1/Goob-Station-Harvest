- type: entity
  id: MysteryFigureBoxTrash
  parent: BaseItem
  name: boîte en carton dépliée
  description: Une petite boîte en carton dépliée pour jouets.
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    state: fig_box_unfolded
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

- type: entity
  parent: BaseItem
  id: MysteryFigureBox
  name: boîte mystère de minifigurines d'astronautes
  description: Une boîte contenant une minifigurine mystère. Le côté de la boîte représente quelques figurines 'rares' noircies, dont une avec une grande silhouette non humanoïde.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
      - state: fig_box
  - type: TriggerOnActivate
  - type: DeleteOnTrigger
  - type: EmitSoundOnTrigger
    positional: true
    predicted: true
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: MysteryFigureBoxTrash
      - !type:NestedSelector
        tableId: AllFigurinesTable

- type: entity
  parent: BaseItem
  id: MysteryLighterBox
  name: boîte mystère de briquets fantaisie
  suffix: Filled
  description: Une boîte de briquets promotionnels abandonnés, dont beaucoup ont depuis été déclarés "contrebande".
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
    - state: fig_box
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: CybersunFlippo
        orGroup: Lighterbox
        weight: 0.15
      - id: InterdyneFlippo
        orGroup: Lighterbox
        weight: 0.15
      - id: NanotrasenFlippo
        orGroup: Lighterbox
        weight: 0.25
      - id: WaffleCoFlippo
        orGroup: Lighterbox
        weight: 0.35
      - id: HonkCoFlippo
        orGroup: Lighterbox
      - id: GorlexMatchbox
        orGroup: Lighterbox
        weight: 0.15
      - id: DonkcoLighter
        orGroup: Lighterbox
        weight: 0.25
      - id: SyndicateFlippo
        orGroup: Lighterbox
        weight: 0.15

- type: entity
  parent: MysteryLighterBox
  id: UplinkLighterBox
  suffix: Uplink
  components:
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: CybersunFlippo
        orGroup: Lighterbox
      - id: InterdyneFlippo
        orGroup: Lighterbox
      - id: WaffleCoFlippo
        orGroup: Lighterbox
      - id: GorlexMatchbox
        orGroup: Lighterbox
      - id: DonkcoLighter
        orGroup: Lighterbox
      - id: SyndicateFlippo
        orGroup: Lighterbox
