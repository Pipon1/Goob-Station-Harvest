- type: entity
  name: analyseur de gaz
  parent: BaseItem
  id: GasAnalyzer
  description: Un scanner environnemental portatif qui indique les niveaux de gaz actuels.
  components:
  - type: Sprite
    sprite: Objects/Specific/Atmos/gasanalyzer.rsi
    layers:
      - state: icon
        map: ["analyzer"]
  - type: GasAnalyzer
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.GasAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasAnalyzerUiKey.Key:
        type: GasAnalyzerBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
        enum.GasAnalyzerVisuals.Enabled:
          enabled:
            True: { state: working }
            False: { state: icon }
  - type: Tag
    tags:
      - DroneUsable # Goobstation
  - type: StaticPrice
    price: 80
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 200
      Glass: 75
  - type: GuideHelp
    guides:
    - AtmosTools
    - PipeNetworks
    - Pipes
    - GasCanisters