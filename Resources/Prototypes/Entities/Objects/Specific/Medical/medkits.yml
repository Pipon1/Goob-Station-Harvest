- type: entity
  name: trousse de premiers secours
  description: Une trousse médicale d'urgence pour les blessures sérieuses.
  parent: BaseStorageItem
  id: Medkit
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    state: firstaid
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1
  - type: Item
    size: Large
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: firstaid
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Plastic: 75
  - type: Tag
    tags:
    - Medkit

- type: entity
  name: trousse de traitement des brûlures
  description: "Une trousse médicale spécialisée pour quand le laboratoire de toxines prend feu spontanément."
  parent: Medkit
  id: MedkitBurn
  components:
  - type: Sprite
    state: burnkit
  - type: Item
    heldPrefix: burnkit

- type: entity
  name: trousse de traitement des toxines
  description: "Utilisée pour traiter les toxines dans le sang."
  parent: Medkit
  id: MedkitToxin
  components:
  - type: Sprite
    state: toxinkit
  - type: Item
    heldPrefix: toxinkit

- type: entity
  name: trousse de traitement du manque d'oxygène
  description: "Une boîte pleine de bonnes choses pour l'oxygène."
  parent: Medkit
  id: MedkitO2
  components:
  - type: Sprite
    state: o2kit
  - type: Item
    heldPrefix: o2kit

- type: entity
  name: trousse de traitement des traumatismes contondants
  description: "Une trousse de premiers secours pour quand vous prenez une boîte à outils dans la tête."
  parent: Medkit
  id: MedkitBrute
  components:
  - type: Sprite
    state: brutekit
  - type: Item
    heldPrefix: brutekit

- type: entity
  name: trousse de premiers secours avancée
  description: "Une trousse avancée pour traiter les blessures graves."
  parent: Medkit
  id: MedkitAdvanced
  components:
  - type: Sprite
    state: advkit
  - type: Item
    heldPrefix: advkit
  - type: Storage # Shitmed Change
    maxItemSize: Small
    grid:
    - 0,0,5,1

- type: entity
  name: trousse de traitement des radiations
  description: "Si vous aviez pris votre Rad-X, vous n'en auriez pas besoin."
  parent: Medkit
  id: MedkitRadiation
  components:
  - type: Sprite
    state: radkit
  - type: Item
    heldPrefix: radkit

- type: entity
  name: trousse médicale de combat
  description: "Pour les plus grandes armes d'entre nous."
  parent: Medkit
  id: MedkitCombat
  components:
  - type: Sprite
    state: blackkit
  - type: Item
    heldPrefix: blackkit
    size: Normal
  - type: Storage
    defaultStorageOrientation: Vertical # Goobstation
