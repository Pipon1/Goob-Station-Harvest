- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: disque de points de recherche (1000)
  description: Un disque pour le serveur R&D contenant 1000 points.
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  # Goobstation edit end
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: disque de points de recherche (5000)
  description: Un disque pour le serveur R&D contenant 5000 points.
  components:
  - type: ResearchDisk
    points: 5000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: disque de points de recherche (10000)
  description: Un disque pour le serveur R&D contenant 10000 points.
  components:
  - type: ResearchDisk
    points: 10000

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: disque de points de recherche
  suffix: DEBUG, DO NOT MAP
  categories: [ DoNotMap ]
  description: Un disque pour le serveur R&D contenant tous les points dont vous pourrez jamais avoir besoin.
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: disque technologique
  description: Un disque pour le serveur R&D contenant une technologie de recherche.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        datadisk_base: Sixteen
  - type: TechnologyDisk
  - type: StaticPrice
    price: 100
  - type: StealTarget
    stealGroup: TechnologyDisk

- type: entity
  parent: TechnologyDisk
  id: TechnologyDiskRare
  suffix: rare.
  components:
  - type: TechnologyDisk
    tierWeightPrototype: RareTechDiskTierWeights
