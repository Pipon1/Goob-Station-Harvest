#START SET SELECTION
- type: entity
  id: ChaplainUndeterminedBible
  name: balise scripturale du bluespace
  description: Même si je marche dans la vallée de l'ombre de la mort, je ne craindrai aucun mal, car vous êtes avec moi.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - ClockworkSet
    - BibleVedaSet
    - VelesBookSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: La sainte Bible
  description: Brisez tout lien, sauf ceux qui m'attachent à votre service et à votre cœur.
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  name: Le saint Coran
  description: Laquelle des grâces de votre Seigneur nieriez-vous ˹humains et djinns˺ ?
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  name: Les rouleaux du Tanakh
  description: En enseignant, on apprend.
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  name: La Dalle Mécanique
  description: Un lien entre vous et l'Épave Céleste. Elle contient des informations, récite des écritures et est votre outil le plus vital en tant que Serviteur.
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork

- type: selectableSet
  id: BibleVedaSet
  name: Slavic-Aryan Vedas
  description: Slavic neopaganisms.
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veda.rsi
    state: icon
  content:
  - BibleVeda

- type: selectableSet
  id: VelesBookSet
  name: Book of veles
  description: Basis and proof of neopagan religiosity.
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veles_book.rsi
    state: icon
  content:
  - BibleVelesBook
##END SET SELECTION

- type: entity
  name: bible
  description: Nouvelle version interstellaire 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 5 # Goobstation - bro wtf
        Blunt: 1
  #- type: Prayable - no, use the altar
  #  bibleUserOnly: true
  - type: AlternatePrayable # Goobstation
    requireBibleUser: false
  - type: Summonable
    specialItem: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Material
  #  - type: Tag
  #    tags:
  #    - Bible
  #  - type: StealTarget
  #    stealGroup: Bible
  - type: EnchantingTool # Goobstation
  - type: StatusEffectOnCollideGhost # Goobstation
    whitelist:
      tags:
      - WeakToSalt
    statusEffect: Corporeal
    duration: 5

- type: entity
  parent: [Bible]
  name: nécronomicon
  description: "Il y a une note : Klatuu, Verata, Nikto -- Ne l'oubliez plus !"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction
