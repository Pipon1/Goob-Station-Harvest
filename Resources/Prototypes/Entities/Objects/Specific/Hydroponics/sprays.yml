- type: entity
  parent: SprayBottleBase
  id: PlantBGoneSpray
  name: Plante-B-Gone
  suffix: "Rempli"
  description: Élimine ces mauvaises herbes indésirables !
  components:
  - type: Tag
    tags:
    - PlantBGone
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/sprays.rsi
    state: plantbgone
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: PlantBGone
          Quantity: 100
  - type: Item
    sprite: Objects/Tools/Hydroponics/sprays.rsi
    heldPrefix: plantbgone

- type: entity
  parent: SprayBottleBase
  id: WeedSpray
  name: spray anti-mauvaises herbes
  suffix: "Rempli"
  description: Un mélange toxique en spray pour éliminer les petites mauvaises herbes.
  components:
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/sprays.rsi
    state: weedspray
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: WeedKiller
          Quantity: 50
  - type: Tag
    tags:
    - Spray
  - type: Spray
    transferAmount: 1
  - type: Item
    sprite: Objects/Tools/Hydroponics/sprays.rsi

- type: entity
  parent: WeedSpray
  id: PestSpray
  name: spray anti-nuisibles
  suffix: "Rempli"
  description: Un spray éliminateur de nuisibles ! Ne pas inhaler !
  components:
  - type: Sprite
    state: pestspray
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: PestKiller
          Quantity: 50
  - type: Item
    sprite: Objects/Tools/Hydroponics/sprays.rsi
