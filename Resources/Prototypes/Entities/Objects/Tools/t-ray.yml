- type: entity
  name: scanner à rayons T
  parent: BaseItem
  id: trayScanner
  description: Un appareil de détection haute technologie utilisant le rayonnement térahertz pour détecter les infrastructures sous le plancher.
  components:
  - type: Sprite
    sprite: Objects/Tools/t-ray.rsi
    layers:
    - state: tray-off
      map: ["base"]
  - type: TrayScanner
  - type: Item
    sprite: Objects/Tools/t-ray.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 200
      Glass: 75
  - type: StaticPrice
    price: 85