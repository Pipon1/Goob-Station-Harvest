- type: entity
  parent: [BaseBrandedLighter]
  id: HonkCoFlippo
  name: Flippo Honk Co.
  description: "Un briquet farceur glissant produit par Honk Co., dissimulé dans une vraie peau de banane."
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/honkco.rsi
  - type: Item
    sprite: Objects/Tools/Lighters/honkco.rsi
  - type: ComponentToggler # This is super cursed and ends up deleting the fixtures when toggled off
    components:
    - type: Slippery
    - type: StepTrigger
      intersectRatio: 0.2
    - type: CollisionWake
      enabled: false
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        slips:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.3,0.4,0.3"
          layer:
          - SlipLayer
          hard: false
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.3,0.4,0.3"
          density: 10
          mask:
          - ItemMask
  - type: Welder #
    fuelConsumption: 0.1
    fuelLitCost: 1
    tankSafe: true
  - type: PointLight
    enabled: false
    netsync: false
    radius: 2
    color: yellow

- type: entity
  parent: [BaseBrandedLighter]
  id: DonkcoLighter
  name: Flippo Donk Co.
  description: "Le flippo de choix du traître chevronné. Un briquet fantaisie pané fabriqué par Donk Co. Curieusement comestible même allumé."
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/donkco.rsi
  - type: Item
    sprite: Objects/Tools/Lighters/donkco.rsi
  - type: Welder #
    fuelConsumption: 0.02
    fuelLitCost: 0.1
    tankSafe: true
  - type: Tag
    tags:
    - DonkPocket
    - Meat
    - Lighter # Goobstation
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 12
        maxVol: 12
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Omnizine
          Quantity: 10
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: ComponentToggler
    components:
    - type: Edible # This shouldn't be component toggler, but doesn't work when it's not
  - type: PointLight
    enabled: false
    netsync: false
    radius: 2
    color: orange
