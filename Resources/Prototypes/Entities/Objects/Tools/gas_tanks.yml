  name: réservoir d'azote
  description: Un réservoir de gaz cylindrique standard pour l'azote. Il peut contenir 5 L de gaz.
  components:
  - type: Sprite
    sprite: Objects/Tanks/red.rsi
  - type: Item
    sprite: Objects/Tanks/red.rsi
  - type: Clothing
    sprite: Objects/Tanks/red.rsi

- type: entity
  parent: GasTankRoundBase
  id: EmergencyOxygenTank
  name: réservoir d'oxygène d'urgence
  description: Un réservoir facilement portable pour les urgences. Contient très peu d'oxygène, homologué pour survie uniquement. Il peut contenir 0,66 L de gaz.
  components:
  - type: Sprite
    sprite: Objects/Tanks/emergency.rsi
  - type: Item
    size: Small
    sprite: Objects/Tanks/emergency.rsi
    storedRotation: -45
  - type: GasTank
    air:
      volume: 0.66
      temperature: 293.15
  - type: Clothing
    sprite: Objects/Tanks/emergency.rsi
    slots:
    - Pocket
    - Belt
    - suitStorage
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: Tag # Goobstation - For survival boxes
