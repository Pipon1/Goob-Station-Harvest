- type: entity
  parent: BaseItem
  name: remplaceur d'ampoules
  id: LightReplacer
  description: Un appareil utilisant des aimants pour remplacer facilement les ampoules cassées. Rechargez en ajoutant des ampoules supplémentaires dans le remplaceur.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Janitorial/light_replacer.rsi
  - type: LightReplacer
    contents:
    - id: LightTube
      amount: 8
    - id: LightBulb
      amount: 5
  - type: StaticPrice
    price: 100
  - type: ContainerContainer
    containers:
      light_replacer_storage: !type:Container
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 25
      Glass: 125
  - type: Tag
    tags:
    - DroneUsable # Goobstation

- type: entity
  parent: LightReplacer
  id: LightReplacerEmpty
  suffix: Empty
  components:
  - type: LightReplacer
    contents:
    - id: LightTube
      amount: 0