# non-projectile / "gun" staves

# wand that gives lights an RGB effect.
- type: entity
  id: RGBStaff
  parent: BaseItem
  name: Staff RVB
  description: Aide à résoudre le manque d'équipement RVB sur la station.
  components:
  - type: LimitedCharges
    maxCharges: 25
  - type: AutoRecharge
    rechargeDuration: 30
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/staves.rsi
    layers:
    - state: nothing
    - state: nothing-unshaded
      shader: unshaded
  - type: ActionOnInteract
    requiresCharge: true
    actions:
    - ActionRgbLight
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: staff-inhand-left
      - state: staff-inhand-left-unshaded
        shader: unshaded
      right:
      - state: staff-inhand-right
      - state: staff-inhand-right-unshaded
        shader: unshaded
  - type: RgbLightController
  - type: PointLight
    enabled: true
    radius: 2

- type: entity
  id: AnimationStaff
  parent: BaseItem
  name: Staff d'animation
  description: Un artefact qui crache des boulons de force vitale, animant les objets qu'il touche et leur donnant vie !
  components:
  - type: LimitedCharges
    maxCharges: 6
  - type: AutoRecharge
    rechargeDuration: 8
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/staves.rsi
    layers:
    - state: animation
  - type: ActionOnInteract
    requiresCharge: true
    actions:
    - ActionAnimateSpell
  - type: Item
    size: Huge
    inhandVisuals:
      left:
      - state: animation-inhand-left
      right:
      - state: animation-inhand-right
  - type: Tag
    tags:
    - WizardStaff
  - type: Clothing
    sprite: _Goobstation/Wizard/Objects/Weapons/Staves/animation.rsi
    quickEquip: false
    slots:
      - Back
      - suitStorage
    clothingVisuals:
      back:
      - sprite: _Goobstation/Wizard/Objects/Weapons/Staves/animation.rsi
        state: equipped-BACKPACK
      suitstorage:
      - sprite: _Goobstation/Wizard/Objects/Weapons/Staves/animation.rsi
        state: equipped-BACKPACK
  - type: StaticPrice
    price: 50000

- type: entity
  parent: BaseAction
  id: ActionRgbLight
  components:
  - type: TargetAction
  - type: EntityTargetAction
    whitelist: { components: [ PointLight ] }
    event: !type:ChangeComponentsSpellEvent
      toAdd:
      - type: RgbLightController
