- type: entity
  parent: BaseAction
  id: ActionFireball
  name: Boule de feu
  description: Lance une boule de feu explosive vers l'emplacement cliqué.
  components:
  - type: Magic
    requiresSpeech: true # Goobstation
    school: Explosion # Goobstation
  - type: Sprite # Goobstation - for apprentices
    sprite: _Goobstation/Wizard/actions.rsi
    state: fireball
  - type: Action
    useDelay: 6 # Goobstation?
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Goobstation/Wizard/actions.rsi # Goob edit
      state: fireball # Goob edit
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFireball
      speed: 20 # Goobstation?
  - type: SpeakOnAction
    sentence: action-speech-spell-fireball
  - type: ActionUpgrade
    effectedLevels:
      2: ActionFireballII
      3: ActionFireballIII

- type: entity
  parent: ActionFireball
  id: ActionFireballII
  name: Boule de feu II
  description: Lance une boule de feu, mais plus rapide !
  components:
  - type: Action
    useDelay: 4 # Goob edit

- type: entity
  parent: ActionFireball
  id: ActionFireballIII
  name: Boule de feu III
  description: La boule de feu la plus rapide de l'ouest !
  components:
  - type: Action
    useDelay: 2 # Goob edit
