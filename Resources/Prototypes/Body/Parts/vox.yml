  id: ChestVox
  name: "torse de vox"
  components:
    - type: Sprite
      sprite: Mobs/Species/Vox/parts.rsi
      state: "chest_m"
    - type: Icon
      sprite: Mobs/Species/Vox/parts.rsi
      state: "chest_m"
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Fat
          Quantity: 3
        - ReagentId: AmmoniaBlood
          Quantity: 10

- type: entity
