- type: entity
  abstract: true
  parent: BasePart # Shitmed Change
  id: PartVoxBase
  name: "partie du corps de vox"
  components:
  - type: Sprite
    sprite: Mobs/Species/Vox/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Vox/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Vox
  - type: WoundableVisuals
    damageOverlayGroups:
