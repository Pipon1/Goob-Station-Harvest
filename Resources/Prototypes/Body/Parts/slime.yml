# Shitmed Change: Removed components from each part, instead using composition for sprites
- type: entity
  id: PartSlime
  parent: [BaseItem, BasePart]
  name: "partie du corps de slime"
  abstract: true
  components: # Shitmed Change
  - type: Sprite
    sprite: Mobs/Species/Slime/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi
  - type: BodyPart
    species: SlimePerson
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#2cf274"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Damageable # Shitmed
    damageModifierSet: Slime
  - type: Boneless # Goob Edit
    bonePenalty: 0.7

- type: entity
  id: ChestSlime
  name: "torse de slime"
  parent: [PartSlime, BaseChest]
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/parts.rsi
      state: "chest_m"

- type: entity
  id: GroinSlime
  name: "aine de slime"
  parent: [PartSlime, BaseGroin]
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/parts.rsi
      state: "groin_m"

- type: entity
  id: HeadSlime
  name: "stête de slime"
  parent: [PartSlime, BaseHead]

- type: entity
  id: LeftArmSlime
  name: "bras gauche de slime"
  parent: [PartSlime, BaseLeftArm]

- type: entity
  id: RightArmSlime
  name: "bras droit de slime"
  parent: [PartSlime, BaseRightArm]

- type: entity
  id: LeftHandSlime
  name: "main gauche de slime"
  parent: [PartSlime, BaseLeftHand]

- type: entity
  id: RightHandSlime
  name: "main droite de slime"
  parent: [PartSlime, BaseRightHand]

- type: entity
  id: LeftLegSlime
  name: "jambe gauche de slime"
  parent: [PartSlime, BaseLeftLeg]

- type: entity
  id: RightLegSlime
  name: "jambe droite de slime"
  parent: [PartSlime, BaseRightLeg]

- type: entity
  id: LeftFootSlime
  name: "pied gauche de slime"
  parent: [PartSlime, BaseLeftFoot]

- type: entity
  id: RightFootSlime
  name: "pied droit de slime"
