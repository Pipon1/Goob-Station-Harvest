- type: entity
  id: PartGingerbread
  parent: [BaseItem, BasePart]
  name: "partie du corps de bonhomme en pain d'épices"
  abstract: true
  components:
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#896e55"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Icon # Shitmed Change
    sprite: Mobs/Species/Gingerbread/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Gingerbread
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Gingerbread

- type: entity
  id: ChestGingerbread
  name: "torse de bonhomme en pain d'épices"
  parent: [PartGingerbread, BaseChest]
  components:
  - type: Sprite
    sprite: Mobs/Species/Gingerbread/parts.rsi
    state: "chest_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 20

