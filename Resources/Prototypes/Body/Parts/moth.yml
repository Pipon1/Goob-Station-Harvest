- type: entity
  id: PartMoth
  parent: [BaseItem, BasePart]
  name: "partie du corps de mite"
  abstract: true
  components:
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Icon # Shitmed Change
    sprite: Mobs/Species/Moth/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Moth
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Moth

- type: entity
  id: ChestMoth
  name: "torse de mite"
  parent: [PartMoth, BaseChest]
  components:
  - type: Sprite
    sprite: Mobs/Species/Moth/parts.rsi
    state: "chest_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

