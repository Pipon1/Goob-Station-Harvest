- type: entity
  id: OrganVoxLungs
  parent: OrganHumanLungs
  description: "Les poumons bleus et anaérobies d'un vox, ils absorbent l'azote pour respirer. Toute forme d'oxygène gazeux est mortellement toxique s'il est inhalé."
  suffix: "vox"
  name: poumons de vox # Shitmed
  components:
  - type: Sprite
    sprite: Mobs/Species/Vox/organs.rsi
  - type: Metabolizer
    metabolizerTypes: [ Vox ]
  - type: Lung
    alert: LowNitrogen
  - type: Item
    size: Small
    heldPrefix: lungs

- type: entity
  parent: OrganHumanStomach
  id: OrganVoxStomach
  name: estomac
  description: "Un estomac qui sent l'ammoniaque."
