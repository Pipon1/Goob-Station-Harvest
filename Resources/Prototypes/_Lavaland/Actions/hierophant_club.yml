# Hierophant club
- type: entity
  id: ActionHierophantClubTileMovement
  name: Malédiction du mouvement par cases
  description: Force la cible à ne se déplacer que par cases.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -23
    useDelay: 30
    icon:
      sprite: /Textures/_Lavaland/Interface/Alerts/hierophantbeat.rsi
      state: hierophant
    itemIconStyle: NoItem
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    event: !type:ToggleTileMovementActionEvent

- type: entity
  id: ActionHierophantClubBlink
  parent: ActionBaseHierophant
  name: Blink
  description: Vous téléporte à n'importe quelle position que vous pouvez physiquement atteindre.
  components:
  - type: Action
    raiseOnUser: true
    priority: -24
    useDelay: 10
    icon:
      sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
      state: icon
  - type: TargetAction
    checkCanAccess: true
    range: 10
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent
