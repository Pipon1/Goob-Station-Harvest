# Entity Shape Attacks
- type: entity
  id: ActionBaseHierophant
  parent: BaseAction
  name: action hiérophante
  abstract: true
  components:
  - type: Action
    priority: -21
    useDelay: 2
    icon:
      sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
      state: icon
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction

- type: entity
  id: ActionHierophantBox
  parent: ActionBaseHierophant
  name: Boîte expansive
  description: Fait apparaître une boîte expansive à la position de la cible.
  components:
  - type: AngerDelayAction
    minDelay: 1.5
    maxDelay: 4.0
    inverse: true
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantShapeBoxExpanding

- type: entity
  id: ActionHierophantCrosses
  parent: ActionBaseHierophant
  name: Séquence de croix
  description: Fait apparaître une séquence de croix à la position de la cible.
  components:
  - type: AngerDelayAction
    minDelay: 1.5
    maxDelay: 4.0
    inverse: true
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantShapeCrossSequence
      attachToTarget: true

- type: entity
  id: ActionHierophantChasers
  parent: ActionBaseHierophant
  name: Apparition de poursuivants
  description: Fait apparaître des poursuivants de cases hiérophante qui se déplacent vers la cible.
  categories: [ HideSpawnMenu ]
  components:
  - type: AngerDelayAction
    minDelay: 7.0
    maxDelay: 20.0
    inverse: true
  - type: EntityTargetAction # Without a target it's pretty much useless?
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandHierophantChaser
      spawnAtUser: true

- type: entity
  id: ActionHierophantBlink
  parent: ActionBaseHierophant
  name: Blink
  description: Vous téléporte à la position de la cible.
  components:
  - type: AngerDelayAction
    minDelay: 3.0
    maxDelay: 10.0
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent
