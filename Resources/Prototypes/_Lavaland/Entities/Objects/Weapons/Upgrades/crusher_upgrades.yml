# Important Note!
# Crusher upgrade entities have the exact same ID as their respective TagPrototype.
# Remember to take this into account when adding new upgrades!

# Main Upgrades
- type: entity
  id: BaseCrusherUpgradeMain
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: capsule d'amélioration du crusher
  description: Un modkit pour les armes crusher.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - CrusherUpgradeMain

- type: entity
  id: CrusherUpgradeMainMarker
  parent: BaseCrusherUpgradeMain
  name: capsule d'amélioration du crusher (marqueur cinétique)
  description: Générateur compact d'un champ bluespace qui peut être tiré sur une cible vivante pour la rendre plus vulnérable aux attaques de crusher. Son projectile peut également détruire certains types de roches.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: kinetic-marker
  - type: ItemUpgrade
    name: gun-upgrade-crusher-kinetic-marker-name
    uniqueGroup: mainUpgrade
  - type: GunUpgradeComponents
    components:
    - type: AmmoCounter
    - type: UseDelayOnShoot
    - type: GunRequiresWield
    - type: Gun
      soundGunshot: /Audio/Weapons/plasma_cutter.ogg
      fireRate: 1
      useKey: false
    - type: MapRestricted
      mapWhitelist:
        components:
        - Biome
    - type: MapRestrictedGun
      popupOnBlock: gun-lavaland-restricted-message
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 1
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    - type: BasicEntityAmmoProvider
      proto: BulletCharge
      capacity: 1
      count: 1
  - type: Tag
    tags:
    - CrusherUpgradeMain
    - CrusherUpgradeMainMarker

# TODO turn it into an action gun and add auto-targeting
# TODO make it charge when doing hits to an entity, instead of just a cooldown
- type: entity
  id: CrusherUpgradeMainRudeBuster
  parent: BaseCrusherUpgradeMain
  name: capsule d'amélioration du crusher (rude buster)
  description: Concentre la détermination de l'utilisateur en lui-même et l'émet comme un projectile semi-magique. On peut voir quelque chose rebondir constamment à l'intérieur.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: rude-buster
  - type: ItemUpgrade
    name: gun-upgrade-crusher-rude-buster-name
    uniqueGroup: mainUpgrade
  - type: GunUpgradeComponents
    components:
    - type: AmmoCounter
    - type: UseDelayOnShoot
    - type: GunRequiresWield
    - type: Gun
      projectileSpeed: 12 # Needed for the trail to look good
      soundGunshot: /Audio/Weapons/plasma_cutter.ogg
      fireRate: 10
      useKey: false
    - type: MapRestricted
      mapWhitelist:
        components:
        - Biome
    - type: MapRestrictedGun
      popupOnBlock: gun-lavaland-restricted-message
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 8
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    - type: BasicEntityAmmoProvider
      proto: ProjectileRudeBuster
      capacity: 1
      count: 1
  - type: Tag
    tags:
    - CrusherUpgradeMain
    - CrusherUpgradeMainRudeBuster

# Blade upgrades
- type: entity
  id: BaseCrusherUpgradeBlade
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: amélioration de lame du crusher
  description: Un modkit pour les armes crusher.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - CrusherUpgradeBlade

- type: entity
  id: CrusherUpgradeBladeLavaAspect
  parent: BaseCrusherUpgradeBlade
  name: amélioration de lame du crusher (aspect lave)
  description: Un cristal fait de lave qui ne refroidit jamais, le rendant constamment chaud et hautement inflammable.
  components:
  - type: Sprite
    state: lava-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-lava-aspect
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Heat: 5
  - type: WeaponUpgradeEffects
    effects:
    - !type:Flammable
      multiplier: 2
      multiplierOnExisting: 0.5
    - !type:Ignite
    - !type:AdjustTemperature
      amount: 7500 # thermal energy, not temperature!
  - type: Construction
    graph: CrusherUpgradeLavaCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeLavaAspect

- type: entity
  id: CrusherUpgradeBladeIceFrost
  parent: BaseCrusherUpgradeBlade
  name: amélioration de lame du crusher (givre de glace)
  description: Un cristal qui émet du froid, probablement en violant les lois de la thermodynamique.
  components:
  - type: Sprite
    state: ice-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-ice-frost
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Cold: 4 # Less because no armors protect from it
  - type: WeaponUpgradeEffects
    effects:
    - !type:AdjustTemperature
      amount: -7500 # thermal energy, not temperature! That's not that great actually, but it slows down the target after enough hits
  - type: Construction
    graph: CrusherUpgradeIceCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeIceFrost

- type: entity
  id: CrusherUpgradeBladeSharpness
  parent: BaseCrusherUpgradeBlade
  name: amélioration de lame du crusher (tranchant)
  description: Une simple meule qui améliore les dégâts d'un crusher.
  components:
  - type: Sprite
    state: black-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-sharpness
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Slash: 7 # Let's just say crusher hammer becomes extra-sharp on the sides
  - type: Construction
    graph: CrusherUpgradeCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeSharpness

# Handle upgrades
- type: entity
  id: BaseCrusherUpgradeHandle
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: amélioration de manche du crusher
  description: Un modkit pour les armes crusher.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - CrusherUpgradeHandle

- type: entity
  id: CrusherUpgradeHandleWeights
  parent: BaseCrusherUpgradeHandle
  name: amélioration de manche du crusher (poids)
  description: Un ensemble de charges lestées qui peuvent être attachées à un manche pour faire projeter les ennemis en arrière.
  components:
  - type: Sprite
    state: handle-weights
  - type: ItemUpgrade
    name: gun-upgrade-crusher-weights
  - type: GunUpgradeComponents
    components:
    - type: FlipOnHit
    - type: MeleeThrowOnHit
      distance: 3
      speed: 3
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleWeights

- type: entity
  id: CrusherUpgradeHandleLight
  parent: BaseCrusherUpgradeHandle
  name: amélioration de manche du crusher (léger)
  description: Un remplacement de manche léger qui permet d'attaquer plus fréquemment.
  components:
  - type: Sprite
    state: handle-lightweight
  - type: ItemUpgrade
    name: gun-upgrade-crusher-lightweight
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.3 # 30% faster
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleLightweight

- type: entity
  id: CrusherUpgradeHandleRange
  parent: BaseCrusherUpgradeHandle
  name: amélioration de manche du crusher (portée)
  description: Un remplacement de manche long qui permet d'attaquer plus fréquemment.
  components:
  - type: Sprite
    state: handle-spikes # Why spikes improve range? Cuz they're badass.
  - type: ItemUpgrade
    name: gun-upgrade-crusher-range
  - type: WeaponUpgradeRange
    rangeMultiplier: 1.2 # 20% longer
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleRange

- type: entityTable
  id: CrusherUpgradesMain
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeMainMarker
    - id: CrusherUpgradeMainRudeBuster

- type: entityTable
  id: CrusherUpgradesBlade
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeBladeLavaAspect
    - id: CrusherUpgradeBladeIceFrost
    - id: CrusherUpgradeBladeSharpness

- type: entityTable
  id: CrusherUpgradesHandle
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeHandleWeights
    - id: CrusherUpgradeHandleLight
    - id: CrusherUpgradeHandleRange

- type: entityTable
  id: CrusherUpgrades
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: CrusherUpgradesMain
    - !type:NestedSelector
      tableId: CrusherUpgradesBlade
    - !type:NestedSelector
      tableId: CrusherUpgradesHandle
      weight: 2 # They are uncraftable for now so need more chances
