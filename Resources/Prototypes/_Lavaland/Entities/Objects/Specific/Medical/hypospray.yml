- type: entity
  name: medipen de survie
  parent: ChemicalMedipen
  id: SurvivalMedipen
  description: Un mélange de puissants produits chimiques curatifs. Soigne lentement les dégâts et stabilise la température corporelle. Vous pouvez faire une overdose si vous en utilisez plus d'un en succession rapide.
  components:
  - type: Sprite
    sprite: /Textures/_Lavaland/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: survivalpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: survivalpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 40
        reagents:
          - ReagentId: MinersSalve
            Quantity: 20
          - ReagentId: Leporazine
            Quantity: 10
          - ReagentId: Epinephrine
            Quantity: 10

# doesn't get any better than this
- type: entity
  name: medipen de luxe
  parent: ChemicalMedipen
  id: LuxuryMedipen
  description: Contient de puissants produits chimiques utilisés pour aider à l'exploration d'environnements hostiles. Produits chimiques relativement nocifs et moins efficaces lorsqu'ils sont utilisés hors de basse pression.
  components:
  - type: Sprite
    sprite: /Textures/_Lavaland/Objects/Specific/Medical/luxmedipen.rsi
    layers:
    - state: luxpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: luxpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 50
        reagents:
        - ReagentId: Luxurium
          Quantity: 20
        - ReagentId: Leporazine
          Quantity: 10
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: TranexamicAcid
          Quantity: 10
