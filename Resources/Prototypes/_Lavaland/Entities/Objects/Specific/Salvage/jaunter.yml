- type: entity
  parent: BaseItem
  id: LavalandJaunter
  name: sauteur
  description: Un appareil complexe fonctionnant grâce à la technologie du bluespace, qui peut vous téléporter hors des zones dangereuses. Vous devriez l'avoir sur vous quand vous marchez près d'un gouffre.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/Salvage/jaunter.rsi
    state: icon
  - type: Item
    size: Small
  - type: PreventChasmFalling

- type: entity
  parent: LavalandJaunter
  id: LavalandJaunterRecharging
  name: sauteur expérimental
  components:
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: UseDelay
    delay: 120
