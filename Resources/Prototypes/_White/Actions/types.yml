- type: entity
  parent: BaseAction
  id: ToggleNightVision
  name: Basculer la Vision Nocturne
  description: Active ou désactive la vision nocturne.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: ToggleThermalVision
  name: Basculer la Vision Thermique
  description: Active ou désactive la vision thermique.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent

- type: entity
  id: PulseThermalVision
  parent: ToggleThermalVision
  name: Vision Thermique Pulsée
  description: Active temporairement la vision thermique.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 4
