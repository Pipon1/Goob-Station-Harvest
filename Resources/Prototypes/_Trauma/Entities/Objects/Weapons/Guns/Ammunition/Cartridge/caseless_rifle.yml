- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifleTranquilizer
  name: cartouche (.25 sans étui tranquillisant)
  description: Un petit calibre utilisant la technologie sans étui, omettant le laiton conventionnel au profit d'un propulseur durci. Un réservoir injecte un mélange de sédatif et de toxine muette dans la cible pour de véritables abattages silencieux.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifleTranquilizer
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#49cece"
  - type: ChemicalAmmo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: Nocturine
          Quantity: 2.5
        - ReagentId: MuteToxin
          Quantity: 1
  - type: SolutionTransfer
    maxTransferAmount: 3.5

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePoison
  name: cartouche (.25 sans étui toxique)
  description: Un petit calibre utilisant la technologie sans étui, omettant le laiton conventionnel au profit d'un propulseur durci. Une charge toxique est installée pour tuer la cible au fil du temps.
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePoison
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#5f959c"
  - type: ChemicalAmmo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: Lexorin
          Quantity: 1.5
  - type: SolutionTransfer
    maxTransferAmount: 1.5
