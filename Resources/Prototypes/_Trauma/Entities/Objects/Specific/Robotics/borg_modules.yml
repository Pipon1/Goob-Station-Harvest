- type: entity
  parent: [ BaseBorgModuleSyndicate, BaseProviderBorgModule, BaseSyndicateContraband ]
  id: BorgModuleSyndicateDartgun
  name: module cyborg pistolet à fléchettes
  components:
  - type: Sprite
    layers:
    - state: syndicate
    - state: icon-syndicate
  - type: ItemBorgModule
    hands:
    - item: DartGun
    - item: Syringe
      hand:
        emptyLabel: borg-slot-injector-dropper-empty
        emptyRepresentative: Syringe
        whitelist:
          tags:
          - Dropper
          - Syringe
    - item: ChemistryEmptyBottle01
      hand: &small_container_hand
        emptyLabel: borg-slot-small-containers-empty
        emptyRepresentative: ChemistryEmptyBottle01
        whitelist:
          tags:
          - Bottle
          - Pill
          - PillCanister
    - item: ChemistryEmptyBottle01
      hand: *small_container_hand
  - type: BorgModuleIcon
    icon: { sprite: _Trauma/Interface/Actions/actions_borg.rsi, state: dart }

