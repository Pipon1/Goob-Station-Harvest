- type: entity
  parent: BaseLogicItem
  id: SignalTimerItem
  name: minuteur
  description: Envoie un signal après un délai spécifié après avoir reçu un signal.
  components:
  - type: Sprite
    layers:
    - state: base
    - sprite: _Mono/Objects/Devices/gates.rsi
      state: timer
  - type: Construction
    node: timer
  - type: SignalTimer
    canEditLabel: false
  - type: DeviceLinkSource
    ports:
    - Start
    - Timer
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: ActivatableUI
    key: enum.SignalTimerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SignalTimerUiKey.Key:
        type: SignalTimerBoundUserInterface
