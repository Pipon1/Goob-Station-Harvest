# Base
- type: entity
  id: FTLDriveBase
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: PointLight
    enabled: false
    color: "#349BEB" # beb color
    radius: 2.0
    energy: 1.5
  - type: LitOnPowered
  - type: ExtensionCableReceiver
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/anomaly_generator.ogg
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.PowerChargeUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PowerChargeUiKey.Key:
        type: PowerChargeBoundUserInterface
  - type: WiresPanel
  - type: StaticPrice
    price: 2000

# Bluespace Drives
# Please sort them with their Priority stat!!!
- type: entity
  id: MachineFTLDrive
  parent: FTLDriveBase
  name: moteur FTL FSS-512 bluespace
  description: Moteur FTL bluespace à faible puissance qui augmente le rayon FTL.
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control600
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: PowerCharge
    windowTitle: ftl-drive-window-title
    idlePower: 100
    activePower: 3000
  - type: Machine
    board: MachineFTLDriveCircuitboard
  - type: FTLDriveGenerator
    priority: 1
    data:
      range: 512
      ftlToSameMap: true
      cooldownTime: 120

- type: entity
  id: MachineFTLDriveHigh
  parent: FTLDriveBase
  name: moteur FTL CTLA-2048 bluespace
  description: Moteur FTL bluespace à haute puissance qui étend considérablement le rayon FTL. Temps de recharge élevé.
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 6000
  - type: PowerCharge
    windowTitle: ftl-drive-window-title
    idlePower: 300
    activePower: 6000
  - type: Machine
    board: MachineFTLDriveHighCircuitboard
  - type: FTLDriveGenerator
    priority: 2
    data:
      range: 2048
      ftlToSameMap: true
      cooldownTime: 180

- type: entity
  id: MachineFTLDriveAutomated
  parent: FTLDriveBase
  name: moteur FTL CTLA-2048 bluespace
  description: Moteur FTL pour transport à route fixe, temps de recharge court au prix de ne fonctionner que pour les routes de transport préconçues de Nanotrasen
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: PowerCharge
    windowTitle: ftl-drive-window-title
    idlePower: 20
    activePower: 1000
  - type: FTLDriveGenerator
    priority: 1
    data:
      ftlToSameMap: false
      cooldownTime: 10
      startupTime: 5
      knockdownTime: 2
      travelTime: 10
      arrivalTime: 4

# Debug drives
- type: entity
  id: MachineFTLDriveDebug
  parent: FTLDriveBase
  name: debug bluespace drive
  description: Super-duper kool drive, only for testing!
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/drive.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 1
  - type: FTLDriveGenerator
    priority: 999
    data:
      range: 5000
      ftlToSameMap: true
      startupTime: 2
      knockdownTime: 1
      travelTime: 5
      arrivalTime: 1
      cooldownTime: 0.5
