- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSurplusBundle
  name: caisse excédentaire du Syndicat
  # Goobstation - Telecrystal rework
  description: Contient l'équivalent de 250 télécrystaux d'articles Syndicat complètement aléatoires. Ça peut être des déchets inutiles ou quelque chose de vraiment bien.
  components:
    - type: SurplusBundle
      totalPrice: 250

- type: entity
  parent: CrateSyndicate
  id: CrateCybersunJuggernautBundle
  name: paquet Mastodonte Cybersun
  suffix: Rempli
  description: Contient tout sauf une grande arme pour péter les plombs.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitJuggernaut
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable

- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSuperSurplusBundle
  name: super caisse excédentaire du Syndicat
  # Goobstation - Telecrystal rework
  description: Contient l'équivalent de 625 télécrystaux d'articles Syndicat complètement aléatoires.
  components:
    - type: SurplusBundle
      totalPrice: 625
