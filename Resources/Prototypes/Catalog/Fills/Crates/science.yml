- type: entity
  parent: CrateScienceSecure
  id: CrateScienceBiosuit
  name: caisse de combinaisons biologiques de scientifiques
  description: Contient 2 combinaisons biologiques pour qu'aucune maladie ne vous détourne de la science. Nécessite l'accès science pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearScience
          rolls: 2
        - id: ClothingMaskSterile
          amount: 2

- type: entity
  parent: CrateScienceSecure
  id: CrateCrewMonitoring
  name: caisse de surveillance d'équipage
  description: Contient un kit de serveur de surveillance d'équipage et quelques ordinateurs de surveillance. Nécessite l'accès science pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CrewMonitoringServerFlatpack
        - id: CrewMonitoringComputerFlatpack
          amount: 3

- type: entity
  parent: CrateScienceSecure
  id: CrateStationAiCore
  name: caisse de noyau d'IA de station
  description: Contient les composants pour construire un noyau d'IA de station. Cerveau positronique pas inclus. Nécessite l'accès science pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: StationAiCoreElectronics
        - id: Intellicard
        - id: SheetPlasteel1
          amount: 4
        - id: CableApcStack1
        - id: SheetRGlass1
          amount: 2
