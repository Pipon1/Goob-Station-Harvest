- type: entity
  parent: CrateChemistrySecure
  id: CrateChemistryP
  name: caisse de produits chimiques (P)
  description: Contient des produits chimiques du bloc P du tableau périodique. Nécessite l'accès à la chimie pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: JugAluminium
        - id: JugCarbon
        - id: JugChlorine
        - id: JugFluorine
        - id: JugIodine
        - id: JugPhosphorus
        - id: JugSulfur
        - id: JugSilicon
        - id: JugOxygen
        - id: JugNitrogen

