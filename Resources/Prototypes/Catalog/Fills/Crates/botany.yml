          amount: 3
        - id: PoppySeeds
          amount: 3

- type: entity
  parent: CrateHydroponics
  id: CrateHydroponicsTools
  name: caisse d'équipements hydroponiques
  description: Fournitures pour cultiver un magnifique jardin ! Contient des vaporisateurs de produits chimiques pour plantes, une hachette, une mini-houe, une faucille, une paire de gants en cuir et un tablier de botaniste.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: HydroponicsToolMiniHoe
        - id: PlantBGoneSpray
        - id: WeedSpray
        - id: PestSpray
        - id: HydroponicsToolClippers
        - id: HydroponicsToolScythe
        - id: HydroponicsToolSpade
        - id: HydroponicsToolHatchet
        - id: ClothingOuterApronBotanist
        - id: ClothingHandsGlovesLeather
        - id: ChemistryBottleEZNutrient
          amount: 2

