- type: entity
  parent: CrateHydroSecure
  id: CrateHydroponicsSeedsExotic
  name: caisse de graines exotiques
  description: Le rêve de tout botaniste ambitieux. Contient de nombreuses graines exotiques variées. Nécessite l'accès à l'hydroponique pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: EggySeeds
          amount: 2
        - id: TowercapSeeds
          amount: 2
        - id: TobaccoSeeds
          amount: 2
        - id: CannabisSeeds
          amount: 2
        - id: NettleSeeds
          amount: 2
        - id: FlyAmanitaSeeds
          amount: 2
        - id: BungoSeeds
          amount: 2

- type: entity
  parent: CrateHydroSecure
  id: CrateHydroponicsSeedsMedicinal
  name: caisse de graines médicinales
  description: Le rêve du chimiste en herbe. Le pouvoir de la médecine est à portée de main ! Nécessite l'accès à l'hydroponique pour l'ouvrir.
