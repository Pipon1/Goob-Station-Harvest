- type: entity
  parent: CrateMedicalSecure
  id: CrateVirologyBiosuit
  name: caisse de combinaisons biologiques de virologie
  description: Contient 2 combinaisons biologiques pour qu'aucune maladie ne vous détourne du traitement de l'équipage. Nécessite l'accès médical pour l'ouvrir.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearVirology
          rolls: 2
        - id: ClothingMaskSterile
          amount: 2
