- type: entity
  parent: ClothingBackpackDuffelMedical
  id: ClothingBackpackDuffelSurgeryFilled
  name: sac de sport chirurgical
  description: "Un grand sac de sport pour transporter des fournitures médicales supplémentaires - celui-ci semble être conçu pour contenir des outils chirurgicaux."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Hemostat
        - id: SawElectric # Shitmed Change
        - id: Drill
        - id: Cautery
        - id: Retractor
        - id: Scalpel
        - id: ClothingMaskSterile # Goobstation
        - id: BoneGel # Shitmed Change
        - id: MedicalStitches # Shitmed Change
        - id: ClothingMaskBreath # Goobstation

