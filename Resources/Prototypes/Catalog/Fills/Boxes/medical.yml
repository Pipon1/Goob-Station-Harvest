- type: entity
  name: boîte de seringues
  parent: BoxCardboard
  id: BoxSyringe
  description: Une boîte pleine de seringues.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Syringe
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: syringe

- type: entity
  name: boîte de piluliers
  parent: BoxCardboard
  id: BoxPillCanister
  description: Une boîte pleine de piluliers.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PillCanister
        amount: 9
  - type: Sprite
    layers:
      - state: box
      - state: pillbox

- type: entity
  name: boîte de flacons
  parent: BoxCardboard
  id: BoxBottle
  description: Une boîte pleine de flacons.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ChemistryEmptyBottle01
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: bottle

- type: entity
  name: boîte de masques stériles
  parent: BoxCardboard
  id: BoxSterileMask
  description: Cette boîte contient des masques médicaux stériles.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingMaskSterile
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: sterile

- type: entity
  name: boîte de gants en latex
  parent: BoxCardboard
  id: BoxLatexGloves
  description: Contient des gants en latex stériles.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingHandsGlovesLatex
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: latex

- type: entity
  name: boîte de gants en nitrile
  parent: BoxCardboard
  id: BoxNitrileGloves
  description: Contient des gants en nitrile stériles. Meilleur que le latex.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingHandsGlovesNitrile
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: nitrile

- type: entity
  name: boîte de sacs mortuaires
  parent: BoxCardboard
  id: BoxBodyBag
  description: Contient des sacs mortuaires.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: BodyBagFolded
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: bodybags
  - type: Storage # TODO cardboard boxes shouldn't have whitelisting
    whitelist:
      tags:
        - BodyBag

- type: entity
  name: boîte de fioles
  parent: BoxCardboard
  id: BoxVial
  description: Une boîte pleine de fioles.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ChemistryEmptyVial
          amount: 3
        - id: ChemistryEmptyVialSmall
        rolls: 2 # group the small vials on the right column
  - type: Sprite
    layers:
    - state: box
    - state: vials
