- type: entity
  id: ElectricalDisruptionKit
  parent: [BoxCardboard, BaseSyndicateContraband]
  name: kit de perturbation électrique
  suffix: Rempli
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmpGrenade
          amount: 3
        - id: EmpImplanter

- type: entity
  parent: [BoxVial, BaseSyndicateContraband]
  id: ChemicalSynthesisKit
  name: kit de synthèse chimique
  description: A starter kit for the aspiring chemist, notably includes a chemical payload and timer, a hyperzine syringe, and two vials of vestine for all your criminal needs! # Goobstation
  components:
  - type: Storage
    grid:
    - 0,0,3,2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Beaker
        #  amount: 2
        - id: TimerTrigger # Goobstation
        - id: Dropper
        # It would be cool to have special "syndicate" chemical analysis goggles
        - id: ClothingEyesGlassesChemical
        - id: VestineChemistryVial
          amount: 2
        #- id: ChemistryEmptyVial # Goobstation
        # - id: Syringe # Goobstation
        - id: ChemicalPayload # Goobstation
        - id: SyringeStimulants

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ThrowingKnivesKit
  name: kit de couteaux de lancer
  description: Un ensemble de 8 couteaux de lancer du Syndicat, parfaits pour s'enfoncer dans le corps de vos victimes.
  components:
  - type: Storage
    grid:
    - 0,0,3,3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ThrowingKnife
        amount: 8
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: throwing_knives

- type: entity
  name: boîte d'implants de râle de mort
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxDeathRattleImplants
  description: Six implants de râle de mort pour toute l'escouade.
  components:
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: syringe
  - type: Storage
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: DeathRattleImplanter
        amount: 6

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: CombatBakeryKit
  name: kit de boulangerie de combat
  description: Un kit d'armes de boulangerie clandestines.
  components:
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: france
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: WeaponCroissant
          amount: 2
        - id: WeaponBaguette
        - id: SyndicateMicrowaveMachineCircuitboard
        - id: PaperWrittenCombatBakeryKit
