- type: entity
  name: boîte de grenades nettoyantes
  parent: BoxCardboard
  id: BoxCleanerGrenades
  description: Une boîte pleine de grenades nettoyantes.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CleanerGrenade
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: flashbang

- type: entity
  name: Kit NT « L'AgroChimie, c'est Fun »
  parent: BoxCardboard
  id: BoxAgrichem
  description: Pour le botaniste en herbe prêt à apprendre à maximiser les rendements agricoles. Cette boîte fanée doit avoir au moins 50 ans.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PaperAgrichemManual
        - id: ChemistryEmptyBottle01
        - id: ChemistryBottlePotassium
        - id: ChemistryBottlePhosphorus
        - id: ChemistryBottleNitrogen
        - id: ChemistryBottleHydrogen
        - id: ChemistryBottleEthanol
        - id: RadiumChemistryVial
        - id: ChlorineChemistryVial
  - type: Sprite
    layers:
      - state: boxwide
      - state: agrichemkit
  - type: GuideHelp
    guides:
    - Botanical
    - Chemicals

