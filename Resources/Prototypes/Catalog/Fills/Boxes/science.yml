- type: entity
  name: boîte de béchers
  parent: BoxCardboard
  id: BoxBeaker
  description: Une boîte pleine de béchers.
  components:
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LargeBeaker
          amount: 2
        - id: Beaker
          amount: 2
  - type: Sprite
    layers:
      - state: box
      - state: beaker