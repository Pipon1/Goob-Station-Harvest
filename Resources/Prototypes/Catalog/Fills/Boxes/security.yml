- type: entity
  name: boîte de menottes
  parent: BoxCardboard
  id: BoxHandcuff
  description: Une boîte pleine de menottes.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Handcuffs
        amount: 4
  - type: Sprite
    layers:
    - state: box_security
    - state: handcuff

