- type: entity
  parent: BaseSuicideAction
  id: DionaGibAction
  name: Se fragmenter !
  description: Se séparer en 3 nymphes.
  components:
  - type: Action
    icon:
      sprite: Mobs/Species/Diona/organs.rsi
      state: brain
  - type: InstantAction
    event: !type:GibActionEvent {}
  - type: MansusGraspBlockTrigger

- type: entity
  parent: BaseAction
  id: DionaReformAction
  name: Se reformer
  description: Se reformer en un Diona entier.
  components:
  - type: Action
    useDelay: 600 # Once every 10 minutes. Keep them dead for a fair bit before reforming
    icon:
      sprite: Mobs/Species/Diona/parts.rsi
      state: full
  - type: InstantAction
    event: !type:ReformEvent {}
