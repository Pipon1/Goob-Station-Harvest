- type: entity
  parent: BaseAction
  id: ActionToggleInternals
  name: (Dés)activer les réserves internes
  description: Respirez depuis le réservoir de gaz équipé. Nécessite également un masque respiratoire équipé.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Alerts/internals.rsi
      state: internal2
    iconOn:
      sprite: Interface/Alerts/internals.rsi
      state: internal1
  - type: InstantAction
    event: !type:ToggleActionEvent
