# Actions added to mobs in crit.
- type: entity
  abstract: true
  parent: BaseMentalAction
  id: BaseCritAction
  components:
  - type: Action
    itemIconStyle: NoItem

- type: entity
  parent: BaseCritAction
  id: ActionCritSuccumb
  name: Succomber
  description: Acceptez votre destin.
  components:
  - type: Action
    startDelay: true
    useDelay: 10
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: InstantAction
    event: !type:CritSuccumbEvent

- type: entity
  parent: BaseCritAction
  id: ActionCritFakeDeath
  name: Feindre la mort
  description: Faites semblant de rendre votre dernier souffle tout en restant en vie.
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: fakedeath
  - type: InstantAction
    event: !type:CritFakeDeathEvent

- type: entity
  parent: ActionCritSuccumb # for use delay
  id: ActionCritLastWords
  name: Dire ses derniers mots
  description: Chuchotez vos derniers mots à quiconque se trouve à proximité, puis succombez à votre destin. Vous ne disposez que de 30 caractères.
  components:
  - type: Action
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: lastwords
  - type: InstantAction
    event: !type:CritLastWordsEvent
