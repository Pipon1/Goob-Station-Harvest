- type: entity
  parent: BaseMentalAction # allow reading laws when crit
  id: ActionViewLaws
  name: Voir les lois
  description: Voir les lois que vous devez respecter.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: state-laws
    useDelay: 0.5
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent

- type: entity
  parent: BaseAction
  id: ActionSelectBorgType
  name: Sélectionner le type de cyborg
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: select-type
    useDelay: 0.5
  - type: InstantAction
    event: !type:BorgToggleSelectTypeEvent
