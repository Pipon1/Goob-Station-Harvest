- type: entity
  abstract: true
  parent: BaseAction
  id: BaseMechAction
  components:
  - type: Action
    itemIconStyle: NoItem

- type: entity
  parent: BaseMechAction
  id: ActionMechCycleEquipment
  name: Faire défiler
  description: Fait défiler l'équipement actuellement sélectionné
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_cycle_equip_on
  - type: InstantAction
    event: !type:MechToggleEquipmentEvent

- type: entity
  parent: BaseMechAction
  id: ActionMechOpenUI
  name: Panneau de contrôle
  description: Ouvre le panneau de contrôle du mech
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_view_stats
  - type: InstantAction
    event: !type:MechOpenUiEvent

- type: entity
  parent: BaseMechAction
  id: ActionMechEject
  name: Éjecter
  description: Éjecte le pilote du mech
  components:
  - type: Action
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_eject
  - type: InstantAction
    event: !type:MechEjectPilotEvent
