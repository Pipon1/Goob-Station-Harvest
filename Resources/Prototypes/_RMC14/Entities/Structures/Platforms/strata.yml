# Sorokyne Strata

- type: entity
  parent: CMPlatform
  id: RMCPlatformStrata
  name: bordure métallique surélevée
  description: Un niveau de métal surélevé, souvent utilisé pour élever des zones au-dessus d'autres. Vous pourriez probablement l'escalader.
  components:
  - type: Sprite
    state: strata_metalplatform

- type: entity
  parent: CMPlatformBroken
  id: RMCPlatformStrataBroken
  name: bordure métallique surélevée détruite
  components:
  - type: Sprite
    state: strata_metalplatform_broken

