# Sorokyne Rock
- type: entity
  parent: CMPlatform
  id: RMCPlatformStrataRock
  name: bordure de rocher de glace
  description: Un bloc solide de rochers et de glace désolés. On dirait que vous pourriez l'escalader avec un peu de difficulté.
  components:
  - type: Sprite
    state: strata_rock_platform

- type: entity
  parent: CMPlatformBroken
  id: RMCPlatformStrataRockBroken
  name: bordure de rocher de glace détruite
  description: Un bloc solide de rochers et de glace désolés. On dirait que vous pourriez l'escalader avec un peu de difficulté. Elle a été détruite.
  components:
  - type: Sprite
    state: strata_rock_platform_broken

- type: entity
  parent: RMCPlatformCornerSmall
  id: RMCPlatformStrataRockCornerSmall
  name: coin de rocher de glace
  description: Un bloc solide de rochers et de glace désolés.
  components:
  - type: Sprite
    state: strata_rock_platform_deco
