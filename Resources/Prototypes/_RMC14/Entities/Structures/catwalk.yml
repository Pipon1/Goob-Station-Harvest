# Monorail

- type: entity
  id: RMCMonorailStraight
  name: voie de monorail
  description: Le système ferroviaire pour le monorail CORSAT.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailStraight
    noRot: false
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: monorailStraight
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk

- type: entity
  parent: RMCMonorailStraight
  id: RMCMonorailBend
  components:
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailBend
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: monorailBend

# Minecart Track

- type: entity
  parent: RMCMonorailStraight
  id: RMCRailroadStraight
  name: rails
  description: Les wagonnets et véhicules sur rails circulent dessus.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadStraight
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: railroadStraight

- type: entity
  parent: RMCRailroadStraight
  id: RMCRailroadBend
  components:
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadBend
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: railroadBend

- type: entity
  parent: RMCRailroadStraight
  id: RMCRailroadBumper
  name: butoirs de rail
  description: Cela (généralement) arrête les wagonnets et autres véhicules sur rails au bout d'une ligne.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadBumper
  - type: Icon
    sprite: _RMC14/Structures/catwalk.rsi
    state: railroadBumper
