- type: entity
  id: RMCFiltration
  name: système de filtration d'eau
  description: Un filtre à eau qui sépare la matière organique et inorganique, les déchets dangereux et les acides corrosifs de l'eau afin qu'elle puisse être traitée davantage.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,1.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: filtration
  - type: Clickable

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationDisinfection
  name: filtre de désinfection
  description: Un filtre à eau spécialement conçu pour séparer les micro-organismes, tels que les virus et les bactéries, de l'eau.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: disinfection

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationDistribution
  name: système de distribution des déchets
  description: Cette machine sépare les déchets restants des processus de purification pour être rejetés dans l'espace, recyclés pour des fournitures, ou utilisés pour la recherche.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: distribution

- type: entity
  parent: RMCFiltrationDistribution
  id: RMCFiltrationDistributionDamaged
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: distribution-damaged

- type: entity
  parent: RMCFiltration
  id: RMCFiltrationSedimentation
  name: filtre de sédimentation
  description: Un filtre à eau spécialement conçu pour capturer et éliminer les sédiments, tels que le sable, le limon, la saleté et la rouille, de l'eau sans enlever les minéraux nutritifs pour ce goût pur et frais à chaque fois.
  components:  
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: sedimentation

- type: entity
  parent: RMCFiltrationSedimentation
  id: RMCFiltrationSedimentationAlt
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-1.49,1.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: sedimentation_A_1

- type: entity
  parent: RMCFiltration
  id: RMCCoagulationArm
  name: bras de coagulation
  description: Un axe à quatre faces, conçu pour tourner afin d'aider à filtrer l'eau.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 60
        layer:
        - MobMask
  - type: Sprite
    sprite: _RMC14/Structures/Filtration/96x96.rsi
    state: coagulation_arm