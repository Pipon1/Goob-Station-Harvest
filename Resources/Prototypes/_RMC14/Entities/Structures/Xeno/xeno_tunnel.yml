- type: entity
  id: XenoTunnel
  name: tunnel
  description: Une entrée de tunnel. On dirait qu'il a été creusé par une sorte de bête à griffes.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: hole
    noRot: true
  - type: InteractionOutline
  - type: Clickable

- type: entity
  parent: XenoTunnel
  id: XenoTunnelMaint
  name: Trappe de maintenance
  description: Une entrée vers un tunnel de maintenance. On y voit des morceaux de limace et de résine. Des débris vous empêchent de regarder de plus près.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_tunnel.rsi
    state: maintenancehatch_alt

- type: entity
  parent: XenoTunnelMaint
  id: XenoTunnelMaintNoXenoDesc
  description: Une entrée vers un tunnel de maintenance. Des débris vous empêchent de regarder de plus près.

- type: entity
  parent: XenoTunnelMaint
  id: XenoTunnelMaintHybrisa
  name: Regard d'égout
  components:
